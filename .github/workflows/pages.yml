name: Deploy GitHub Pages

on:
  push:
    branches: [claude/antimicrobial-nhi-query-page-9s4r4p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 確認資料檔可解析，避免把壞掉的資料部署出去
      - name: Validate data
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/antimicrobials.json'))
          items = d['items']
          assert items, 'no items'
          assert d['meta']['status'] == 'imported', d['meta']['status']
          print('OK: %d 個條號，版本 %s' % (len(items), d['meta']['version']))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
