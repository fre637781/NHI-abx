name: Deploy GitHub Pages

on:
  push:
    branches: [claude/antimicrobial-nhi-query-page-9s4r4p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 確認 index.json 與各主題資料檔可解析，避免把壞掉的資料部署出去
      - name: Validate data
        run: |
          python3 - <<'PY'
          import json, os
          index = json.load(open('data/index.json'))
          topics = index['topics']
          assert topics, 'index.json 沒有任何主題'
          total = 0
          for t in topics:
              assert os.path.exists(t['file']), '缺少主題資料檔 %s' % t['file']
              d = json.load(open(t['file']))
              assert d['items'], '%s 沒有任何條文' % t['file']
              assert d['meta']['status'] == 'imported', \
                  '%s 尚未匯入官方資料（status=%s）' % (t['file'], d['meta']['status'])
              total += len(d['items'])
              print('OK %-16s %3d 項  版本 %s' % (t['id'], len(d['items']), d['meta']['version']))
          print('共 %d 個主題、%d 項條文' % (len(topics), total))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
