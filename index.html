<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>感染科給付規定查詢</title>
<meta name="description" content="健保藥品給付規定感染科常用章節查詢：抗微生物劑（第10節）、免疫製劑（第8節）與給付通則，可依藥名、分類、事前審查等條件檢索。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128138;</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#results">跳至查詢結果</a>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <h1 id="siteTitle">感染科<span> 給付規定查詢</span></h1>
      <p class="sub" id="sectionName">健保藥品給付規定</p>
    </div>
    <button id="themeToggle" class="ghost-btn" type="button" aria-label="切換深色/淺色模式">🌓</button>
  </div>
</header>

<div class="notice wrap" id="dataNotice" role="status">
  <strong id="noticeStatus">資料狀態載入中…</strong>
  <span id="noticeText"></span>
</div>

<main class="wrap">
  <nav class="topic-tabs" id="topicTabs" aria-label="條文主題"></nav>

  <section class="search-panel" aria-label="查詢條件">
    <div class="search-row">
      <label class="visually-hidden" for="q">搜尋藥名或條文</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜尋藥名、商品名、適應症、條號或條文關鍵字（按 / 快速聚焦）">
      <button id="clearBtn" class="ghost-btn" type="button" title="清除所有條件">清除</button>
    </div>

    <div class="filter-group" role="group" aria-label="藥品分類">
      <span class="filter-label">分類</span>
      <div id="catChips" class="chips"></div>
    </div>

    <div class="filter-group" role="group" aria-label="給付方式">
      <span class="filter-label">給付</span>
      <div id="fundChips" class="chips"></div>
    </div>

    <div class="filter-group" role="group" aria-label="條件標記">
      <span class="filter-label">限制</span>
      <div id="flagChips" class="chips"></div>
    </div>

    <div class="filter-group" role="group" aria-label="其他選項">
      <span class="filter-label">其他</span>
      <div id="extraChips" class="chips"></div>
    </div>
  </section>

  <div class="toolbar">
    <p id="count" class="count" aria-live="polite"></p>
    <div class="toolbar-actions">
      <label class="sort-label" for="sort">排序</label>
      <select id="sort">
        <option value="section">依條號</option>
        <option value="category">依分類</option>
        <option value="title">依藥名</option>
      </select>
      <button id="expandAll" class="ghost-btn" type="button">全部展開</button>
      <button id="printBtn" class="ghost-btn" type="button">列印</button>
    </div>
  </div>

  <section id="results" class="results" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>找不到符合條件的項目。請放寬關鍵字或清除篩選條件。</p>
</main>

<section class="wrap firstline-panel" id="firstLinePanel" hidden>
  <details class="card">
    <summary>
      <div class="card-top"><span class="badge first">附表一</span></div>
      <h2 id="firstLineTitle">全民健康保險醫療常用第一線抗微生物製劑品名表</h2>
      <p class="summary-text">依通則規定，處方應優先使用第一線抗微生物製劑；此表為官方附表一內容。</p>
    </summary>
    <div class="card-body">
      <div class="fl-cols">
        <div><h3>口服</h3><ul id="flOral" class="drug-list"></ul></div>
        <div><h3>注射</h3><ul id="flInj" class="drug-list"></ul></div>
      </div>
    </div>
  </details>
</section>

<footer class="site-footer">
  <div class="wrap">
    <p><strong>免責聲明：</strong>本頁條文擷取自健保署官方 PDF，但本站<b>非官方文件</b>，轉檔可能有排版誤差。給付條件、條號與生效日期一律以中央健康保險署最新公告為準，用藥決策請對照官方原文與專業判斷。</p>
    <p id="sourceLine"></p>
    <p class="meta" id="metaLine"></p>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
