:1},{"text":"(5)多發性硬化症(multiple sclerosis)。","level":1},{"text":"7.須停止治療的情形","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者。","level":1},{"text":"(2)其他事項：包括i 惡性腫瘤ii 該藥物引起之嚴重毒性 (白血球過低、嚴重過敏)iii嚴重感染(暫時停藥即可)。◎附表二十六之三：全民健康保險小兒克隆氏症使用 adalimumab、infliximab、risankizumab申請表(106/5/1、108/10/1、113/7/1、113/9/1)◎附表二十六之四：PCDAI（Pediatric Crohn’s disease activity index）","level":1}],"limited":false,"revisions":["105/10/1","106/5/1","108/10/1","111/2/1","113/7/1","113/9/1","114/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-8","section":"8.2.4.8","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Abatacept 靜脈注射劑（如 Orencia IV） ：用於幼年型慢性關節炎治療部分","drugs":[{"generic":"Abatacept","zh":"","brands":["Orencia IV"]}],"funding":"nhi","summary":"給付條件：","provisions":[{"text":"1.給付條件：","level":0},{"text":"(1)限用於曾經接受抗腫瘤壞死因子拮抗劑(如 etanercept)治療，但未達療效或無法耐受之6歲以上有幼年型慢性關節炎之患者。 （108/1/1、111/2/1）I.Etanercept 的療效：i.紅血球沉降速率 (ESR) 或 CRP 及下列三項中至少有二項達到較基礎值改善30%以上效果者。a.活動性關節炎的總數。b.關節活動範圍受到限制的關節總數。c.醫師的整體評估。ii. 上述各種指標惡化程度達30%以上者不得超過一項II.無法耐受的定義：無法忍受 etanercept 治療的副作用。","level":1},{"text":"(2)需與methotrexate 併用（但對 methotrexate 過敏，或 methotrexate 引起嚴重血球低下、肝毒性及其它嚴重副作用者除外） 。","level":1},{"text":"2.限具有風濕病專科醫師證書之內科、小兒科專科醫師或具有小兒過敏免疫專科醫師證書之小兒科專科醫師處方。","level":0},{"text":"3.年齡大於18歲的病患應由具有風濕病專科醫師證書之內科專科醫師或具有小兒過敏免疫專科醫師證書之小兒科專科醫師重新評估病情，改依成人治療（8.2.4.2）規定申請。 （108/1/1）","level":0},{"text":"4.需經事前審查核准後使用：","level":0},{"text":"(1)申請初次治療時，應檢附曾經使用抗腫瘤壞死因子拮抗劑之用藥結果，包括種類、劑量、關節腫脹治療前後的相關照片或關節 X 光檢查報告、及副作用報告等資料。","level":1},{"text":"(2)使用abatacept 之後，每6個月需再申請一次；需描述使用藥物後的療效、副作用或併發症。","level":1},{"text":"5.需排除abatacept 使用的情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性的感染症的病患。","level":1},{"text":"(3)未經完整治療之結核病的患者（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)","level":1},{"text":"(4)身上帶有人工關節者，罹患或先前曾罹患過嚴重的敗血症(sepsis)者。","level":1},{"text":"(5)惡性腫瘤或具有癌症前兆 (pre-malignancy) 的病患。","level":1},{"text":"(6)免疫功能不全者 (Immunodeficiency)。","level":1},{"text":"6.需停止abatacept 治療的情形如果發生下列現象應停止治療：","level":0},{"text":"(1)不良事件，包括：","level":1},{"text":"Ⅰ.惡性腫瘤。","level":3},{"text":"Ⅱ.該藥物引起的嚴重毒性。","level":3},{"text":"Ⅲ.懷孕 (暫時停藥即可)。","level":3},{"text":"Ⅳ.嚴重的間發性感染症 (intercurrent infection)(暫時停藥即可)。","level":3},{"text":"(2)療效不彰：患者的 core set data 經過6個月治療後未達療效者。療效定義：","level":1},{"text":"Ⅰ.紅血球沉降速率 (ESR) 或 CRP 及下列三項中至少有二項達到較基礎值改善30%以上效果者。i.活動性關節炎的總數ii.關節活動範圍受到限制的關節總數iii.醫師的整體評估","level":3},{"text":"Ⅱ.上述各種指標惡化程度達30%以上者不得超過一項。◎附表三十一：全民健康保險使用 abatacept 申請表(六歲以上兒童)","level":3}],"limited":false,"revisions":["101/10/1","102/1/1","104/8/1","108/1/1","111/2/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-9","section":"8.2.4.9","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Golimumab（如 Simponi）、Adalimumab（如 Humira）、Vedolizumab（如 Entyvio）、infliximab（如 Remicade）、tofacitinib（如 Xeljanz）、ustekinumab（如 Stelara）、upadacitinib（如 Rinvoq） ：用於潰瘍性結腸炎治療部分","drugs":[{"generic":"Golimumab","zh":"","brands":["Simponi"]},{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"Vedolizumab","zh":"","brands":["Entyvio"]},{"generic":"infliximab","zh":"","brands":["Remicade"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]}],"funding":"nhi","summary":"Golimumab（如 Simponi）、Adalimumab（如 Humira）、Vedolizumab（如 Entyvio）、infliximab（如 Remicade）、tofacitinib（如 Xeljanz）、ustekinumab（如 Stelara）、upadacitinib（如…","provisions":[],"limited":false,"revisions":["105/9/1","105/10/1","106/10/1","107/8/1","108/10/1","111/3/1","111/6/1","112/8/1","113/7/1","113/11/1","114/8/1","114/9/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":true},{"id":"sec-8-2-4-9-1","section":"8.2.4.9.1","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Golimumab（如 Simponi）、Adalimumab（如 Humira）、Vedolizumab（如 Entyvio）、infliximab（如 Remicade）、tofacitinib（如 Xeljanz） ustekinumab（如 Stelara）、upadacitinib（如 Rinvoq） ：成人治療部分","drugs":[{"generic":"Golimumab","zh":"","brands":["Simponi"]},{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"Vedolizumab","zh":"","brands":["Entyvio"]},{"generic":"infliximab","zh":"","brands":["Remicade"]},{"generic":"tofacitinib ustekinumab","zh":"","brands":["Xeljanz"]},{"generic":"upadacitinib","zh":"","brands":["Stelara","Rinvoq"]}],"funding":"nhi","summary":"限具有消化系專科證書者處方。","provisions":[{"text":"1.限具有消化系專科證書者處方。","level":0},{"text":"2.須經事前審查核准後使用。","level":0},{"text":"3.須經診斷為成人潰瘍性結腸炎，並符合下列條件之一：","level":0},{"text":"(1)同時符合下列條件：","level":1},{"text":"Ⅰ.領有潰瘍性結腸炎重大傷病卡（直腸型排除） 。","level":3},{"text":"Ⅱ.經5-aminosalicylic acid 藥物(如 sulfasalazine、mesalamine 或balsalazide)、類固醇、及免疫調節劑(如 azathioprine 或6-mercaptopurine)充分治療無效(須有病歷完整記載用藥史，連續治療達6個月以上)，或對5-aminosalicylic acid 藥物、免疫調節劑產生嚴重藥物副作用。","level":3},{"text":"Ⅲ.Mayo score ≧9分且 Mayo Endoscopic subscore ≧2分(需檢附兩個月內之大腸鏡報告，內含可供辨識之彩色照片)。","level":3},{"text":"(2)急性嚴重的潰瘍性結腸炎，同時符合下列四要件:","level":1},{"text":"Ⅰ.內視鏡下符合潰瘍性結腸炎。","level":3},{"text":"Ⅱ.病理切片排除巨細胞病毒腸炎、阿米巴結腸炎、淋巴癌。","level":3},{"text":"Ⅲ.糞便檢測排除困難梭狀桿菌感染。","level":3},{"text":"Ⅳ.Mayo Score 為12分，經類固醇全劑量靜脈注射(如 methylprednisolone 40-60mg/day 等)連續治療5天無效。","level":3},{"text":"4.療效評估與繼續使用：","level":0},{"text":"(1)初次申請：golimumab 以2週(使用2劑)、adalimumab 以6週(使用4劑)、vedolizumab 6週(使用靜脈注射3劑為限)，或以2週(使用靜脈注射2劑為限)、infliximab 以6週(使用靜脈注射3劑為限) ，或以2週(使用靜脈注射2劑為限)、tofacitinib 以8週為限、upadacitinib 以8週為限(且 tofacitinib 及upadacitinib 限用於其他生物製劑治療失敗或無法耐受之中至重度活動性潰瘍性結腸炎病人，另使用前應排除有血栓風險之病患，且不建議與 azathioprine 與cyclosporine 合併使用) 、ustekinumab 以使用靜脈注射1劑為限，治療後達到臨床反應評估者(第一次續用評估採用 partial Mayo score 評估，相較於初次申請，partial Mayo score 減少≧2分且血便項”rectal bleeding”減少≧1分以上。)，方得申請第一次繼續使用。誘導緩解失敗者，得提出申請轉換他類生物製劑，然同一療程不得合併使用。(105/10/1、106/10/1、107/8/1、108/10/1、","level":1},{"text":"(2)繼續使用者：第一次續用評估採 Partial Mayo Score 評估，最長24週需再續用評估一次。第二次續用評估，必須 Mayo Score≦ 6分，且 Mayo Endoscopicsubscore≦ 1分方可再申請繼續使用。ustekinumab 治療達到部分有效緩解者，經消化系專科醫師評估後，得申請繼續使用，以每隔8週給予皮下注射維持劑量90mg。Golimumab、adalimumab 及 tofacitinib 繼續使用以24週2次為限。Ustekinumab 繼續使用以24週2次或3次為限。Vedolizumab 以24週(使用靜脈注射3劑)或16週(使用靜脈注射2劑) ，或第6週起，每24週(使用皮下注射12劑)。infliximab 繼續使用以24週(使用靜脈注射3劑)或 16週(使用靜脈注射2劑)為限，或第6週起，每24週(使用皮下注射12劑)。Upadacitinib 繼續使用以24週為限。","level":1},{"text":"5.劑量給予方式及總療程：","level":0},{"text":"(1) Golimumab：","level":1},{"text":"Ⅰ.最初第一劑200mg，兩週後第二劑100mg，作為緩解之誘導；有效患者之後每隔4週給予維持劑量50mg(體重大於80公斤病患，每隔4週100mg)，至多持續至50週(使用14劑)，作為緩解之維持。(106/10/1、108/10/1)","level":3},{"text":"Ⅱ.若使用劑量為100mg（含）以上，限使用100mg(1mL)規格量。","level":3},{"text":"(2) Adalimumab：最初第一劑160mg，兩週後第二劑80mg，第四週之第三劑及第六週之第四劑40mg，作為緩解之誘導；之後每隔兩週給予維持劑量40mg，至多持續至54週(使用28劑)，作為緩解之維持。(105/10/1、106/10/1、108/10/1)","level":1},{"text":"(3) Vedolizumab：靜脈注射最初第一劑300mg，兩週後第二劑300mg，第六週之第三劑300mg，作為緩解之誘導；之後每隔八週給予維持劑量300mg，至多持續至46週(使用靜脈注射8劑)，或靜脈注射搭配皮下注射共治療52週，使用靜脈注射2劑誘導緩解，皮下注射24劑，作為緩解之維持。(106/10/1、108/10/1、112/8/1)","level":1},{"text":"(4)Infliximab：靜脈注射最初第一劑、兩週後之第二劑、第六週之第三劑給予5mg/kg，作為緩解之誘導；之後每隔八週給予維持劑量5mg/kg，至多持續至46週(使用8劑)，或靜脈注射搭配皮下注射共治療52週，使用靜脈注射2劑誘導緩解，皮下注射24劑，作為緩解之維持。(107/8/1、108/10/1、114/9/1)","level":1},{"text":"(5)Tofacitinib：口服使用每日兩次，最初8週每次10 mg，第9週開始可調整劑量為每日2次5 mg 或每日1次11 mg (Tofacitinib XR)，至多持續至56週，作為緩解之維持。(使用前應排除有血栓風險之病患，且不建議與 azathioprine 與cyclosporine 合併使用)。(111/3/1）","level":1},{"text":"(6)Ustekinumab：第0週給予靜脈輸注作為緩解之誘導（體重≤55kg 使用260 mg;大於55kg 至85kg 使用390mg;>85kg者使用520mg） ；於靜脈注射後的第8週開始給予第1劑皮下注射劑，之後每隔12週或8週給予皮下注射維持劑量90mg，至多持續治療至第44週或第48週(使用5劑或7劑)，作為緩解之維持。(111/6/1、113/11/1)註：若 ustekinumab 使用維持劑量為90mg（含）以上，則限使用90mg(1mL)規格量。(111/6/1)","level":1},{"text":"(7) Upadacitinib：口服使用每日1次，最初8週每日45mg，限用45mg 規格量品項，第9週開始可調整劑量為每日15 mg，至多持續至56週，作為緩解之維持。","level":1},{"text":"6.Golimumab治療50週(使用14劑)；adalimumab 治療54週(使用28劑)；vedolizumab治療46週(使用靜脈注射8劑)，或第0、2週給予靜脈輸注300mg 作為緩解之誘導；第6週開始給予皮下注射維持劑量108mg，之後每隔2週給予皮下注射維持劑量108mg，可持續治療至第52週 (總共使用靜脈注射2劑，皮下注射24劑，療效持續至54週)或 infliximab 治療46週(使用靜脈注射8劑)，或第0、2週給予靜脈輸注2劑作為緩解之誘導；第6週開始給予皮下注射維持劑量120mg，之後每隔2週給予皮下注射維持劑量120mg，可持續治療至第52週(總共使用靜脈注射2劑，皮下注射24劑，療效持續至54週)；tofacitinib 治療56週後; ustekinumab 治療44週使用5劑(共使用1劑靜脈注射及4劑皮下注射)或48週使用7劑(共使用1劑靜脈注射及6劑皮下注射)後；upadacitinib 治療56週後，必須至少再間隔超過3個月後，若病情復發，依初次使用標準(其中經5-aminosalicylic acid 藥物、類固醇、及/或免疫抑制劑充分治療，連續超過3個月)再次提出事前審查。連續2次於總療程結束後復發，且第2次復發於藥效終止後3個月內發生，則可持續使用；惟需每24週提出續用事前審查。必須 Mayo score≦6分且 Mayo endoscopic subscore≦1分，才可繼續使用。連續2年（4次評估）達到 Mayo score≦2分，且 Mayo endoscopic subscore ≦1，則應考慮停藥。(105/10/1、106/10/1、107/8/1、108/10/1、111/3/1、111/6/1、","level":0},{"text":"7.須排除使用之情形：應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性感染症(active infection)之病患。","level":1},{"text":"(3)未經完整治療之結核病病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。","level":1},{"text":"(4)惡性腫瘤或具有癌症前兆(pre-malignancy)之病患(但不包括已經接受過充分治療達10年以上的惡性腫瘤)。","level":1},{"text":"(5)具高度感染機會之病患：慢性腿部潰瘍、導尿管置留、身上有引流管、人工關節感染，該人工關節尚未摘除者、頑固性或復發性之胸腔感染症病患。","level":1},{"text":"(6)多發性硬化症(multiple sclerosis)。","level":1},{"text":"8.須停止治療的情形：","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者。","level":1},{"text":"(2)其他事項包括：","level":1},{"text":"Ⅰ.惡性腫瘤。","level":3},{"text":"Ⅱ.該藥物引起之嚴重毒性(白血球過低、嚴重過敏)。","level":3},{"text":"Ⅲ.懷孕(暫時停藥即可)。","level":3},{"text":"Ⅳ.嚴重間發性感染(暫時停藥即可)。◎附表二十六之五：全民健康保險潰瘍性結腸炎使用生物製劑申請表(113/7/1、◎附表二十六之六：Mayo Score(113/7/1)","level":3}],"limited":false,"revisions":["105/9/1","105/10/1","106/10/1","107/8/1","108/10/1","111/3/1","111/6/1","112/8/1","113/7/1","113/11/1","114/8/1","114/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-9-2","section":"8.2.4.9.2","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Infliximab（如 Remicade 靜脈注射）、adalimumab（如 Humira）","drugs":[{"generic":"Infliximab","zh":"","brands":["Remicade 靜脈注射"]},{"generic":"adalimumab","zh":"","brands":["Humira"]}],"funding":"nhi","summary":"(107/8/1、108/10/1、111/2/1、111/5/1、113/7/1、114/9/1） ：兒童治療部分","provisions":[{"text":"(107/8/1、108/10/1、111/2/1、111/5/1、113/7/1、114/9/1） ：兒童治療部分","level":0},{"text":"1.限具有消化系專科醫師證書之內科、兒科專科醫師處方使用。","level":0},{"text":"2.須經事前審查核准後使用。","level":0},{"text":"3.Adalimumab限使用於5歲以上未滿6歲之經診斷為小兒潰瘍性結腸炎患者，infliximab 使用於6歲以上經診斷為小兒潰瘍性結腸炎患者，並符合下列條件之一：(111/5/1)","level":0},{"text":"(1) 同時符合下列條件：","level":1},{"text":"Ⅰ.領有潰瘍性結腸炎重大傷病卡（直腸型排除） 。","level":3},{"text":"Ⅱ.經5-aminosalicylic acid 藥物(如 sulfasalazine、mesalamine 或balsalazide)、類固醇、及免疫調節劑(如 azathioprine 或6-mercaptopurine)充分治療無效(須有病歷完整記載用藥史，連續治療達3個月以上)，或對5-aminosalicylic acid 藥物、免疫調節劑產生嚴重藥物副作用。","level":3},{"text":"Ⅲ.PUCAI≧35分 (需檢附兩個月內報告)，或合併生長遲緩(height velocityZ score -1 to 2.5)孩童經營養治療與免疫抑制劑治療失敗者。","level":3},{"text":"(2)急性嚴重的潰瘍性結腸炎，同時符合下列四要件：","level":1},{"text":"Ⅰ.內視鏡下符合潰瘍性結腸炎。","level":3},{"text":"Ⅱ.病理切片排除巨細胞病毒腸炎、阿米巴結腸炎、淋巴癌。","level":3},{"text":"Ⅲ.糞便檢測排除困難梭狀桿菌感染。","level":3},{"text":"Ⅳ.PUCAI 為50分，經類固醇全劑量靜脈注射[如 prednisolone 1-2mg/kg/day(最大劑量每日 40-60 mg)、methylprednisolone 0.8-1.6mg/kg/day(最大劑量每日32-48 mg)等]連續治療5天無效。","level":3},{"text":"4.療效評估與繼續使用：","level":0},{"text":"(1)初次申請：infliximab 以6週(使用3劑)、adalimumab 以6週(使用4劑)為限，治療後達到臨床反應評估者(PUCAI 減少20分或 PUCAI＜10分)，方得申請繼續使用。(111/5/1)","level":1},{"text":"(2)繼續使用者：續用評估必須 PUCAI 較初次申請減少20分或 PUCAI＜10分，方得申請繼續使用。infliximab 以24週 (使用3劑)及16週(使用2劑)各1次為限。adalimumab 繼續使用以24週(使用12劑)2次為限。(108/10/1、111/5/1)","level":1},{"text":"5.劑量給予方式及總療程：","level":0},{"text":"(1)Infliximab 最初第一劑、兩週後之第二劑、第六週之第三劑給予5mg/kg，作為緩解之誘導；之後每隔八週給予維持劑量5mg/kg，至多持續至46週(使用8劑)，作為緩解之維持。 (108/10/1)","level":1},{"text":"(2)Adalimumab：(111/5/1)","level":1},{"text":"Ⅰ.20公斤至未滿40公斤: 最初第一劑80 mg，兩週後第二劑40 mg，之後每隔兩週給予維持劑量40 mg。","level":3},{"text":"Ⅱ.40公斤(含)以上:最初第一劑160 mg，兩週後第二劑80mg，之後每隔兩週給予維持劑量80mg。","level":3},{"text":"Ⅲ.治療至多持續至54週(使用28劑)，作為緩解之維持。","level":3},{"text":"6.Infliximab治療46週(使用8劑)、adalimumab 治療54週(使用28劑)後，必須至少再間隔超過3個月後，若病情復發，依初次使用標準再次提出事前審查，連續2次因療程結束而暫緩用藥疾病復發，且第2次復發於藥效終止後3個月內發生，則可持續使用，惟需每24週提出續用事前審查。連續2年(4次評估)達到 PUCAI < 5分，則應考慮停藥。(108/10/1、111/5/1、113/7/1)","level":0},{"text":"7.須排除使用之情形：應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性感染症(active infection)之病患。","level":1},{"text":"(3)未經完整治療之結核病病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。","level":1},{"text":"(4)惡性腫瘤或具有癌症前兆(pre-malignancy)之病患(但不包括已經接受過充分治療達10年以上的惡性腫瘤)。","level":1},{"text":"(5)具高度感染機會之病患：慢性腿部潰瘍、導尿管置留、身上有引流管、人工關節感染，該人工關節尚未摘除者、頑固性或復發性之胸腔感染症病患。","level":1},{"text":"(6)多發性硬化症(multiple sclerosis)。","level":1},{"text":"8.須停止治療的情形：","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者。","level":1},{"text":"(2)其他事項包括：","level":1},{"text":"Ⅰ.惡性腫瘤。","level":3},{"text":"Ⅱ.該藥物引起之嚴重毒性(白血球過低、嚴重過敏)。","level":3},{"text":"Ⅲ.懷孕(暫時停藥即可)。","level":3},{"text":"Ⅳ.嚴重間發性感染(暫時停藥即可)。◎附表二十六之七：全民健康保險小兒潰瘍性結腸炎使用 adalimumab、infliximab申請表(113/7/1)◎附表二十六之八小兒潰瘍性結腸炎 PUCAI Score","level":3}],"limited":false,"revisions":[],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-10","section":"8.2.4.10","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira） 用於小兒葡萄膜炎治療部分","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]}],"funding":"nhi","summary":"限使用於2-17歲小兒非感染性葡萄膜炎患者。","provisions":[{"text":"1.限使用於2-17歲小兒非感染性葡萄膜炎患者。","level":0},{"text":"2.限具有眼科專科、風濕病專科醫師證書之內科、或具有小兒過敏免疫專科醫師證書之醫師處方。","level":0},{"text":"3.需事前審查核准後使用。","level":0},{"text":"(1)申報時需檢附 methotrexate使用的劑量、治療時間、副作用、及前房發炎細胞的病情描述。","level":1},{"text":"(2)每24週需再申請一次；需描述使用 adalimumab 後的療效、副作用或併發症。","level":1},{"text":"4.需同時符合下述(1)(2)兩項條件者方可使用。","level":0},{"text":"(1)最近3個月葡萄膜炎處於活動期 (定義為前房發炎細胞大於等於+1價)。","level":1},{"text":"(2)標準療法失敗，定義為 methotrexate 10毫克/身體表面積平方米/週的口服或注射治療達3個月以上，前房發炎細胞仍大於等於+1價。若因藥物毒性無法忍受，以致於無法達到上項要求時，劑量可以酌情降低。","level":1},{"text":"5.療效評估與繼續使用:","level":0},{"text":"(1)初次申請 adalimumab 以24週為限。起始劑量(loading dose)和維持劑量如下:","level":1},{"text":"Ⅰ.<30公斤:起始劑量為40 mg，隔週給予維持劑量，維持劑量為每隔一週給予20mg。","level":3},{"text":"Ⅱ. ≥30公斤:起始劑量為80 mg，隔週給予維持劑量，維持劑量為每隔一週給予40mg。","level":3},{"text":"(2)繼續使用 adalimumab 者，每24週評估療效一次。","level":1},{"text":"6.須停止使用adalimumab 的情形：","level":0},{"text":"(1)療效不彰：定義為24週 adalimumab 治療後，出現以下任一情形：","level":1},{"text":"Ⅰ.前房發炎細胞比基礎值未改善或惡化。","level":3},{"text":"Ⅱ.有眼球共病惡化(如視神經水腫、黃斑囊樣水腫或視力衰退)或治療期間發展出新的眼球共病。","level":3},{"text":"(2)不良事件，包括：","level":1},{"text":"Ⅰ.惡性腫瘤。","level":3},{"text":"Ⅱ.該藥物引起的嚴重毒性。","level":3},{"text":"Ⅲ.嚴重的間發性感染症 (intercurrent infection)(暫時停藥即可)。","level":3},{"text":"7.需排除使用的情形應參照藥物仿單，重要之排除使用狀況包括 (以下未列者參照仿單所載)：","level":0},{"text":"(1)罹患活動性的感染症的病患。","level":1},{"text":"(2)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查）","level":1},{"text":"(3)身上帶有人工關節者，罹患或先前曾罹患過嚴重的敗血症(Sepsis)者。","level":1},{"text":"(4)惡性腫瘤或具有癌症前兆(pre-malignancy)的患者。","level":1}],"limited":false,"revisions":["109/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-11","section":"8.2.4.11","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Guselkumab（如 Tremfya） ：用於掌蹠膿皰症治療部分","drugs":[{"generic":"Guselkumab","zh":"","brands":["Tremfya"]}],"funding":"nhi","summary":"限內科專科醫師且具有風濕或免疫專科醫師證書者，或皮膚科專科醫師處方。","provisions":[{"text":"1.限內科專科醫師且具有風濕或免疫專科醫師證書者，或皮膚科專科醫師處方。","level":0},{"text":"2.給付條件: 限用於經照光治療及其他全身性治療無效，或因醫療因素而無法接受其他全身性治療之中、重度掌蹠膿皰症，且影響功能之患者。","level":0},{"text":"(1)中重度掌蹠膿皰症：PPPASI(Palmoplantar Pustulosis Area and SeverityIndex ) ≧12。","level":1},{"text":"(2)所稱治療無效，指治療後嚴重度仍符合上列第(1)點情況。i.治療必須包括以下三種全身性治療之至少兩種，包括 methotrexate、acitretin、cyclosporin。ii.治療需至少使用3個月，但育齡女性，得不經 acitretin 使用。iii.照光治療應依學理，如光化療法(PUVA)及窄頻 UVB(nb-UVB)必須每週至少2次，寬頻 UVB 併用焦油每週至少3次，並依學理逐漸增加至有效可忍受劑量。申請時必須附病歷影印及詳細照光劑量紀錄。iv.Methotrexate 合理劑量需達每週15mg, cyclosporin 合理劑量需達2.5-5mg/kg/d, acitretin 為0.3-1 mg/kg/d。但若因為藥物毒性無法耐受，使用劑量可酌情降低。","level":1},{"text":"(3)所稱無法接受治療：i.Methotrexate：指因肝功能異常或切片第三期 a 異常，經6個月後切片仍無改善，或第三期 b 以上之肝切片異常，病毒性肝炎帶原或腎功能異常而無法使用methotrexate 治療者。ii.Acitretin：指有明顯肝功能異常、高血脂無法有效控制，或 cyclosporin有效但停藥後迅速復發，已持續使用超用1年，或已產生腎毒性經減量後無法有效控制者。","level":1},{"text":"3.需經事前審查核准後使用：","level":0},{"text":"(1)初次申請時，以6個月為1個療程，持續使用時每6個月需再申報一次，且應於期滿前1個月提出。","level":1},{"text":"(2)Guselkumab 起始於第0週投予100 mg，接著於第4週投予100mg，之後每8週投予100mg，且於16週時，須先行評估，至少有 PPPASI 25療效。不得同時併用其他生物製劑。","level":1},{"text":"(3)初次申請後每6個月須再次申請續用，續用時，與初次治療前之療效達 PPPASI 50方可使用。停藥超過3個月再申請者，視同新申請案件，否則視為續用案件。","level":1},{"text":"4.使用生物製劑時，考慮其於掌蹠膿皰症療效可能較慢，及立即停藥之可能反彈現象，治療前兩個月得合併使用照光治療，但生物製劑療效出現時即應逐漸停用。","level":0},{"text":"5.需排除使用的情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性的感染症的病患。","level":1},{"text":"(3)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。","level":1},{"text":"(4)身上帶有人工關節者，罹患或先前曾罹患過嚴重的敗血病(sepsis)者。","level":1},{"text":"(5)惡性腫瘤或具有癌症前兆(pre-malignancy)的病患。","level":1},{"text":"(6)免疫功能不全者(immunodeficiency) 。","level":1},{"text":"6.需停止治療情形，如果發生下列現象應停止治療：","level":0},{"text":"(1)不良事件，包括：i.惡性腫瘤。ii.該藥物引起的嚴重性毒性。iii.懷孕（暫時停藥即可） 。iv.嚴重的間發性感染症（intercurrent infection） （暫時停藥即可） 。","level":1},{"text":"(2)療效不彰：患者經過6個月治療（初次療程）後未達療效者，療效定義指 PPPASI改善未達50%。","level":1},{"text":"7.暫緩續用之相關規定：","level":0},{"text":"(1)暫緩續用時機：使用生物製劑治療2年後符合 PPPASI<12者。","level":1},{"text":"(2)因使用一種生物製劑治療後療效不彰，而轉用另一種不同藥理機轉之生物製劑，以轉用後者之起始日重新計算2年後開始減量之時機。但因無法忍受副作用而轉用相同藥理機轉之生物製劑，轉用前後所使用生物製劑之期間均應計入。","level":1},{"text":"8.暫緩續用後若疾病再復發，可重新申請使用，須符合至少有50%復發(需附上次療程治療前、後，及本次照片)。◎附表二十四之六：全民健康保險掌蹠膿皰症使用生物製劑申請表◎附表二十四之五：掌蹠膿皰症面積暨嚴重度指數【Palmoplantar Pustulosis AreaSeverity Index (PPPASI)】","level":0}],"limited":false,"revisions":["111/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-12","section":"8.2.4.12","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Tocilizumab（如 Actemra）","drugs":[{"generic":"Tocilizumab","zh":"","brands":["Actemra"]}],"funding":"nhi","summary":"用於新型冠狀病毒疾病，需同時符合下述所有條件：","provisions":[{"text":"1.用於新型冠狀病毒疾病，需同時符合下述所有條件：","level":0},{"text":"(1)住院成年病人。","level":1},{"text":"(2)與 dexamethasone 合併使用於嚴重肺炎以上(未使用吸氧治療下 SpO2 ≦94%；需使用吸氧治療、高流量氧氣或非侵襲性呼吸器、使用機械式呼吸器或使用體外膜氧合器葉克膜/ECMO)之患者。或與 dexamethasone 及 remdesivir 合併用於未使用吸氧治療下 SpO2≦ 94%、需使用吸氧治療、高流量氧氣或非侵襲性呼吸器之患者。","level":1},{"text":"2.劑量8mg/kg，單次靜脈注射，最大劑量800mg。","level":0}],"limited":false,"revisions":["113/1/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-13","section":"8.2.4.13","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Baricitinib (Olumiant)","drugs":[{"generic":"Baricitinib","zh":"","brands":[]},{"generic":"Olumiant","zh":"","brands":[]}],"funding":"nhi","summary":"用於新型冠狀病毒疾病，需同時符合下述所有條件：","provisions":[{"text":"1.用於新型冠狀病毒疾病，需同時符合下述所有條件：","level":0},{"text":"(1)住院成年病人。","level":1},{"text":"(2)與dexamethasone 及 remdesivir 合併用於未使用吸氧治療下 SpO2 ≦94%、需使用吸氧治療、高流量氧氣或非侵襲性呼吸器之患者。","level":1},{"text":"2.每日劑量口服4mg，使用14天或至出院。","level":0},{"text":"3.排除懷孕婦女。","level":0}],"limited":false,"revisions":["113/1/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-14","section":"8.2.4.14","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Secukinumab（如 Cosentyx） ：用於化膿性汗腺炎","drugs":[{"generic":"Secukinumab","zh":"","brands":["Cosentyx"]}],"funding":"nhi","summary":"用於中重度化膿性汗腺炎且對傳統全身性療法反應不佳或無法耐受之成人病人：","provisions":[{"text":"1. 用於中重度化膿性汗腺炎且對傳統全身性療法反應不佳或無法耐受之成人病人：","level":0},{"text":"(1) 所稱中重度指 Hurley staging 判定為2-3，至少有5處發炎病灶且影響至少2個解剖區域。","level":1},{"text":"(2) 所稱傳統全身性療法反應不佳或無法耐受，指治療至少3個月後，仍未達 HiSCR50，或已達 HiSCR 50但仍為 Hurley 2 stage 者。","level":1},{"text":"(3) 所稱傳統全身性療法，指至少使用以下兩種或兩種以上藥物治療：ⅠTetracycline（500mg 每日2次）或 doxycycline（50mg 至100mg 每日2次）或 minocycline（100mg 每日1次或每日2次）ⅡAcitretin（0.5-0.9 mg/kg/day） （育齡女性除外）ⅢClindamycin（300mg 每日2次）合併 rifampicin（300mg 每日2次或600mg每日1次）治療。","level":1},{"text":"2. 需排除使用的情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1) 懷孕或正在授乳的婦女。","level":1},{"text":"(2) 罹患活動性的感染症者。","level":1},{"text":"(3) 未經完整治療之結核病病人（包括潛伏結核感染治療未達4週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。","level":1},{"text":"(4) 身上帶有人工關節，罹患或先前曾罹患過嚴重的敗血病者。","level":1},{"text":"(5) 惡性腫瘤或具有癌症前兆（pre-malignancy）者。","level":1},{"text":"(6) 免疫功能不全者（immunodeficiency）。","level":1},{"text":"3. 需停止治療條件：","level":0},{"text":"(1) 不良事件，包括：Ⅰ惡性腫瘤。Ⅱ該藥物引起的嚴重性毒性。Ⅲ懷孕（暫時停藥即可） 。IV 嚴重的間發性感染症（intercurrent infection） （暫時停藥即可） 。","level":1},{"text":"(2) 療效不彰：病人經過6個月治療後未達療效者，療效定義指與初次治療前療效未達 HiSCR 50。","level":1},{"text":"4. 限內科專科醫師且具有風濕或免疫專科醫師證書者，或皮膚科專科醫師處方。","level":0},{"text":"5. 需經事前審查核准後使用：每次使用劑量為300mg，起始於第0，1，2，3和4週，之後每2週給予維持劑量300mg。每次申請給付單次療程30支。","level":0},{"text":"6. 續用規定：單次療程結束後，若再次申請時須同時符合下列條件：","level":0},{"text":"(1) 依初次使用標準再次提出申請。","level":1},{"text":"(2) 復發者傳統全身性療法反應不佳或無法耐受，指使用1.（3）所列兩種或兩種以上藥物治療，且至少3個月後，仍未達 HiSCR 50 方可重新申請治療。上一個療程或療程結束後，至少接受一處或一處以上的廔管（fistula/tunnel）切除手術（excision）或除頂術（deroofing） ，並檢附相關病理報告。","level":1}],"limited":false,"revisions":["114/7/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-5","section":"8.2.5","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Leflunomide（如 Arava、Arheuma）","drugs":[{"generic":"Leflunomide","zh":"","brands":["Arava","Arheuma"]}],"funding":"nhi","summary":"限治療成人類風濕性關節炎，且用於 methotrexate 治療無效，或無法忍受methotrexate副作用時使用。","provisions":[{"text":"1.限治療成人類風濕性關節炎，且用於 methotrexate 治療無效，或無法忍受methotrexate副作用時使用。","level":0},{"text":"2.限治療具活動性的成人乾癬性關節炎，且於 DMARDs（疾病修飾抗風濕病藥物）治療無效後使用。 （97/9/1）","level":0}],"limited":false,"revisions":["92/9/1","93/5/1","97/9/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-6","section":"8.2.6","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"短效干擾素、長效干擾素","drugs":[],"funding":"nhi","summary":"短效干擾素、長效干擾素","provisions":[],"limited":false,"revisions":[],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":true},{"id":"sec-8-2-6-1","section":"8.2.6.1","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Interferon alpha-2a（如 Roferon-A）及 interferon alpha-2b（如 Intron A） ; peginterferon alfa-2a（如 Pegasys）","drugs":[{"generic":"Interferon alpha-","zh":"","brands":["Roferon-A"]},{"generic":"peginterferon alfa-","zh":"","brands":["Intron A","Pegasys"]}],"funding":"nhi","summary":"用於慢性病毒性 B 型或慢性病毒性 C 型肝炎患者之條件如下：","provisions":[{"text":"1.用於慢性病毒性 B 型或慢性病毒性 C 型肝炎患者之條件如下：","level":0},{"text":"(1)用於慢性病毒性 B 型肝炎患者","level":1},{"text":"Ⅰ.HBsAg (+) 超過六個月及 HBeAg (+) 超過三個月，且 ALT 值大於 (或等於)正常值上限五倍以上 (ALT≧5X)，且無肝功能代償不全者。療程為12個月。註：肝代償不全條件為 prothrombin time 延長≧3秒或 bilirubin(total)≧2.0mg/dL，prothrombin time 延長係以該次檢驗 control 值為準。","level":3},{"text":"Ⅱ. HBsAg (+) 超過六個月及 HBeAg (+) 超過三個月，其 ALT 值介於正常值上限二至五倍之間 (2X≦ALT<5X)，且血清 HBV DNA≧20,000 IU/mL 或經由肝組織切片（血友病患及類血友病患經照會消化系專科醫師同意後，得不作切片）證實 HBcAg 陽性並有慢性肝炎變化，無 D 型或 C 型肝炎合併感染，且無肝功能代償不全者，可接受藥物治療，療程為12個月。 （98/11/1、105/10/1）","level":3},{"text":"Ⅲ. HBsAg (+) 超過六個月及 HBeAg (-) 超過三個月，且 ALT 值半年有兩次以上(每次間隔三個月) 大於或等於正常值上限二倍以上 (ALT≧2X)，且血清 HBVDNA≧2,000 IU/mL 或經由肝組織切片（血友病患及類血友病患經照會消化系專科醫師同意後，得不作切片）證實 HBcAg 陽性，無 D 型或 C 型肝炎合併感染，且無肝功能代償不全之患者。療程為12個月。 （98/11/1）IV.符合上述Ⅰ、Ⅱ、Ⅲ條件納入治療計畫且經完成治療後停藥者：經6個月觀察期，復發且符合上述Ⅰ、Ⅱ、Ⅲ條件者，無肝代償不全者，可使用interferon alpha-2a、interferon alpha-2b、peginterferon alfa-2a 再治療（一個療程） ；或以lamivudine 100mg、entecavir 0.5mg、telbivudine600mg、tenofovir disoproxil 或 tenofovir alafenamide 再治療。惟若有肝代償不全者則應儘速使用 lamivudine 100mg、entecavir 1.0mg(每日限使用1粒)、telbivudine 600mg、tenofovir disoproxil 或 tenofovir alafenamide再治療。 （98/11/1、99/5/1、100/6/1、102/2/1、106/1/1、110/3/1、V.符合10.7.3之1及3至4項條件納入治療計畫經完成治療後停藥者：經觀察3至6個月，復發且符合上述Ⅰ、Ⅱ、Ⅲ條件且無肝代償不全者，可使用 interferonalpha-2a、interferon alpha-2b 或 peginterferon alfa-2a 再治療（一個療程） ，或以lamivudine 100mg、entecavir 0.5mg、telbivudine 600mg、tenofovir disoproxil 或 tenofovir alafenamide 再治療。惟若有肝代償不全者，則應儘速使用 lamivudine 100mg、entecavir 1.0mg(每日限使用1粒)、telbivudine 600mg、tenofovir disoproxil 或 tenofovir alafenamide 再治療。 （98/11/1、100/6/1、102/2/1、106/1/1、110/3/1、111/3/1）","level":3},{"text":"Ⅵ.上述Ⅳ及Ⅴ停藥復發者再以口服抗病毒藥物治療之給付療程依 HBeAg(+)或HBeAg(-)而定：HBeAg(+)病患治療至 e 抗原轉陰並再給付最多12個月；HBeAg(-)病患治療至少二年，治療期間需檢驗血清 HBV DNA，並於檢驗血清HBV DNA 連續三次，每次間隔6個月，均檢驗不出 HBV DNA 時停藥，每次療程至多給付36個月。再次復發時得再接受治療，不限治療次數。 （106/1/1、","level":3},{"text":"(2)用於慢性病毒性 C 型肝炎治療時:","level":1},{"text":"Ⅰ.應與 Ribavirin 併用","level":3},{"text":"Ⅱ.限 ALT 值異常者，且 Anti-HCV 與 HCV RNA 均為陽性，或經由肝組織切片（血友病患及類血友病患經照會消化系專科醫師同意後，得不作切片）以 METAVIRsystem 證實輕度纖維化大於或等於 F1及肝炎變化，且無肝功能代償不全者。","level":3},{"text":"Ⅲ.療程依 Viral Kinetics 區分如下: （98/11/1）a、有 RVR (rapid virological response, 快速病毒反應)者，給付治療不超過24週。b、無 RVR，但有 EVR (early virologic response)者，給付治療48週。c、到第12週未到 EVR 者，應中止治療，治療期間不超過16週。d、第一次藥物治療24週後復發者，可以給予第二次治療，不超過48週。※復發的定義:治療完成時，血中偵測不到病毒，停藥後血中病毒又再次偵測到。 （98/11/1）","level":3},{"text":"(3)醫事服務機構及醫師資格：(109/7/1)","level":1},{"text":"Ⅰ.醫院：i.有消化系內科或消化系兒科專科醫師之醫院。ii.醫師資格為前開醫院之消化系內科專科醫師、消化系兒科專科醫師、血液病專科醫師、腫瘤內科專科醫師、癌症相關科醫師及符合器官移植手術資格之專任或兼任專科醫師。iii.前開非消化系專科醫師，需先照會消化系專科醫師，惟愛滋病毒感染患者併有 B 型或 C 肝炎感染者，得由其照護之感染症內科專科醫師開立處方。","level":3},{"text":"Ⅱ.基層院所：i.須具有消化系內科或消化系兒科專任專科醫師之基層院所。ii.肝炎治療醫療資源不足地區及山地離島地區，具有消化系內科或消化系兒科兼任專科醫師之基層院所，亦得開立處方，惟離島地區(如金門縣、連江縣、澎湖縣、台東縣蘭嶼鄉、台東縣綠島鄉)內科醫師之基層院所，亦得開立處方。◎附表三十四：肝炎治療醫療資源不足地區及山地離島地區一覽表","level":3},{"text":"2.限用於下列癌瘤病患「限 interferon alpha-2a（如 Roferon-A）及 interferonalpha-2b（如 Intron A）」（93/4/1、97/8/1、111/2/1）:","level":0},{"text":"(1)Chronic myelogenous leukemia","level":1},{"text":"(2)Multiple myeloma","level":1},{"text":"(3)Hairy cell leukemia","level":1},{"text":"(4)T細胞淋巴瘤病例(限 a-2A、2B type) (87/4/1)。","level":1},{"text":"(5)卡波西氏肉瘤（Kaposi’s sarcoma）病例使用（87/4/1）。","level":1},{"text":"(6) 70歲以下，罹患中、晚期之低度非何杰金氏淋巴瘤(low grade non-Hodgkin’slymphoma)，且具有高腫瘤負荷(high tumor burden)之病患。(89/1/1、111/2/1)(「高腫瘤負荷」定義：第三或第四期病患；或血清 LDH > 350 IU/L；或腫塊大於十公分以上。)","level":1},{"text":"(7)限使用於晚期不能手術切除或轉移性腎細胞癌之病患(限 a-2A type)（89/1/1）","level":1},{"text":"(8)kasabach-Merritt 症候群。 （93/4/1）","level":1},{"text":"(9)用於一般療法無法治療的 Lymphangioma。（93/4/1、97/8/1）","level":1}],"limited":false,"revisions":["92/10/1","109/7/1","92/11/1-C 肝","94/11/1-B 肝","96/10/1","98/11/1","99/5/1-B 肝","100/6/1-B 肝","102/2/1","105/10/1","106/1/1","106/4/1","110/3/1","111/2/1","111/3/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-6-2","section":"8.2.6.2","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Peginterferon alpha-2b（如 Peg-Intron） ； interferon alfacon-1（如 Infergen）","drugs":[{"generic":"Peginterferon alpha-","zh":"","brands":["Peg-Intron"]},{"generic":"interferon alfacon-","zh":"","brands":["Infergen"]}],"funding":"nhi","summary":"限用於下列慢性病毒性 C 型肝炎患者，且應與 ribavirin 併用:","provisions":[{"text":"1.限用於下列慢性病毒性 C 型肝炎患者，且應與 ribavirin 併用:","level":0},{"text":"(1)限 ALT 值異常者，且 Anti-HCV 與 HCV RNA 均為陽性，或經由肝組織切片（血友病患及類血友病患經照會消化系專科醫師同意後，得不作切片） ，以METAVIRsystem 證實輕度纖維化大於或等於 F1及肝炎變化，且無肝功能代償不全者。","level":1},{"text":"(2)療程依 Viral kinetics 區分如下: （98/11/1）","level":1},{"text":"Ⅰ.有 RVR (rapid virological response, 快速病毒反應)者，給付治療不超過24週。","level":3},{"text":"Ⅱ.無 RVR，但有 EVR (early virologic response)者，給付治療48週。","level":3},{"text":"Ⅲ.到第12週未到 EVR 者，應中止治療，治療期間不超過16週。","level":3},{"text":"Ⅳ.第一次治療24週後復發者，可以給予第二次治療，給付不超過48週。","level":3},{"text":"2.醫事服務機構及醫師資格：(109/7/1)","level":0},{"text":"(1)醫院：","level":1},{"text":"Ⅰ.有消化系內科或消化系兒科專科醫師之醫院。","level":3},{"text":"Ⅱ.醫師資格為前開醫院之消化系內科專科醫師、消化系兒科專科醫師、血液病專科醫師、腫瘤內科專科醫師、癌症相關科醫師及符合器官移植手術資格之專任或兼任專科醫師。","level":3},{"text":"Ⅲ.前開非消化系專科醫師，需先照會消化系專科醫師，惟愛滋病毒感染患者併有B 型或 C 肝炎感染者，得由其照護之感染症內科專科醫師開立處方。","level":3},{"text":"(2)基層院所：","level":1},{"text":"Ⅰ.須具有消化系內科或消化系兒科專任專科醫師之基層院所。","level":3},{"text":"Ⅱ.肝炎治療醫療資源不足地區及山地離島地區，具有消化系內科或消化系兒科兼任專科醫師之基層院所，亦得開立處方，惟離島地區(如金門縣、連江縣、澎湖縣、台東縣蘭嶼鄉、台東縣綠島鄉)內科醫師之基層院所，亦得開立處方。◎附表三十四：肝炎治療醫療資源不足地區及山地離島地區一覽表","level":3}],"limited":false,"revisions":["92/10/1","94/10/1","109/7/1","93/7/1","98/11/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":true,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-7","section":"8.2.7","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Rituximab注射劑（如 Mabthera，不同劑型之適用範圍需符合藥品許可證登載之 適應症）：用於類風濕性關節炎之成人治療部分","drugs":[{"generic":"Rituximab","zh":"","brands":["Mabthera，不同劑型之適用範圍需符合藥品許可證登載之 適應症"]}],"funding":"nhi","summary":"用於類風濕性關節炎之成人治療部分：(109/11/1）","provisions":[{"text":"1.用於類風濕性關節炎之成人治療部分：(109/11/1）","level":0},{"text":"(1)給付條件：","level":1},{"text":"Ⅰ.限用於曾經接受抗腫瘤壞死因子 (如 etanercept、adalimumab 或 golimumab等) 治療，但未達療效，或無法耐受的成人活動性類風濕性關節炎患者。i.Etanercept、adalimumab 或 golimumab 的療效：經治療後評估 DAS28總積分下降程度大於等於(≧)1.2，或 DAS28總積分小於3.2者。 （101/7/1）ii.無法耐受的定義：無法忍受 etanercept、adalimumab 或 golimumab 治療的副作用。 （101/7/1）","level":3},{"text":"Ⅱ.需與methotrexate 併用（但對 methotrexate 過敏，或 methotrexate 引起嚴重血球低下、肝毒性及其它嚴重副作用者除外） 。","level":3},{"text":"Ⅲ.給予重複療程之時機：i.與前次治療相隔24週或以上，且ii.符合下列給藥時機規定： DAS28總積分 ≧ 3.2，或與前次接受 rituximab治療後第21週比較，DAS28總積分上升 ≧ 0.6。","level":3},{"text":"Ⅳ.每次療程為靜脈注射500毫克～1,000毫克，兩週後相同劑量再注射一次，共注射兩次。","level":3},{"text":"(2)限內科專科醫師且具有風濕或免疫專科醫師證書者處方。","level":1},{"text":"(3)需經事前審查核准後使用：","level":1},{"text":"Ⅰ.申請初次治療：應檢附曾經使用抗腫瘤壞死因子之用藥結果，包括種類、劑量、治療前後 DAS28積分及副作用報告等資料。並宜記錄患者 HBsAg 及 Anti-HCV 資料(若 HBsAg 檢驗為陽性，宜加作 HBV DNA)。","level":3},{"text":"Ⅱ.申請給予重複療程：符合下列條件者，得再提出申請。i.接受 rituximab 初次治療後第21週評估 DAS28總積分，必須下降程度≧","level":3},{"text":"1.2，或 DAS28總積分 ＜ 3.2 者，方可給予重複療程。ii.重複療程之申請可於治療後第21週提出。申請第1次重複療程者，應先填寫初次療效;申請第2次以上重複療程者，必須填寫前兩次療效。並宜記錄患者發生之重大感染等副作用。","level":0},{"text":"Ⅲ.每次申請時應檢附治療前後之相關照片。 （99/2/1）","level":3},{"text":"(4)需排除或停止使用 rituximab 治療之情形如下：- 對rituximab 過敏- 重度活動性感染症- 未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)- 心衰竭病患（New York Heart Association class IV）- 懷孕或授乳婦女- 未達療效- 藥物引起嚴重毒性◎附表二十三：全民健康保險使用 rituximab 用於類風濕性關節炎申請表","level":1},{"text":"2.Rituximab注射劑與葡萄糖皮質素(glucocorticoids)併用，用於治療中度至重度尋常性天疱瘡(PV)的成人病人部分(限符合藥品許可證登載適應症之藥品)：","level":0},{"text":"(1)限皮膚科、或內科專科醫師且具有風濕或免疫專科醫師證書者處方。","level":1},{"text":"(2)限成人申請，且需經事前審查核准後使用。又申報時應檢附相關病例資料。","level":1},{"text":"(3)給付條件：併用葡萄糖皮質素(glucocorticoids)給付於中度至重度尋常性天疱瘡成人患者，且符合下列條件:","level":1},{"text":"Ⅰ.中度至重度尋常性天疱瘡：PDAI 評估指数為15分以上病人，且以1.0mg/kg/day(含)以上劑量的口服 prednisolone (或等劑量之類固醇)連續治療達6週仍未能控制疾病者，並檢具病理切片報告，及直接免疫螢光染色(DIF)報告，得給予起始劑量。","level":3},{"text":"Ⅱ.類固醇依賴型尋常性天疱瘡：指非新診斷尋常性天疱瘡病人，且以10mg/day 口服 prednisolone(或等劑量之類固醇)治療仍未能控制疾病者。此類病人須提供照相證明、病理切片報告，及直接免疫螢光染色(DIF)報告，證實曾符合上述「Ⅰ中度至重度尋常性天疱瘡」所述之條件，得給予起始劑量。","level":3},{"text":"Ⅲ.經rituximab 自費治療後非類固醇依賴型天疱瘡，此類病人須提供照相證明、病理切片報告及直接免疫螢光染色(DIF)報告，證實曾符合上述Ⅰ及Ⅱ中度至重度尋常性天疱瘡」所述之條件，得給予維持性治療。","level":3},{"text":"Ⅳ.前開Ⅰ及Ⅱ所稱「未能控制疾病」者，指使用 I 或Ⅱ所列藥物治療後，1個月內仍有新的水疱≥3個產生且大於一週仍無法癒合或是舊有水疱病灶仍持續擴大。 （需附照片佐證)。","level":3},{"text":"Ⅴ.若無前開Ⅰ、Ⅱ及Ⅲ所稱之直接免疫螢光染色(DIF)報告，得改以出具採用本國核准之 DSG1/DSG3體外診斷用試劑檢測陽性，醫院或符合 CAP 或 ISO15189認證實驗室之正式報告。在目前尚無本國核准試劑前，可以採用歐盟、日本、美國核准之試劑。","level":3},{"text":"(4)起始治療:1000mg rituximab 以靜脈輸注投予，兩週後投予第二劑1000 mgrituximab 靜脈輸注，同時依據病人嚴重度併用逐漸減量之葡萄糖皮質素(glucocorticoids)療程。","level":1},{"text":"(5)維持治療應於第12個月時靜脈輸注投予500mg 的維持治療，之後每6個月根據臨床評估投予。","level":1},{"text":"(6)若於rituximab 療療程中復發，病人可接受一劑1000mg rituximab 靜脈輸注。醫療專業人員也應根據臨床評估，考慮重新開始或增加病人的葡萄糖皮質素(glucocorticoids)劑量。","level":1}],"limited":false,"revisions":["97/11/1","99/2/1","101/7/1","102/1/1","102/4/1","106/9/1","109/11/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-8","section":"8.2.8","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Palivizumab（如 Synagis）","drugs":[{"generic":"Palivizumab","zh":"","brands":["Synagis"]}],"funding":"nhi","summary":"限符合下列條件之一：","provisions":[{"text":"限符合下列條件之一：","level":0},{"text":"1.出生時，懷孕週數未滿33週之早產兒，最多施打六劑。懷孕週數滿33週但未滿36週之早產兒，最多施打三劑。(106/4/1、111/2/1、111/4/1、114/6/1)","level":0},{"text":"2.併有慢性肺疾病(Chronic Lung Disease；CLD)之早產兒(35週以下)(111/2/1)。","level":0},{"text":"3.1歲以下患有血液動力學上顯著異常之先天性心臟病童。需符合以下條件(111/2/1)：","level":0},{"text":"(1)納入條件：符合下列條件之一Ⅰ非發紺性先天性心臟病合併心臟衰竭：符合下列三項中至少兩項：(1)生長遲滯，體重小於第三百分位；(2)有明顯心臟擴大現象；(3)需兩種以上抗心臟衰竭藥物控制症狀。Ⅱ發紺性先天性心臟病：完全矯正手術（含心導管或是外科手術矯正）前或是矯正手術後仍有發紺或是心臟衰竭症狀者。","level":1},{"text":"(2)排除條件：Ⅰ非嚴重性先天性心臟病：不需藥物控制心臟衰竭，如心房中隔缺損，單純動脈瓣膜輕微狹窄等。Ⅱ嚴重性先天性心臟病，但經心導管或外科手術治療，目前僅殘存輕微血行動力學異常，且無發紺症狀。","level":1},{"text":"(3)施打方式：Ⅰ一歲之內每個月給予15mg/kg palivizumab 肌肉注射一次，直到年齡滿一歲或直到矯正手術(包括開心及心導管手術)為止。Ⅱ一歲之內接受體外循環開心矯正手術者，術後出院前再給一劑。Ⅲ最多施打六劑。","level":1}],"limited":false,"revisions":["99/12/1","102/7/1","106/4/1","111/2/1","111/4/1","114/6/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-9","section":"8.2.9","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Thalidomide（如 Thado）","drugs":[{"generic":"Thalidomide","zh":"","brands":["Thado"]}],"funding":"nhi","summary":"用於中度至重度痲瘋性結節性紅斑(ERYTHEMA NODOSUM LEPROSUM, ENL)出現皮膚徵兆之急性期治療。","provisions":[{"text":"1.用於中度至重度痲瘋性結節性紅斑(ERYTHEMA NODOSUM LEPROSUM, ENL)出現皮膚徵兆之急性期治療。","level":0},{"text":"2.可持續用於預防及抑制 ENL 皮膚徵兆復發。","level":0},{"text":"3.不可單獨用於治療發生中度至重度神經炎之 ENL。","level":0},{"text":"4.需事前審查核准後使用。","level":0}],"limited":false,"revisions":["100/2/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-10","section":"8.2.10","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Eculizumab（如 Soliris）、ravulizumab（如 Ultomiris）、crovalimab（如 Piasky）","drugs":[{"generic":"Eculizumab","zh":"","brands":["Soliris"]},{"generic":"ravulizumab","zh":"","brands":["Ultomiris"]},{"generic":"crovalimab","zh":"","brands":["Piasky"]}],"funding":"nhi","summary":"用於經衛生福利部國民健康署認定之陣發性夜間血紅素尿症患者(crovalimab 限用於13歲以上且體重40公斤以上之陣發性夜間血紅素尿症患者)：(108/6/1、","provisions":[{"text":"1. 用於經衛生福利部國民健康署認定之陣發性夜間血紅素尿症患者(crovalimab 限用於13歲以上且體重40公斤以上之陣發性夜間血紅素尿症患者)：(108/6/1、","level":0},{"text":"(1) 陣發性夜間血紅素尿症患者且 PNH granulocyte clone size 經兩種抗體確認大於50%，並符合下列條件之一者使用：I. 有溶血性貧血，血紅素濃度至少有兩次檢測數值低於7g/dL 或有心肺功能不全症狀（New York Heart Association Class III 或 IV）且血紅素濃度低於9g/dL，並須長期大量輸血（3個月內至少輸血6個單位以上） 。須排除其他原因引起之貧血，包括缺鐵性貧血或出血等。II. 有發生危及生命之虞之血栓並導致明顯器官功能受損者，但須排除其他已知原因引起之血栓。","level":1},{"text":"i. 任何位置之動脈血栓。ii. 重要部位之靜脈性血栓，包括腦部靜脈、靜脈竇、上下腔靜脈、近端深部靜脈、肝靜脈或肝門靜脈血栓等。iii. 發生因血管內溶血導致的進行性腎功能衰竭（serum creatinine 大於2.0mg/dL） ，且無法以其他原因解釋者。","level":2},{"text":"(2) 排除有高危險之骨髓化生不良症候群（RAEB-1或 RAEB-2）的病患。","level":1},{"text":"(3) 需經特殊專案審查核准後使用，每次申請期限為6個月。(101/4/1、115/3/1)","level":1},{"text":"(4) 每6個月須重新評估治療結果。若符合下列條件之一，則不予同意使用。I. 接受治療的患者用藥後病情沒有改善者（LDH 超過正常值上限的1.5倍或最近3個月內輸血多於2個單位）II. PNH granulocyte clone size ≦50%。III.發生嚴重再生不良性貧血者，其檢查結果符合下列兩項或兩項以上者：","level":1},{"text":"i. 中性白血球數目(neutrophil count) <0.5x10/L。ii. 血小板數目( platelet count) <20x109/L。iii. 網狀細胞(reticulocytes) <25x10/L。iv. 骨髓內造血細胞密度<30%。◎附表三十之一：全民健康保險使用陣發性夜間血紅素尿症治療藥品 eculizumab、ravulizumab、crovalimab 特殊專案審查申請表◎附表三十之二：陣發性夜間血紅素尿症患者特殊專案審查申請 Soliris(eculizumab)、Ultomiris (ravulizumab)、Piasky(crovalimab)用藥檢附資料查檢表","level":2},{"text":"2. 用於經衛生福利部國民健康署認定之非典型性尿毒溶血症候群(Atypical HemolyticUremic Syndrome, aHUS)病人：(108/6/1、108/9/1)","level":0},{"text":"(1)定義：非典型性尿毒溶血症候群為突然發生急性腎衰竭、急性溶血性貧血及低血小板(<150,000/μL)符合尿毒溶血症候群診斷，且不合併嚴重 ADAMTS13功能欠損、分泌類志賀氏毒素大腸桿菌(shiga-like toxin-producing E. coli, STEC)感染、肺炎鏈球菌感染，且未具有相關併存疾病、藥物相關或其他等條件(coexistingdiseases/conditions)者。少數也有可能因補體調節異常而產生非典型性尿毒溶血症候群，得視病患各別的情況由專家會議仔細評估及排除典型性尿毒溶血症候群的可能。","level":1},{"text":"(2)治療對血漿治療反應不佳之非典型溶血性尿毒症候群(aHUS)病人，且同時符合下列Ⅰ~Ⅲ之全部條件。I.病人最近一週已進行至少4次的血漿置換或血漿輸液治療，仍出現血小板數<150,000/μL，且比最近一次(須至少一個月前)TMA 之前之3次血小板數平均值低至少25%；若無法取得之過去之血小板檢驗數值，則最進一次發病時之血小板數值須≤ 75,000/μL，且病患最近一週已進行至少4次的血漿置換或血漿輸液治療，仍出現血小板數≤ 100,000/μL。II.LDH 大於正常上限值(＞ upper limit of normal (ULN))，或病人持續接受血漿置換治療，而 LDH 於最近一次發病時至少超過正常上限值。III.血清肌酸酐 (creatinine)大於或等於年齡之正常上限值(≥ ULN for age)，或因急性腎衰竭須要緊急透析治療之病人。","level":1},{"text":"(3)符合尿毒溶血症候群診斷且排除以下情況：I.「典型性尿毒溶血症候群」II.「次發性非典型性尿毒溶血症候群」 ，與下列情形相關者：i.流感ii.肺炎鏈球菌感染iii.分泌類志賀氏毒素大腸桿菌(shiga-like toxin-producing Escherichiacoli)感染iv.thrombotic thrombocytopenic purpura (TTP)v.合併 HELLP (hemolytic anemia, elevated liver enzymes and lowplatelets) syndromevi.使用中藥物，如 calcineurin inhibitors、化學治療、血小板抑制劑、口服避孕藥等vii.其他血栓性微血管病 (thrombotic microangiopathy)，包括惡性高血壓(malignant hypertension)、抗磷脂質症候群 (antiphospholipidsyndrome)、瀰漫性血管內凝血 (disseminated intravascularcoagulation)viii.Cobalamin C 欠損相關之尿毒溶血症候群","level":1},{"text":"(4)病人同時符合下列條件Ⅰ、Ⅱ、Ⅲ及Ⅳ-Ⅷ至少一個器官侵犯時，屬於重症。只有重症才需要使用血漿置換術或 eculizumab 治療 (但使用 eculizumab 之前，仍需符合前述最近一週已進行至少4次的血漿置換或血漿輸液治療反應不佳等條件)：I. 溶血性貧血(Hb 低於10.0g/dl)II.血小板減少(血小板低於150,000/μL)III.血清 LDH 升高(高於各醫院檢驗室之正常值)IV.急性腎衰竭(成人 AKI 第2期以上，兒童請參考表1)V. 腦血管病變(例如腦中風等)VI.心臟障礙(例如缺血性心臟病、心衰竭)VII.呼吸障礙(氧合能力200mmHg < PaO2/FiO2 ≦ 300mmHg + PEEP 或 CPAP≧5cmH2O)VIII.缺血性腸炎、小腸破裂表1急性腎衰竭定義血清肌酸酐(Cr) 尿量病期1 基準值之1.5-1.9倍 6-12小時量低於","level":1},{"text":"0.5ml/公斤體重/小時病期2 基準值之2.0-2.9倍 12小時以上低於","level":0},{"text":"0.5ml/公斤體重/小時病期3 基準值之3倍以上且血清肌酸酐≧4.0mg/dl，且開始腎臟替代療法，在18歲以下則eGFR<35ml/min/1.73m24小時以上<0.3ml/公斤體重/小時或12小時以上無尿*KDIGO Clinical Practice Guideline for Acute Kidney Injury. Kidney Int Suppl2012:2:1-138","level":0},{"text":"(5)用藥禁忌I.病人有嚴重之腦膜炎球菌 (Neisseria meningitis)感染II.病人未施打過腦膜炎球菌疫苗，除非目前病情之權重高於腦膜炎感染之風險","level":1},{"text":"(6)需檢送基因檢測報告經專家小組特殊專案審查核准後使用，每24週須重新申請，必要時得請照護病人之醫師專案報告。(108/9/1)","level":1},{"text":"(7)使用 eculizumab 治療 aHUS 之退場機制：I.Eculizumab 治療有效及無效定義，如下：i.治療有效定義：病人經使用 eculizumab 6個月，其血栓性微血管病變獲得控制(指控制的定義為至少兩次檢驗，間隔超過一個月，血小板回復正常≧150,000/mm3，血紅素回復正常，LDH 下降至正常值下限，持續呈現器官血栓性微血管病變)。ii.治療無效定義：病人經使用 eculizumab 6個月，無法使血栓性微血管病變獲得控制(控制的定義如上)；但須排除劑量不足或藥物經由尿液流失特別是併發腎病症候群患者。II.若治療反應無法達到有效，建議由其他專家再作劑量評估或排除非典型性尿毒溶血症候群之可能。III.退場機制建議如下：i.治療無效ii.慢性腎臟病第五期iii.嚴重腦傷害導致神經性異常重度殘障iv.若病患疾病是由於帶 MCP、CD46、CFI 基因異常導致，且超過易感染病毒年紀(5歲以上)，或者在延長給藥時間或減少劑量下仍然無復發且 CH50<10%，可考慮停藥。","level":1},{"text":"3. 另於114/2/1前已使用 eculizumab 之病人，符合續用申請條件者，得轉換至ravulizumab或 crovalimab，惟使用 ravulizumab 或 crovalimab 無效後，不得再申請eculizumab。(114/2/1、114/10/1)","level":0},{"text":"4. 新病人限ravulizumab 或 crovalimab 擇一使用。(114/10/1)","level":0},{"text":"5. Ravulizumab或 crovalimab 惟在有耐受不良時方可轉換使用，且限轉換一次。","level":0}],"limited":false,"revisions":["101/4/1","102/10/1","108/6/1","108/9/1","114/2/1","114/10/1","115/3/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-11","section":"8.2.11","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Plerixafor（如 Mozobil）","drugs":[{"generic":"Plerixafor","zh":"","brands":["Mozobil"]}],"funding":"nhi","summary":"限用於須施行自體移植之非何杰金氏淋巴瘤或多發性骨髓瘤的病患，但驅動不佳者。為至少使用一療程之 G-CSF 合併化學治療的幹細胞驅動治療，收集數量每公斤體重CD34+細胞少於2百萬個才可申請使用。","provisions":[{"text":"1.限用於須施行自體移植之非何杰金氏淋巴瘤或多發性骨髓瘤的病患，但驅動不佳者。為至少使用一療程之 G-CSF 合併化學治療的幹細胞驅動治療，收集數量每公斤體重CD34+細胞少於2百萬個才可申請使用。","level":0},{"text":"2.原則上使用不超過2天(106/10/1)。","level":0},{"text":"3.使用第2天應確實計算療程中已收集之 CD34+細胞總數，若仍未達每公斤體重2百萬個CD34+細胞，方得再使用1天。","level":0}],"limited":false,"revisions":["102/12/1","106/10/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-12","section":"8.2.12","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Canakinumab（如 Ilaris）","drugs":[{"generic":"Canakinumab","zh":"","brands":["Ilaris"]}],"funding":"nhi","summary":"限具有風濕或免疫專長之醫師處方。","provisions":[{"text":"1.限具有風濕或免疫專長之醫師處方。","level":0},{"text":"2.臨床診斷為Cryopyrin 相關週期性症候群(CAPS)，包括：嚴重型的家族性冷因性自體發炎症候群(FCAS)/家族性寒冷蕁麻疹(FCU)、Muckle-Wells 症候群(MWS)、新生兒多重系統發炎疾病(NOMID)/慢性嬰兒神經學、皮膚、關節症候群(CINCA)，並符合下列所有條件：","level":0},{"text":"(1)具有 NLRP3基因突變。","level":1},{"text":"(2)有下列兩個以上之併發症：","level":1},{"text":"Ⅰ.中樞神經系統併發症。","level":3},{"text":"Ⅱ.葡萄膜炎。","level":3},{"text":"Ⅲ.感覺神經性聽損。","level":3},{"text":"Ⅳ.腎臟類澱粉沉積症。","level":3},{"text":"(3)hsCRP（high sensitivity CRP）＞ 1mg/dL 及 ESR＞ 25mm/h。","level":1},{"text":"(4)經一般藥物及類固醇治療3個月以上無效。","level":1},{"text":"3.需經事前審查核准後使用：","level":0},{"text":"(1)初次申請需於給藥兩週後進行療效評估，達療效者方可繼續使用，自初次起計使用期間為1年，療效之定義為符合下列條件之一：","level":1},{"text":"Ⅰ.治療後 hsCRP≦ 1mg/dL 及 ESR≦ 25mm/h。","level":3},{"text":"Ⅱ.治療後 hsCRP 及 ESR 改善程度≧50%。","level":3},{"text":"(2)使用1年期間後須暫緩續用，倘 hsCRP 及 ESR 較暫緩續用前上升程度≧50%，則可申請續用，續用期間為1年。hsCRP 檢驗結果上升應排除其他非 CAPS 之情況所引起。","level":1}],"limited":false,"revisions":["104/8/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-13","section":"8.2.13","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Belimumab（如 Benlysta）","drugs":[{"generic":"Belimumab","zh":"","brands":["Benlysta"]}],"funding":"nhi","summary":"用於接受標準治療至少6個月但仍然無法有效控制疾病的第Ⅲ、IV 或 V 型狼瘡腎炎成人病人。","provisions":[{"text":"1.用於接受標準治療至少6個月但仍然無法有效控制疾病的第Ⅲ、IV 或 V 型狼瘡腎炎成人病人。","level":0},{"text":"(1)需經事前審查核准後使用。","level":1},{"text":"(2)標準治療係指同時使用以下藥物","level":1},{"text":"Ⅰ.類固醇治療6個月，其中至少有2個月之月平均達標準目標劑量(如口服Prednisolone ≥ 每日劑量每公斤0.5mg 或等劑量之類固醇藥物)。(114/2/1)","level":3},{"text":"Ⅱ.使用足量前導治療(induction phase)免疫抑制劑，含6個月的 mycophenolatemofetil(每日劑量2gm)或 mycophenolic acid(每日劑量1,440mg)、或注射型的 cyclophosphamide(注射量12週內總劑量需達3gm)接續3個月的mycophenolate mofetil(每日劑量2gm)或 mycophenolic acid(每日劑量1,440mg)或 azathioprine (每日劑量每公斤2mg)。","level":3},{"text":"Ⅲ.若因藥物毒性無法忍受，以致於無法達到前述要求時，劑量可以酌情降低，但需說明藥物之何種毒性或副作用。(114/2/1)","level":3},{"text":"(3)無法有效控制疾病的定義為經標準治療至少6個月後仍有以下情形:","level":1},{"text":"Ⅰ.蛋白尿相較基期下降比例<50%，且 uPCR 或24小時蛋白尿 ≥ 1.0。","level":3},{"text":"Ⅱ.腎絲球過濾率(glomerular filtration rate, GFR)下降超過20%以上且伴隨uPCR 或24小時蛋白尿≥ 1.0或是出現尿沉渣。","level":3},{"text":"(4)療效評估與繼續使用:每治療12個月需評估病人在使用期間內是否達充分改善腎臟指標，必須達到以下標準才可以繼續使用:","level":1},{"text":"Ⅰ. uPCR 或24小時蛋白尿≤ 0.7gm/天或相較於基期下降一半以上。(111/10/1、","level":3},{"text":"Ⅱ.腎絲球過濾率 (glomerular filtration rate, GFR)沒有下降超過 20%以上。","level":3},{"text":"Ⅲ.沒有末期腎臟病。","level":3},{"text":"Ⅳ.相較基期，血清肌酸酐沒有增加超過1倍。","level":3},{"text":"Ⅴ.治療2年後，若腎炎已達完全緩解者(complete renal response, CRR)，應停止使用 belimumab。CRR 指病人 uPCR<0.5且 eGFR 下降與基期相比<10%或持續≥90 ml/min/1.73m。◎附表三十六：全民健康保險狼瘡腎炎使用 belimumab 申請表","level":3},{"text":"2.限使用於18歲以上具有活動性之全身性紅斑性狼瘡治療病人。(114/2/1)","level":0},{"text":"(1)限內科專科醫師且具有風濕或免疫專科醫師證書者處方。","level":1},{"text":"(2)需經事前審查核准後使用。","level":1},{"text":"(3)申報時須檢附使用標準治療藥物滿5個月及6個月後之2次 SLEDAI-2K 積分，各種藥物之種類、劑量、治療時間、副作用與所計分病徵之相關佐證等資料(包含 ESR 與CRP)。","level":1},{"text":"(4)病人須同時符合下述所有條件，方可使用。I.有高疾病活性，需同時符合i.anti-dsDNA 陽性ii.低補體(C3或 C4)下降II.用於接受標準治療後，仍無法有效控制病情之全身性紅斑性狼瘡，其療效不彰之定義為：i.標準治療藥物滿5個月及6個月後，2次評估 SLEDAI-2K 分數均≥8。ii.以下分數不可計入 SLEDAI-2K 計分: 癲癇、精神疾病、器質性腦部症候群、腦神經、狼瘡性頭痛、掉髮、口腔潰瘍、狼瘡腎臟分數(尿圓柱體、血尿、蛋白尿、膿尿)。iii.血管炎計分需臨床有潰瘍、壞疽、栓塞等病變，需檢附照片或組織病理或影像學檢查，且需 ESR≧28mm/hour 或 CRP≧1mg/dL。iv.關節炎計分需有4個或是以上的疼痛關節及4個或是以上的腫脹關節(需附關節腫脹相關 X-光片或照片輔證)，且需 ESR≧28mm/hour 或 CRP≧1mg/dL。v.肌炎計分需有血清中肌肉酵素如 CPK、LDH、GOT 上升大於正常值2倍以上且肌電圖異常、或肌肉切片有發炎性疾病、或放射線影像檢查，3項中至少有1項檢查結果確認。vi.皮疹計分需排除掉髮與口腔潰瘍後，皮膚紅斑性狼瘡面積和嚴重程度指數(Cutaneous Lupus Erythematosus Disease Area and SeverityIndex,CLASI)達8分以上，且體表面積受影響達9%以上(附皮膚照片佐證)。vii.肋膜炎或心包膜炎計分，除理學檢查外需附影像學或心電圖等證明，且需ESR≧28mm/hour 或 CRP≧1mg/dL。","level":1},{"text":"Ⅲ.標準治療療法為病患曾經接受下列3種標準治療藥物合併治療：i.類固醇：治療至少6個月，其中至少有2個月之月平均達標準目標劑量(如口服Prednisolone≧每日劑量每公斤0.5mg 或相等強度劑量之類固醇類藥物)或過去3個月內曾使用 Pulse IV methylprednisolone (連續3天每公斤10mg 以上)。ii.奎寧類藥物：連續使用至少6個月標準劑量的 hydroxychloroquine (每天200mg 或以上)iii.使用足量免疫抑制劑至少擇一連續使用至少6個月：azathioprine (每天每公斤2mg)或 methotrexate (每週15mg)或 cyclosporin (每天每公斤3mg)或mycophenolate mofetil (每天2gm)或 mycophenolic acid (每天1,440mg)iv.如藥物劑量無法耐受，可視臨床情況調整類固醇、奎寧及免疫抑制劑之劑量。IV.續用處方條件：首次申請治療6個月後評估 SLEDAI-2K 疾病活動指標，符合下列所有條件，可以持續使用，之後每3個月再次申請續用：i.口服類固醇每日劑量下降至每天7.5mg 以下或接受 Benlysta 治療前相較每日劑量下降50%以上。ii.疾病活動度改善，以下列指標評估：SLEDAI-2K 下降至4分以下或與接受Benlysta 治療前 SLEDAI-2K 改善3分以上。iii.不得有新增器官侵犯或原有病徵惡化，原有計分之項目，續用申請時需附相關佐證資料(包含 ESR 與 CRP)(i)血管炎計分者，續用申請時需檢附原病灶位置之照片。(ii)關節炎計分者，續用申請時需檢附腫脹關節數目及照片。(iii)肌炎計分者，續用申請時需檢附 CPK、LDH、GOT 數值。(iv)皮疹計分者，續用申請時需檢附 CLASI 評分及皮膚照片。V.減量或停用條件：若使用滿2年，達緩解或低疾病活動度 SLEDAI-2K≦4滿一年以上，可以減量。減量後，若持續維持緩解或低疾病活動度 SLEDAI-2K≦4滿一年以上停用，若減量或停用後病情復發，可以申請恢復治療，後續依續用條件申請。","level":3},{"text":"Ⅵ.不給付於神經精神性狼瘡病人。","level":3},{"text":"Ⅶ.Belimumab 不應與其他生物製劑同時給付。","level":3},{"text":"3.限用於Anti-ds DNA 抗體陽性之報告及低補體，且正在接受標準治療至少3個月但仍無法達到有效控制疾病的全身性紅斑性狼瘡5-17歲病人。(114/2/1)","level":0},{"text":"(1)需經事前審查核准後使用。","level":1},{"text":"(2)申請前3個月內同時接受下列三項標準治療之至少兩項，且達到以下建議劑量：I.類固醇平均劑量(如口服 prednisolone ≥每日劑量每公斤0.25mg 或等劑量之類固醇藥物） 。","level":1},{"text":"Ⅱ.Hydroxychloroquine（每日劑量每公斤3-5mg，最大劑量400 mg）。","level":3},{"text":"Ⅲ.至少一種（含）免疫抑制劑，如 azathioprine（每日劑量每公斤1mg） 、注射型 cyclophosphamide（500mg/m/month）、cyclosporin（每日劑量每公斤","level":3},{"text":"2.5mg）、mycophenolic acid（720mg/m/day）、mycophenolate mofetil（1gm/m/day）或 methotrexate（10mg/m/week）等（但無法接受副作用除外） 。","level":0},{"text":"(3)無法達到有效控制的定義為經標準治療至少3個月後仍有疾病活動性 SELENASLEDAI≥8（神經精神分數不可計入計分: 癲癇發作、精神疾病、器質性腦部症候群、腦神經疾患、狼瘡性頭痛、腦血管事件。腎臟分數計分最多只能佔4分:尿圓柱體、血尿、蛋白尿、膿尿。皮膚、黏膜與關節相關分數需附照片證明，相關檢驗與檢查須附報告） 。","level":1},{"text":"(4)療效評估與繼續使用：每治療12 個月後評估 SELENA SLEDAI ≥8積分：與初次申請之積分比較，減少≥4 分方得繼續使用。若需繼續使用，需重新提出申請。◎附表三十六之一：全民健康保險全身性紅斑性狼瘡5-17 歲病人使用 belimumab 生物製劑申請表◎附表三十六之二：SELENA SLEDAI積分表","level":1}],"limited":false,"revisions":["111/10/1","114/2/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-14","section":"8.2.14","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Satralizumab（如 Enspryng）、inebilizumab（如 Uplizna）","drugs":[{"generic":"Satralizumab","zh":"","brands":["Enspryng"]},{"generic":"inebilizumab","zh":"","brands":["Uplizna"]}],"funding":"nhi","summary":"Satralizumab限用於治療泛視神經脊髓炎(neuromyelitis optica spectrum disor-der,NMOSD)之 12 歲以上患者，另 inebilizumab 限用於成人，且需同時符合下列條件：","provisions":[{"text":"1. Satralizumab限用於治療泛視神經脊髓炎(neuromyelitis optica spectrum disor-der,NMOSD)之 12 歲以上患者，另 inebilizumab 限用於成人，且需同時符合下列條件：","level":0},{"text":"(1) 經檢測為水通道蛋白 4 自體抗體陽性(anti-aquaporin-4[AQP4] antibody pos-itive)。","level":1},{"text":"(2) 使用至少 3 個月免疫抑制療法後，如口服皮質類固醇、 azathioprine 或mycophenolate mofetil，仍有疾病復發。","level":1},{"text":"(3) 二年內曾發生二次以上需要救援治療的復發患者，且須符合以下條件 (Ⅰ+Ⅱ+Ⅲ或Ⅰ+Ⅱ+Ⅳ)(112/10/1、115/1/1、115/2/1)I.有神經影像學(磁振造影)報告佐證其發作II.發作時住院接受急性期治療III.發作時 EDSS(Expanded Disability Status Scale)分數增加，其定義為原先EDSS 為0者須增加2分以上，原先 EDSS 大於0者須增加1分以上。【EDSS：Expanded Disability Status Scale 。擴展失能狀態量表，針對神經功能的表現評估。分數介於0至10分，0分代表健康無失能狀態，10分代表死亡。】IV.發作時最佳矯正視力、辨色力與視野檢查呈現與視神經炎相關視覺損害加上視網膜斷層掃描儀(Optical Coherence Tomography)結構損傷之證據。","level":1},{"text":"(4) 治療前之疾病嚴重度(EDSS)須小於等於 6.5 分。","level":1},{"text":"2. 須經事前審查核准後使用：","level":0},{"text":"(1) 限由神經科、小兒神經科及眼科醫師開立處方。(112/10/1、115/1/1)","level":1},{"text":"(2) 應併檢附病人完整視力、視野、MRI、整個用藥期間復發情形之相關完整病歷等資料。","level":1},{"text":"(3) 初始給付期間以 12 個月為限。","level":1},{"text":"3. 續用標準：初始給付12個月後，應每6個月測量病人之EDSS分數，且EDSS值≦6.5分，始得續用，每次續用限 6 個月。","level":0},{"text":"4. 停用標準：使用satralizumab或inebilizumab後，病人疾病惡化，且EDSS≧8分，或疾病年度發作頻率增加者，應停止使用。","level":0},{"text":"5. Satralizumab或 inebilizumab 僅得擇一使用，惟在有耐受不良時方可轉換使用。","level":0}],"limited":false,"revisions":["112/10/1","115/1/1","115/2/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-15","section":"8.2.15","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Siltuximab（如 Sylvant）","drugs":[{"generic":"Siltuximab","zh":"","brands":["Sylvant"]}],"funding":"nhi","summary":"限免疫過敏或血液腫瘤專科醫師處方。","provisions":[{"text":"1.限免疫過敏或血液腫瘤專科醫師處方。","level":0},{"text":"2.限用於治療人類免疫不全病毒(HIV)陰性及人類皰疹病毒-8 (HHV-8)陰性的多發性Castleman 氏病(Multicentric Castleman's Disease(MCD))患者，ECOG≦2。","level":0},{"text":"3.需經事前審查核准後使用。初次申請時，以6個月為限，之後每3個月再次申請，再次申請時應檢附前次治療結果評估資料，如血液學或影像學檢查報告。","level":0},{"text":"4.病人需符合與 iMCD 譜系(iMCD spectrum)一致的組織病理學淋巴結特徵。","level":0},{"text":"5.病人需至少在2個淋巴結分區(lymph node stations)有淋巴結腫大(短軸直徑至少1cm)。","level":0},{"text":"6.申請時須註明，病人至少符合2項以上 iMCD 診斷標準(iMCD 實驗室診斷標準(laboratory iMCD diagnostic criteria)或 iMCD 臨床診斷標準(clinical iMCDdiagnostic criteria))，且至少1項須為實驗室診斷標準。","level":0},{"text":"7.排除其他疾病因素：","level":0},{"text":"(1) 人類皰疹病毒-8感染。","level":1},{"text":"(2) Epstein-Barr 病毒淋巴增生性疾病。","level":1},{"text":"(3) 急性/不受控制的感染(如巨細胞病毒、弓形蟲病、人類免疫缺陷病毒、肺結核)所導致的炎症並伴有淋巴結腫大。","level":1},{"text":"(4) 自身免疫/自體發炎性疾病。","level":1},{"text":"(5) 惡性/淋巴增生性疾病。","level":1},{"text":"8.停用時機：","level":0},{"text":"(1) 初次治療前6個月未符合治療改善之定義，停止使用。","level":1},{"text":"(2) 維持治療：每3個月評估直到疾病進展(Progression Disease)則停止治療。","level":1},{"text":"(3) 若疾病進展或無法耐受藥物副作用，則必須停止使用。","level":1},{"text":"9.最長使用2年，復發時依初次使用標準審查。備註：","level":0},{"text":"1.iMCD 實驗室診斷標準(laboratory iMCD diagnostic criteria)：","level":0},{"text":"(1)CRP升高(＞10mg/L)或紅血球沉降速率(erythrocyte sedimentation rate,ESR)升高（＞15mm/h）。","level":1},{"text":"(2)貧血（男性血紅蛋白＜12.5g/dL；女性血紅蛋白＜11.5g/dL）。","level":1},{"text":"(3)血小板減少症(血小板數＜150k/mL)或血小板增多症(血小板數＞400k/mL)。","level":1},{"text":"(4)低白蛋白血症(白蛋白＜3.5g/dL)。","level":1},{"text":"(5)腎功能異常（eGFR＜60mL/min/1.73m2）或蛋白尿（總蛋白質150mg/24h 或10mg/100mL）。","level":1},{"text":"(6)多株高丙型球蛋白血症（polyclonal hypergammaglobulinemia） （總g 球蛋白或免疫球蛋白 G＞1700mg/dL）。","level":1},{"text":"2.iMCD 臨床診斷標準(clinical iMCD diagnostic criteria)：","level":0},{"text":"(1)全身症狀：盜汗、發燒(＞38C)、體重減輕或疲勞（使用不良事件通用術語標準，該症狀至少2分（CTCAE gradeⅡ以上） ） 。","level":1},{"text":"(2)肝和/或脾臟增大。","level":1},{"text":"(3)積水：水腫、全身水腫、腹水或胸腔積水。","level":1},{"text":"(4)爆發性櫻桃狀血管瘤或紫羅蘭色丘疹。","level":1},{"text":"(5)淋巴細胞間質性肺炎。","level":1},{"text":"3.治療改善狀況根據（CDCN response criteria） ；需同時滿足下列（1）～（2）條件；每3個月評估：","level":0},{"text":"(1)至少與基礎比較改善，發炎反應的客觀指標，以下4個數值有2個符合：","level":1},{"text":"Ⅰ.C-反應蛋白(CRP)下降50%。","level":3},{"text":"Ⅱ.血紅蛋白(Hemoglobin)上升2g/dL 或≧10g/dL。","level":3},{"text":"Ⅲ.白蛋白(Albumin)≧3.5/dL。","level":3},{"text":"Ⅳ.腎絲球過濾率 GFR 上升20%或 GFR≧60mL/min/1.73m。","level":3},{"text":"(2)淋巴結較基礎值可測量縮小50%或無新發生淋巴結節腫大(每半年執行檢測一次)。","level":1}],"limited":false,"revisions":["113/2/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-16","section":"8.2.16","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Apremilast（如 Otezla）、deucravacitinib（如 Sotyktu）","drugs":[{"generic":"Apremilast","zh":"","brands":["Otezla"]},{"generic":"deucravacitinib","zh":"","brands":["Sotyktu"]}],"funding":"nhi","summary":"限用於對傳統全身性治療療效反應不佳、無法耐受或具有禁忌症的中度至重度斑塊乾癬之成年病人。","provisions":[{"text":"1.限用於對傳統全身性治療療效反應不佳、無法耐受或具有禁忌症的中度至重度斑塊乾癬之成年病人。","level":0},{"text":"(1)傳統全身性治療必須包括足量之照光治療及methotrexate或cyclosporine至少一種治療藥物。","level":1},{"text":"(2)Methotrexate 合理劑量需達每週15mg，cyclosporine 為2.5-5mg/kg/day。但若因為藥物毒性無法耐受，使用劑量可酌情降低。","level":1},{"text":"(3)照光治療應依學理，如光化療法(PUVA)及窄頻 UVB(nb-UVB)必須每週至少2次，寬頻UVB 併用焦油每週至少3次，並依學理逐漸增加至有效可忍受劑量。申請時必須附病歷影印及詳細照光劑量紀錄。","level":1},{"text":"(4)所稱禁忌症或不適用情況指有下列任一情形：ⅰ.因肝功能異常或切片第三期a異常，經6個月後切片仍無改善，或第三期b以上之肝切片異常，病毒性肝炎帶原或腎功能異常或癌症所引起嚴重或重複感染而無法使用 methotrexate 治療者。ⅱ.腎功能異常或癌症無法使用 cylcosporine 者。ⅲ.具有光敏感性疾病，不適合照光。ⅳ.多發性非原位皮膚上皮癌，不適合照光。ⅴ.頭皮侵犯(>50%，應檢附照片備查)照光無效或無法耐受。","level":1},{"text":"2.需經事前審查核准後使用(肝腎功能不佳者除外，惟需經照光、methotrexate 治療無效者使用)且每24週需提出續用申請，每次均應檢附資料如申請表。 (113/3/1、","level":0},{"text":"3.需排除使用及停止治療的情形應參照藥物仿單。","level":0},{"text":"4.不得合併申請生物製劑、tofacitinib 及 cyclosporine 使用。備註:","level":0},{"text":"1.肝功能不佳之定義為: (113/10/1)","level":0},{"text":"(1) 肝硬化等級Child-Pugh score A級且經6個月追蹤治療仍無改善或是Child-PughB 級以上。","level":1},{"text":"(2) 因肝功能異常具肝臟切片結果：第三期以上異常。","level":1},{"text":"(3) C 肝病毒陽性。","level":1},{"text":"(4) HBsAg 陽性。","level":1},{"text":"(5) AST/ALT ≧2.5UNL(100)。","level":1},{"text":"2.腎功能不佳之定義為：(113/10/1)","level":0},{"text":"(1) CCr<50mL/min 或 eGFR<60mL/min/1.73m2或洗腎。","level":1},{"text":"(2)Creatinine 增加超過使用前30%。◎附表二十四之七：全民健康保險乾癬使用 apremilast、deucravacitinib 申請表（113/3/1、114/6/1）","level":1}],"limited":false,"revisions":["113/3/1","113/10/1","114/6/1","115/8/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-17","section":"8.2.17","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Mepolizumab（如 Nucala）、Benralizumab（如 Fasenra）","drugs":[{"generic":"Mepolizumab","zh":"","brands":["Nucala"]},{"generic":"Benralizumab","zh":"","brands":["Fasenra"]}],"funding":"nhi","summary":"用於經診斷為嗜伊紅性肉芽腫併多發性血管炎 (eosinophilic granulomatosiswith polyangiitis, EGPA)之18歲以上成人病人，且需符合下列條件之一：","provisions":[{"text":"1.用於經診斷為嗜伊紅性肉芽腫併多發性血管炎 (eosinophilic granulomatosiswith polyangiitis, EGPA)之18歲以上成人病人，且需符合下列條件之一：","level":0},{"text":"(1)復發型嗜伊紅性肉芽腫併多發性血管炎：過去 2年內，曾經於使用口服類固醇prednisolone至少每天7.5mg或等價當量（equivalent）之情況下復發（如：增加口服類固醇劑量、或開始/增加免疫抑制劑治療、或住院等）。","level":1},{"text":"(2)難治型嗜伊紅性肉芽腫併多發血管炎：過去 6個月經傳統誘導治療（如：cyclo-phosphamide、或 azathioprine、或 methotrexate、或 mycophenolate mofetil、或口服類固醇 prednisolone 每天15mg 以上等）至少3個月，仍未達疾病緩解（未達緩解定義：口服類固醇 prednisolone 無法降至每天7.5mg 以下或等價當量）。","level":1},{"text":"2.需經事前審查核准後使用，使用52週後評估符合下列任一條件可續用：(113/4/1、","level":0},{"text":"(1)以mepolizumab或benralizumab治療52週期間，曾經達成疾病緩解（緩解定義：無 EGPA 病徵，且口服類固醇 prednisolone 可降至每天5mg 以下），或","level":1},{"text":"(2)於52週評估時，口服類固醇劑量相較於 mepolizumab 或 benralizumab 治療前劑量降低50%以上，或","level":1},{"text":"(3)以 mepolizumab 或 benralizumab 治療52週期間，EGPA 未復發（如：增加口服類固醇劑量、或開始/增加免疫抑制劑治療、或住院等）。","level":1},{"text":"3. Mepolizumab 或 benralizumab 僅得擇一使用，惟在有耐受不良時方可轉換使用。備註：診斷為嗜伊紅性肉芽腫併多發血管炎之定義：曾經發生氣喘伴隨嗜伊紅性白血球增多，且診斷報告須附上組織切片檢查報告，確認出現 EGPA 病徵。","level":0}],"limited":false,"revisions":["113/4/1","115/4/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-18","section":"8.2.18","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Anifrolumab（如 Saphnelo）：","drugs":[{"generic":"Anifrolumab","zh":"","brands":["Saphnelo"]}],"funding":"nhi","summary":"限使用於18歲以上具有活動性之全身性紅斑性狼瘡病人。","provisions":[{"text":"1.限使用於18歲以上具有活動性之全身性紅斑性狼瘡病人。","level":0},{"text":"2.限內科專科醫師且具有風濕或免疫專科醫師證書之處方。","level":0},{"text":"3.需經事前審查核准後使用。","level":0},{"text":"4.申報時須檢附使用標準治療藥物滿5個月及6個月後之2次 SLEDAI-2K 積分，各種藥物之種類、劑量、治療時間、副作用與所計分病徵之相關佐證等資料(包含 ESR 與CRP)。","level":0},{"text":"5.病人須同時符合下述所有條件，方可使用。","level":0},{"text":"(1)自體免疫抗體陽性。","level":1},{"text":"(2)接受標準治療後，仍無法有效控制病情之全身性紅斑性狼瘡，其療效不彰之定義為：標準治療藥物滿5個月及6個月後，2次評估 SLEDAI-2K 分數均≥6。","level":1},{"text":"Ⅰ.以下分數不可計入 SLEDAI-2K 計分: 癲癇、精神疾病、器質性腦部症候群、腦神經疾病、狼瘡性頭痛、腦血管意外、狼瘡性腎炎、發燒、掉髮、口腔潰瘍。","level":3},{"text":"Ⅱ.血管炎計分需臨床有潰瘍、壞疽、栓塞等病變，需檢附照片或組織病理或影像學檢查，且需 ESR≧28mm/hour 或 CRP≧1mg/dL。","level":3},{"text":"Ⅲ.關節炎計分需有4個或是以上的疼痛關節及 4個或是以上的腫脹關節 (需附關節腫脹相關 X-光片或照片輔證)，且需 ESR≧28mm/hour 或 CRP≧1mg/dL。","level":3},{"text":"Ⅳ.肌炎計分需有血清中肌肉酵素如CPK、LDH、GOT上升大於正常值2倍以上且肌電圖異常、或肌肉切片有發炎性疾病、或放射線影像檢查， 3項中至少有1項檢查結果確認。","level":3},{"text":"Ⅴ.皮疹計分需排除掉髮與口腔潰瘍後，皮膚紅斑性狼瘡面積和嚴重程度指數(Cutaneous Lupus Erythematosus Disease Area and Severity Index,CLASI)達8分以上，且體表面積受影響達9%以上(附皮膚照片佐證)。","level":3},{"text":"Ⅵ.肋膜炎或心包膜炎計分，除理學檢查外需附影像學或心電圖等證明，且需ESR≧28mm/hour 或 CRP≧1mg/dL。","level":3},{"text":"(3)標準治療療法為病人曾經接受下列3種標準治療藥物合併治療：I.類固醇：治療至少 6個月，其中至少有 2個月平均劑量達標準目標劑量(prednisolone≧0.5mg/kg/day 或相等強度劑量之類固醇類藥物 )或過去3個月內曾使用 Pulse IV methylprednisolone (連續3天每公斤10mg 以上)。","level":1},{"text":"Ⅱ.奎寧類藥物：連續使用至少6個月標準劑量的hydroxychloroquine (每天200mg或以上)。","level":3},{"text":"Ⅲ.使用足量免疫抑制劑至少擇一連續使用至少6個月：azathioprine (每天每公斤2mg)或 methotrexate ( 每週 15mg)或 cyclosporin ( 每天每公斤 3mg)或mycophenolate mofetil (每天2g)或 mycophenolic acid(每天1,440mg)。","level":3},{"text":"Ⅳ.如藥物劑量無法耐受，可視臨床情況調整類固醇、奎寧及免疫抑制劑之劑量。","level":3},{"text":"6.續用處方條件：首次申請治療6個月後評估 SLEDAI-2K 疾病活動指標，符合下列所有條件，可以持續使用，之後每3個月再次申請續用：","level":0},{"text":"(1)口服類固醇每日劑量下降至每天7.5mg以下或接受Saphnelo治療前相較每日劑量下降50%以上。","level":1},{"text":"(2)疾病活動度改善，以下列指標評估： SLEDAI-2K 下降至 4分以下或與接受Saphnelo 治療前 SLEDAI-2K改善3分以上。","level":1},{"text":"(3)不得有新增器官侵犯或原有病徵惡化，原有計分之項目，續用申請時需附相關佐證資料(包含 ESR 與 CRP)。","level":1},{"text":"Ⅰ.血管炎計分者，續用申請時需檢附原病灶位置之照片。","level":3},{"text":"Ⅱ.關節炎計分者，續用申請時需檢附腫脹關節數目及照片。","level":3},{"text":"Ⅲ.肌炎計分者，續用申請時需檢附 CPK、LDH、GOT 數值。","level":3},{"text":"Ⅳ.皮疹計分者，續用申請時需檢附 CLASI 評分及皮膚照片。","level":3},{"text":"7.減量或停用條件：若使用滿2年，達緩解或低疾病活動度 SLEDAI-2K≦4滿一年以上，可以減量。減量後，若持續維持緩解或低疾病活動度 SLEDAI-2K≦4滿一年以上停用，若減量或停用後病情復發，得申請恢復治療，後續依續用條件申請。","level":0},{"text":"8.不給付於神經精神性狼瘡，或是狼瘡腎炎病人。","level":0},{"text":"9. Anifrolumab 不得與其他生物製劑併用為原則。","level":0}],"limited":false,"revisions":["113/10/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-19","section":"8.2.19","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Danicopan（如 Voydeya）、iptacopan（如 Fabhalta）","drugs":[{"generic":"Danicopan","zh":"","brands":["Voydeya"]},{"generic":"iptacopan","zh":"","brands":["Fabhalta"]}],"funding":"nhi","summary":"限用於經衛生福利部國民健康署認定之陣發性夜間血紅素尿症病人，並經特殊專案審查核准後使用，且符合下列條件：(115/3/1、115/9/1)","provisions":[{"text":"1.限用於經衛生福利部國民健康署認定之陣發性夜間血紅素尿症病人，並經特殊專案審查核准後使用，且符合下列條件：(115/3/1、115/9/1)","level":0},{"text":"(1)Danicopan 限與 eculizumab 或 ravulizumab 併用；iptacopan 限單用。(115/3/1、","level":1},{"text":"(2)年齡18歲以上。","level":1},{"text":"(3)經 C5補體抑制劑(如 eculizumab 或 ravulizumab)治療後，仍出現血管外溶血(clinically significant extravascular hemolysis)。","level":1},{"text":"(4)使用C5抑制劑下血紅素仍小於或等於9.5g/dL。","level":1},{"text":"(5)絕對網狀紅血球計數大於或等於120×10/L，或網狀紅血球比例大於或等於3%。","level":1},{"text":"2.排除有高危險之骨髓化生不良症候群（RAEB-1或 RAEB-2）。","level":0},{"text":"3.每6個月須經特殊專案審查重新評估治療結果。若符合下列條件之一，則不予同意使用。","level":0},{"text":"(1)接受治療的患者用藥後病情沒有改善者（LDH 超過正常值上限的1.5倍或最近3個月內輸血多於2個單位）。","level":1},{"text":"(2)PNH granulocyte clone size ≦50%。","level":1},{"text":"(3)發生嚴重再生不良性貧血者，其檢查結果符合下列兩項或兩項以上者：i.中性白血球數目(neutrophil count) <0.5x109/L。ii.血小板數目( platelet count) <20x109/L。iii.網狀細胞(reticulocytes) <25x109/L。iv.骨髓內造血細胞密度<30%。","level":1},{"text":"4.Danicopan、iptacopan兩者僅得擇一使用，惟病人出現耐受不良反應時方可轉換使用，且限轉換一次。(115/9/1)◎附表三十之三：全民健康保險使用陣發性夜間血紅素尿症第二線治療藥品danicopan+eculizumab /ravulizumab、iptacopan特殊專案審查申請表(115/3/1、◎附表三十之四：陣發性夜間血紅素尿症患者第二線治療藥品特殊專案審查申請Voydeya(danicopan)+Soliris(eculizumab)/Ultomiris(ravulizumab)或 Fabhalta(iptacopan)用藥檢附資料查檢表(115/3/1、115/9/1)","level":0}],"limited":false,"revisions":["115/3/1","115/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false}]},"general-rules":{"meta":{"topicId":"general-rules","sectionName":"藥品給付規定通則","status":"imported","statusLabel":"已由健保署官方檔案匯入","version":"113.05.20","generatedAt":"2026-09-09","effectiveDate":"113-05-20","source":{"name":"衛生福利部中央健康保險署／藥品給付規定通則","url":"https://www.nhi.gov.tw/ch/cp-7593-ad2a9-3397-1.html"},"notice":"本頁條文由健保署官方檔案匯入。各節條文常引用本通則（例如「不受通則八之限制」），實際規定以健保署最新公告為準。"},"categories":[{"id":"general","label":"通則"}],"fundingTypes":[{"id":"nhi","label":"健保給付"}],"items":[{"id":"tz-01","section":"通則一","order":1,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"本保險醫事服務機構申報之藥品，以收載於本標準者為限","drugs":[],"funding":"nhi","summary":"本保險醫事服務機構申報之藥品，以收載於本標準者為限。","provisions":[{"text":"本保險醫事服務機構申報之藥品，以收載於本標準者為限。","level":0}],"limited":false,"revisions":[],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-02","section":"通則二","order":2,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"本保險醫療用藥，由保險人就各醫事服務機構已申報之藥品品項及其藥價審查之","drugs":[],"funding":"nhi","summary":"本保險醫療用藥，由保險人就各醫事服務機構已申報之藥品品項及其藥價審查之。但因急救使用未經報備之藥品，可事後再報保險人備查。","provisions":[{"text":"本保險醫療用藥，由保險人就各醫事服務機構已申報之藥品品項及其藥價審查之。但因急救使用未經報備之藥品，可事後再報保險人備查。","level":0}],"limited":false,"revisions":[],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-03","section":"通則三","order":3,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"本保險處方用藥，醫師得按保險對象病情需要，每次開給七日以內之藥量","drugs":[],"funding":"nhi","summary":"本保險處方用藥，醫師得按保險對象病情需要，每次開給七日以內之藥量。保險人指定之慢性疾病得一次給予三十日以內之用藥量。住院治療之保險對象於出院必須攜回藥品時，其給藥量規定同上。","provisions":[{"text":"本保險處方用藥，醫師得按保險對象病情需要，每次開給七日以內之藥量。保險人指定之慢性疾病得一次給予三十日以內之用藥量。住院治療之保險對象於出院必須攜回藥品時，其給藥量規定同上。","level":0}],"limited":false,"revisions":[],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":true},"tags":[],"sourceConfirmed":true},{"id":"tz-04","section":"通則四","order":4,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"注射藥品之使用原則","drugs":[],"funding":"nhi","summary":"注射藥品之使用原則：","provisions":[{"text":"注射藥品之使用原則：","level":0},{"text":"（一）注射藥品使用時機，應以經醫師診斷後，判斷病情需要且病人不能口服，或口服仍不能期待其有治療效果，記明於病歷表者，方得為之。(86/1/1)","level":0},{"text":"（二）因病情需要，經醫師指導使用方法由病人持回注射之藥品包括：","level":0},{"text":"1.治療糖尿病之 insulin 及 GLP-1 受體促效劑。(109/12/1)","level":1},{"text":"2.CAPD 使用之透析液。","level":1},{"text":"3.CAPD 使用之抗生素及抗凝血劑（至多攜回二週） 。","level":1},{"text":"4.Desferrioxamine（如 Desferal）。","level":1},{"text":"5.慢性腎臟功能衰竭，使用紅血球生成素（至多攜回二週，如因特殊病情需要，需敘明理由，得以臨床實際需要方式給藥，惟一個月不超過 20,000U（如Eprex、Recormon）或 100mcg（如 Aranesp、Mircera）為原則） 。(98/9/1)","level":1},{"text":"6.治療白血病使用之α-interferon（至多攜回二週） 。","level":1},{"text":"7.G-CSF (如 filgrastim；lenograstim）(至多攜回六天） 。(98/11/1)","level":1},{"text":"8.生長激素 (human growth hormone)（至多攜回一個月） 。","level":1},{"text":"9.門診之血友病人得攜回二~三劑量(至多攜回一個月)第八、第九凝血因子、繞徑治療藥物、第十三凝血因子備用，繼續治療時，比照化療以「療程」方式處理，並查驗上次治療紀錄（如附表十八之一─全民健康保險血友病患者使用第八、第九凝血因子在家治療紀錄等）及申報費用時上傳上述治療紀錄表電子檔。醫療機構、醫師開立使用血液製劑時，應依血液製劑條例之規定辦理。","level":1},{"text":"10.於醫院內完成調配之靜脈營養輸液(TPN)，或不需調配之靜脈營養輸液，可攜回使用。(85/10/1、93/12/1、111/1/1)","level":1},{"text":"11.肢端肥大症病人使用之 octreotide、lanreotide (如 Sandostatin、Somatuline 等) 至多攜回一個月，另 octreotide (如 Sandostatin 等)需個案事前報准 (93/12/1)。lanreotide inj 30 mg (如 Somatuline) 每次注射間隔兩週 (88/6/1)，octreotide LAR (如 Sandostatin LAR Microspheres forInj.) 每次注射間隔四週 (89/7/1)。","level":1},{"text":"12.結核病病人持回之 streptomycin、kanamycin 及 enviomycin 注射劑（至多攜回二週） 。 （86/9/1）","level":1},{"text":"13.抗精神病長效針劑（至多攜回三個月） 。 （87/4/1、109/6/1）","level":1},{"text":"14.低分子量肝凝素注射劑：金屬瓣膜置換後之懷孕病患，可准予攜回低分子量肝凝素注射劑自行注射，但至多攜回兩週。 （90/11/1）","level":1},{"text":"15.Apomorphine hydrochloride 10mg/mL（如 Apo-Go Pen） ：限使用於巴金森氏病後期產生藥效波動（on-and-off）現象，且經使用其他治療方式無法改善之病患使用，每人每月使用量不得超過 20 支。 （91/2/1、99/11/1）","level":1},{"text":"16.罹患惡性貧血（pernicious anemia）及維生素 B12 缺乏病患，如不能口服者或口服不能吸收者，得攜回維生素 B12 注射劑，每次以一個月為限，且每三個月應追蹤一次。(91/4/1)","level":1},{"text":"17.患者初次使用 aldesleukin (如 Proleukin Inj) 治療期間（第一療程） ，應每週發藥，俾回診觀察是否有無嚴重之副作用發生。第一療程使用若未發生嚴重副作用，在第二療程以後可攜回兩週之處方量。(91/12/1)","level":1},{"text":"18.慢性病毒性 B 型肝炎、慢性病毒性 C 型肝炎所使用之長效型干擾素或短效型干擾素，至多攜回四週之使用量。(92/10/1)","level":1},{"text":"19.類風濕關節炎、僵直性脊椎炎、乾癬、乾癬性周邊關節炎、乾癬性脊椎病變與克隆氏症病患使用 etanercept、adalimumab、abatacept、tocilizumab、opinercept、certolizumab、brodalumab 等生物製劑皮下注射劑，經事前審查核准後，在醫師指導下，至多可攜回四週之使用量。(93/8/1、109/10/1)","level":1},{"text":"20.(刪除) (109/12/1)","level":1},{"text":"21.(刪除) (109/12/1)","level":1},{"text":"22.含 teriparatide 成分注射劑。(103/9/1)","level":1},{"text":"23.含 interferon beta-1a 成分注射劑。(103/9/1)","level":1},{"text":"24.含 interferon beta-1b 成分注射劑。(103/9/1)","level":1},{"text":"25.含 glatiramer 成分注射劑。(103/9/1)","level":1},{"text":"26.Fondaparinux（如 Arixtra）用於靜脈血栓高危險病患，接受人工髖或膝關節置換術或再置換術後，預防其術後之靜脈血栓(VTE)。（111/3/1)","level":1},{"text":"（三）電解質及營養靜脈補充輸液之使用，應說明理由並有明確需要，以積極治療為目的，始得為之。","level":0},{"text":"（四）癌症病人使用之 morphine 及化學治療藥品，於院內經醫師或藥師完成調劑作業後，亦可由病人攜回使用。 （85/10/1）","level":0}],"limited":false,"revisions":["86/9/1","92/5/1","100/4/1","108/10/1","109/2/1","86/1/1","109/12/1","98/9/1","98/11/1","85/10/1","93/12/1","111/1/1","88/6/1","89/7/1","87/4/1","109/6/1","90/11/1","91/2/1","99/11/1","91/4/1","91/12/1","92/10/1","93/8/1","109/10/1","103/9/1","111/3/1"],"deleted":false,"isHeader":false,"flags":{"priorAuth":true,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-05","section":"通則五","order":5,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"使用抗微生物製劑，應優先選用全民健康保險醫療常用第一線抗微生物製劑品名表 (附表…","drugs":[],"funding":"nhi","summary":"使用抗微生物製劑，應優先選用全民健康保險醫療常用第一線抗微生物製劑品名表 (附表一) 所列者為限。但經微生物培養及藥物敏感試驗確實有效或病情需要者，依本保險規定之抗微生物製劑使用原則用藥。","provisions":[{"text":"使用 0}],"limited":false,"revisions":["94/11/1","97/3/1","97/12 /1","97/12/1"],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-09","section":"通則九","order":9,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"本保險處方用藥有下列情況者視為重複用藥，不予給付","drugs":[],"funding":"nhi","summary":"本保險處方用藥有下列情況者視為重複用藥，不予給付(87/4/1)：","provisions":[{"text":"本保險處方用藥有下列情況者視為重複用藥，不予給付(87/4/1)：","level":0},{"text":"（一）為達相同之治療目的，使用兩種以上同一治療類別 (或作用機轉) 之藥品，視為重複用藥。","level":0},{"text":"（二）為達相同之治療目的，使用兩種以上不同治療類別 (或作用機轉) 之藥品，而未能增加療效；或其併用不符合一般醫學學理，且無文獻佐證者。","level":0},{"text":"（三）但下列情形除外：","level":0},{"text":"1.長短效的藥品搭配使用或不同劑型配合使用，且其使用方法符合各項藥品藥動學或藥理性質之特色者。","level":1},{"text":"2.緊急傷病情況下之合併使用者，且其併用符合一般醫學學理。","level":1},{"text":"3.本標準藥品給付規定有特別規定者。","level":1}],"limited":false,"revisions":["87/4/1"],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-10","section":"通則十","order":10,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"下列藥品為本保險界定之「無積極療效藥品」 ，不建議使用","drugs":[],"funding":"nhi","summary":"下列藥品為本保險界定之「無積極療效藥品」 ，不建議使用：","provisions":[{"text":"下列藥品為本保險界定之「無積極療效藥品」 ，不建議使用：","level":0},{"text":"（一）無藥品許可證，或許可證過期，或經主管機關再評估後未通過者。","level":0},{"text":"（二）醫學專科教科書未列舉，或載明不適用者。","level":0},{"text":"（三）醫學專科治療手冊未列舉，或載明不適用者。","level":0},{"text":"（四）對藥品療效之原始文獻 (primary data) 之評論未收載於「臨床醫學電腦資訊系統」(Computer Clinical Information System)，或未給予正面評價者。","level":0}],"limited":false,"revisions":[],"deleted":false,"isHeader":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true},{"id":"tz-11","section":"通則十一","order":11,"sectionConfidence":"high","group":"通則","groupTitle":"藥品給付規定通則","category":"general","title":"給付規定中年齡用詞統一使用「以上」 、 「以下」 、 「
