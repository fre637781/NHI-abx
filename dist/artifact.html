<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* 抗微生物劑健保給付規定查詢 — styles */
:root{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --ink:#1b1f24;
  --ink-soft:#5a636e;
  --line:#e2e6ec;
  --accent:#0b6b62;
  --accent-soft:#e3f2f0;
  --warn-bg:#fff7e6;
  --warn-line:#f0d08a;
  --warn-ink:#6b4e10;
  --chip-bg:#eef1f5;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#12161b;
  --panel:#1a1f26;
  --ink:#e7ecf2;
  --ink-soft:#9aa6b4;
  --line:#2a323c;
  --accent:#4fd1c0;
  --accent-soft:#12332f;
  --warn-bg:#2c2413;
  --warn-line:#5c4a1c;
  --warn-ink:#f0d08a;
  --chip-bg:#232a33;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161b; --panel:#1a1f26; --ink:#e7ecf2; --ink-soft:#9aa6b4;
    --line:#2a323c; --accent:#4fd1c0; --accent-soft:#12332f;
    --warn-bg:#2c2413; --warn-line:#5c4a1c; --warn-ink:#f0d08a;
    --chip-bg:#232a33; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.65;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--panel);padding:8px 12px;z-index:99;border-radius:6px}

.site-header{background:var(--panel);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand h1{margin:0;font-size:1.3rem;letter-spacing:.01em}
.brand h1 span{font-weight:400;color:var(--ink-soft)}
.brand .sub{margin:2px 0 0;font-size:.85rem;color:var(--ink-soft)}

.notice{
  margin-top:14px;background:var(--warn-bg);border:1px solid var(--warn-line);
  color:var(--warn-ink);border-radius:var(--radius);padding:10px 14px;font-size:.87rem;
  max-width:1040px;
}
.notice strong{margin-right:6px}

main{padding-bottom:48px}
.search-panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-top:14px;box-shadow:var(--shadow);
}
.search-row{display:flex;gap:8px}
#q{
  flex:1;padding:11px 13px;font-size:1rem;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);
}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.ghost-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.88rem;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent)}

.filter-group{display:flex;align-items:flex-start;gap:10px;margin-top:12px;flex-wrap:wrap}
.filter-label{
  flex:0 0 auto;font-size:.8rem;color:var(--ink-soft);padding-top:5px;
  min-width:2.6em;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--chip-bg);color:var(--ink);
  border-radius:999px;padding:4px 11px;font-size:.83rem;cursor:pointer;
  transition:background .12s,border-color .12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1a19}}
.chip .n{opacity:.65;font-size:.78em;margin-left:4px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.count{margin:0;font-size:.87rem;color:var(--ink-soft)}
.toolbar-actions{display:flex;align-items:center;gap:8px}
.sort-label{font-size:.8rem;color:var(--ink-soft)}
#sort{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:7px 9px;font-size:.85rem;
}

.results{display:flex;flex-direction:column;gap:10px}
.group-head{
  margin:14px 0 2px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;
}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card summary{
  list-style:none;cursor:pointer;padding:13px 15px;display:block;
}
.card summary::-webkit-details-marker{display:none}
.card summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2{margin:0;font-size:1.02rem;font-weight:650;line-height:1.4}
.badge{
  font-size:.72rem;padding:2px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--chip-bg);color:var(--ink-soft);
}
.badge.cat{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.badge.sec{font-variant-numeric:tabular-nums}
.badge.todo{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.badge.flag{background:transparent}
.badge.pa{border-color:#d97706;color:#b45309}
:root[data-theme="dark"] .badge.pa{color:#f0b429}
.card .summary-text{margin:7px 0 0;font-size:.92rem;color:var(--ink-soft)}
.card .brands{margin:6px 0 0;font-size:.82rem;color:var(--ink-soft)}
.card-body{padding:0 15px 15px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.card-body h3{font-size:.82rem;margin:0 0 6px;color:var(--ink-soft);letter-spacing:.04em}
.card-body ol{margin:0 0 12px;padding-left:1.3em}
.card-body li{margin:4px 0;font-size:.93rem}
.drug-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.drug-list li{background:var(--chip-bg);border-radius:6px;padding:3px 9px;font-size:.83rem}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.tag-list li{font-size:.76rem;color:var(--ink-soft);background:var(--chip-bg);border-radius:4px;padding:2px 7px}
.card-note{
  margin:10px 0 0;font-size:.83rem;background:var(--warn-bg);border-left:3px solid var(--warn-line);
  color:var(--warn-ink);padding:7px 10px;border-radius:4px;
}
mark{background:#ffe58a;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:#5c4a1c;color:#f6e7bd}

.empty{text-align:center;color:var(--ink-soft);padding:36px 12px}
.site-footer{border-top:1px solid var(--line);background:var(--panel);padding:18px 0;font-size:.83rem;color:var(--ink-soft)}
.site-footer p{margin:0 0 6px}
.site-footer a{color:var(--accent)}
.site-footer .meta{font-size:.78rem;opacity:.8}

@media (max-width:560px){
  .brand h1{font-size:1.1rem}
  .brand h1 span{display:block;font-size:.85rem}
  .toolbar-actions{width:100%;justify-content:flex-start}
}
@media print{
  .site-header button,.search-panel,.toolbar-actions,.skip,#dataNotice{display:none!important}
  body{background:#fff;font-size:11pt}
  .card{break-inside:avoid;box-shadow:none;border-color:#bbb}
  .card-body{display:block!important}
  details:not([open]) .card-body{display:block!important}
}

/* ---- 官方匯入版新增樣式 ---- */
.badge.first{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
:root[data-theme="dark"] .badge.first{color:#0d1a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.first{color:#0d1a19}}

.prov-list{list-style:none;margin:0 0 12px;padding:0}
.prov-list li{
  font-size:.93rem;margin:5px 0;padding-left:2px;line-height:1.7;
  border-left:2px solid transparent;
}
.prov-list li.lv1{margin-left:1.3em}
.prov-list li.lv2{margin-left:2.6em;color:var(--ink-soft)}
.prov-list li.lv3{margin-left:3.9em;color:var(--ink-soft)}
.prov-list li.lv1,.prov-list li.lv2,.prov-list li.lv3{
  border-left:2px solid var(--line);padding-left:9px;
}

.firstline-note{
  margin:10px 0 0;font-size:.83rem;background:var(--accent-soft);color:var(--accent);
  border-radius:4px;padding:6px 10px;
}
.revisions{margin:10px 0 0;font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.card.is-deleted{opacity:.6}
.card.is-deleted h2{text-decoration:line-through}

.firstline-panel{margin-top:26px}
.fl-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fl-cols h3{margin-top:0}
.fl-cols .drug-list{flex-direction:column;align-items:flex-start}
@media (max-width:560px){.fl-cols{grid-template-columns:1fr}}
.filter-group[hidden]{display:none}

/* ---- 多主題分頁 ---- */
.topic-tabs{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;
  border-bottom:1px solid var(--line);padding-bottom:0;
}
.topic-tab{
  display:flex;flex-direction:column;gap:1px;align-items:flex-start;
  border:1px solid var(--line);border-bottom:none;
  background:var(--chip-bg);color:var(--ink-soft);
  border-radius:8px 8px 0 0;padding:7px 14px 8px;cursor:pointer;
  font-family:inherit;font-size:.9rem;line-height:1.3;
  position:relative;top:1px;
}
.topic-tab:hover{color:var(--accent);border-color:var(--accent)}
.topic-tab[aria-pressed="true"]{
  background:var(--panel);color:var(--ink);border-color:var(--line);
  border-bottom:1px solid var(--panel);font-weight:600;
}
.topic-tab .tt-short{font-size:.7rem;opacity:.7;font-weight:400}
.topic-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.badge.topic{background:var(--ink-soft);color:var(--panel);border-color:transparent;font-weight:600}
.badge.screen{border-color:#7c5cbf;color:#6b4bb0}
:root[data-theme="dark"] .badge.screen{color:#b9a3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.screen{color:#b9a3e8}}

@media (max-width:560px){
  .topic-tab{padding:6px 10px 7px;font-size:.85rem}
  .topic-tab .tt-short{display:none}
}
@media print{.topic-tabs{display:none!important}}

ame":"Streptomycin","note":"","deleted":false},{"name":"Flucloxacillin","note":"94/3/1","deleted":false}]}},"categories":[{"id":"general","label":"通則"},{"id":"antibiotic","label":"抗細菌劑"},{"id":"antifungal","label":"抗黴菌劑"},{"id":"antiviral","label":"抗病毒劑"},{"id":"hepatitis","label":"肝炎抗病毒"},{"id":"hiv","label":"抗 HIV"}],"fundingTypes":[{"id":"nhi","label":"健保給付"},{"id":"public","label":"公費（疾管署等）"},{"id":"mixed","label":"健保／公費併行"}],"items":[{"id":"sec-10-1","section":"10.1","sectionConfidence":"high","group":"10.1","groupTitle":"抗微生物劑用藥給付規定通則","category":"general","title":"抗微生物劑用藥給付規定通則","drugs":[],"funding":"nhi","summary":"凡醫師診斷為感染症，確有臨床需要者得適當使用抗微生物製劑。","provisions":[{"text":"1.凡醫師診斷為感染症，確有臨床需要者得適當使用抗微生物製劑。","level":0},{"text":"2.門診使用抗微生物製劑以不超過三日份用量為原則。如有必要，每次以七日為限；慢性骨髓炎病患得視病情需要延長抗微生物製劑給藥日數，惟每次門診處方仍以兩週為上限(87/7/1)。","level":0},{"text":"3.「上呼吸道感染病患」如屬一般感冒（common cold ）或病毒性感染者，不應使用抗生素。如需使用，應有細菌性感染之臨床佐證，例如診斷為細菌性中耳炎、細菌性鼻竇炎、細菌性咽喉炎，始得使用抗生素治療（90/2/1）。","level":0},{"text":"4.使用抗微生物製劑，宜以同療效、價廉為原則。使用三種抗微生物製劑(含)以上，需附微生物培養及藥物敏感試驗報告，藥物敏感試驗報告應包括第一線及第二線抗微生物製劑及各類常用藥物；同類同抗菌範疇之抗微生物製劑，若未能都進行藥物敏感性試驗時，得以其中之一種藥物的敏感性試驗結果做為使用其他同類同抗菌範疇藥物合理性之判定參考。（87/4/1）","level":0},{"text":"5.使用抗微生物製劑應以本保險規定之第一線抗微生物製劑優先使用，如欲使用第一線以外之抗微生物製劑，需依規定第6、7項辦理。","level":0},{"text":"6.醫師得按下列病情及診斷於進行微生物培養及藥物敏感試驗後直接使用第一線以外抗微生物製劑，惟若微生物培養證明第一線抗微生物製劑有效，應考慮改用第一線抗微生物製劑。(91/4/1)","level":0},{"text":"(1)感染病情嚴重者，包括：","level":1},{"text":"Ⅰ.敗血症(sepsis)或敗血性休克(septic shock)","level":3},{"text":"Ⅱ.中樞神經感染","level":3},{"text":"Ⅲ.使用呼吸器者。","level":3},{"text":"(2)免疫狀態不良併發感染者：","level":1},{"text":"Ⅰ.接受免疫抑制劑。","level":3},{"text":"Ⅱ.接受抗癌化學療法。","level":3},{"text":"Ⅲ.白血球數在1000/cumm 以下或多核白血球數在500/cumm 以下。","level":3},{"text":"(3)經感染症專科醫師會診，確認有感染症需使用者 (申報費用時需檢附會診紀錄及相關之病歷資料)（86/10/1、92/9/1)。","level":1},{"text":"(4)手術中發現有明顯感染病灶者。","level":1},{"text":"(5)脾臟切除病人有不明原因發熱者。","level":1},{"text":"(6)臟器穿孔。","level":1},{"text":"(7)嚴重污染傷口病人。","level":1},{"text":"(8)患疑似感染之早產兒及新生兒（出生二個月以內）。","level":1},{"text":"(9)發生明確嚴重院內感染症者。","level":1},{"text":"(10)常有厭氧菌與非厭氧菌混合感染之組織部位感染時(如糖尿病足部壞疽併感染、骨盆腔內感染)，得直接使用可同時治療厭氧菌與非厭氧菌多重感染之單一非第一線抗微生物製劑。","level":1},{"text":"7.醫師得按下列病情改用第一線以外抗微生物製劑：","level":0},{"text":"(1)使用第一線抗微生物製劑超過72小時，經微生物培養及藥物敏感試驗證實對第一線抗微生物製劑具抗藥性，確有需要使用者，並請檢附該檢驗報告。","level":1},{"text":"(2)每72小時更換第一線抗微生物製劑一次，歷經 7日以上仍無效，由其他醫療機構轉送至有微生物培養室醫院病人者。","level":1},{"text":"(3)嬰幼兒（出生二個月以上至滿五足歲）患疑似感染疾病，在使用第一線抗微生物製劑72小時仍無明顯療效者。","level":1},{"text":"8.預防性的使用抗微生物製劑：（105/2/1）。","level":0},{"text":"(1)清淨的手術：大致可分甲、乙兩類。甲類：如單純性疝氣手術、精索靜脈曲張手術、甲狀腺手術、乳房切除手術…等，原則上可「免用」抗微生物製劑，如需使用，可術前一劑量，手術時間超過二小時者得於術中追加一劑，使用之抗微生物製劑應以本表之第一線抗微生物製劑為限（90/2/1）。乙類：如心臟手術、腦部手術、臟器移植手術及放置人工植入物之手術，原則上使用不可超過24小時，以本表之第一線抗微生物製劑為主；如需使用第一線以外之抗微生物製劑或超過48小時，請詳敘理由，俾利審查（90/2/1、","level":1},{"text":"(2)清淨但易受污染的手術。術野是清淨但術中易受污染，如肝膽胃腸手術、泌尿道手術、肺部手術、婦科手術、耳鼻喉科手術、牙科手術…等手術。原則上抗微生物製劑使用24小時，以本表之第一線抗微生物製劑為主，若有厭氧菌與嗜氧菌混合污染之可能時，得使用Cephamycin（cefoxitin,cefmetazole）或 ampicillin 類合併 β-lactamaseinhibitor（ampicillin/sulbactam,amoxicillin/clavulanic acid ）之藥物；如需使用第一線以外之抗微生物製劑或超過48小時，請詳敘理由，俾利審查（90/2/1、95/6/1)。","level":1},{"text":"(3)免疫不全病人經醫師判斷感染風險高，依實證及流行病學資料及相關治療指引等，經感染症專科醫師認定需使用者，得適當使用預防性抗微生物製劑。申報費用時需檢附會診紀錄及相關之病歷資料。（105/2/1）。","level":1},{"text":"9.污染性傷口之手術及手術後發生感染併發症，依本保險規定之抗微生物製劑使用原則用藥（90/2/1）。","level":0},{"text":"10.本保險第一線抗微生物製劑範圍暫訂如附表一，並得視實際需要予以增減。","level":0},{"text":"11.使用本表以外之抗微生物製劑超過七日時，除需附微生物培養與敏感試驗報告外，尚需附相關檢驗報告（如血、尿…等）與 TPR chart 影本並註明使用抗微生物製劑之規格、劑量、使用日期以利審核。","level":0},{"text":"12.非第一線抗微生物製劑其於本藥品給付規定中另訂有規定者，依各該規定給付之。","level":0},{"text":"13.有關結核病治療選擇的藥物種類、使用的劑量與治療的時程，應依衛生福利部疾病管制署最新版「結核病診治指引」辦理。(99/11/1、102/7/23、108/12/1)","level":0}],"limited":false,"revisions":["95/6/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":true,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-2","section":"10.2","sectionConfidence":"high","group":"10.2","groupTitle":"盤尼西林類 Penicillins","category":"antibiotic","title":"盤尼西林類 Penicillins","drugs":[],"funding":"nhi","summary":"盤尼西林類 Penicillins","provisions":[],"limited":false,"revisions": 做為預防侵入性黴菌感染，使用期間以3個月為限。(106/5/1)","level":1},{"text":"(4)急性骨髓性白血病 (acute myelogenous leukemia) 或高危險骨髓化生不良症候群(myelodysplastic syndrome) 病人接受誘導性化學治療者，給付條件如下：","level":1},{"text":"Ⅰ.用於初診斷之誘導性化學治療、誘導失敗進行第二次誘導性化學治療，或復發病患進行復發後第一次誘導性化學治療者。","level":3},{"text":"Ⅱ.誘導性化學治療需使用「cytarabine(Ara-C)7天及 anthracycline 類藥物3天」 、或「高劑量Ara-C」 、或「老年人(60歲以上)使用 cytarabine (Ara-C)5天及 anthracycline 類藥物2天」、或較上述療法更強的化學治療(111/2/1)。","level":3},{"text":"Ⅲ.自化學治療第一天開始使用，當絕對嗜中性白血球數(absolute neutrophilcount,ANC)大於500/mm3，或出現侵入性黴菌感染時應停止使用。每次療程投予 posaconazole 預防以一個月為限，最多給付2次誘導性化學治療療程。","level":3},{"text":"Ⅳ.口服劑型限用於13歲以上病人、注射劑限用於18歲以上病人。(106/5/1)","level":3},{"text":"2.使用本藥須經感染症專科醫師會診確認需要使用，申報費用時需檢附會診紀錄及相關之病歷資料。","level":0},{"text":"3.注射劑限用於無法口服之病人。(106/5/1)","level":0}],"limited":false,"revisions":["101/1/1","104/7/1","106/5/1","111/2/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":true,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-6-11","section":"10.6.11","sectionConfidence":"high","group":"10.6","groupTitle":"抗黴菌劑 Antifungal drugs","category":"antifungal","title":"Isavuconazole（如 Cresemba）","drugs":[{"generic":"Isavuconazole","zh":"","brands":["Cresemba"]}],"funding":"nhi","summary":"限用於:","provisions":[{"text":"1.限用於:","level":0},{"text":"(1)侵犯性麴菌症（invasive aspergillosis ）","level":1},{"text":"(2)使用於不適合接受 amphotericin B 的病人治療白黴菌病（mucormycosis）","level":1},{"text":"2.使用本藥須經感染症專科醫師會診確認需要使用，申報費用時需檢附會診紀錄及相關之病歷資料。","level":0},{"text":"3.注射劑限用於無法口服之病人。","level":0}],"limited":false,"revisions":["110/2/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":true,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7","section":"10.7","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"antiviral","title":"抗病毒劑 Antiviral drugs","drugs":[],"funding":"nhi","summary":"抗病毒劑 Antiviral drugs","provisions":[],"limited":false,"revisions":["98/11/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":true},{"id":"sec-10-7-1","section":"10.7.1","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"antiviral","title":"抗疱疹病毒劑","drugs":[],"funding":"nhi","summary":"抗疱疹病毒劑","provisions":[],"limited":false,"revisions":["98/11/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":true},{"id":"sec-10-7-1-1","section":"10.7.1.1","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"antiviral","title":"全身性抗疱疹病毒劑","drugs":[],"funding":"nhi","summary":"Acyclovir：(98/11/1、100/7/1、107/12/1、108/3/1、108/6/1)","provisions":[{"text":"1.Acyclovir：(98/11/1、100/7/1、107/12/1、108/3/1、108/6/1)","level":0},{"text":"(1)使用本類製劑，除200mg(限 Deherp)、400mg 及800mg(限 Virless)規格量口服錠劑外，應以下列條件為限：(107/12/1、108/3/1、108/6/1)I.疱疹性腦炎。","level":1},{"text":"Ⅱ.帶狀疱疹或單純性疱疹侵犯三叉神經第一分枝 VI 皮節，可能危及眼角膜者。","level":3},{"text":"Ⅲ.帶狀疱疹或單純性疱疹侵犯薦椎 S2皮節，將影響排泄功能者。","level":3},{"text":"Ⅳ.免疫機能不全、癌症、器官移植等病患之感染帶狀疱疹或單純性疱疹者。","level":3},{"text":"Ⅴ.新生兒或免疫機能不全患者的水痘感染。","level":3},{"text":"Ⅵ.罹患水痘，合併高燒(口溫38℃以上)及肺炎(需X光顯示)或腦膜炎，並需住院者。 （85/1/1）","level":3},{"text":"Ⅶ.帶狀疱疹或單純性疱疹所引起之角膜炎或角膜潰瘍者。","level":3},{"text":"Ⅷ.急性視網膜壞死症(acute retina necrosis) 。","level":3},{"text":"Ⅸ.帶狀疱疹發疹三日內且感染部位在頭頸部、生殖器周圍之病人，可給予五日內之口服或外用藥品。(86/1/1、87/4/1)","level":3},{"text":"Ⅹ.骨髓移植術後病患得依下列規定預防性使用 acyclovir： （87/11/1）A.限接受異體骨髓移植病患。B.接受高劑量化療或全身放射治療 (TBI) 前一天至移植術後第三十天為止。","level":3},{"text":"(2)其中Ⅰ與Ⅵ應優先考慮注射劑型的 acyclovir。疱疹性腦炎得使用14至21天。","level":1},{"text":"(3)使用 acyclovir 200mg( 限 Deherp)、400mg 及800mg(限 Virless)規格量口服錠劑除用於前述(1)外，療程以7天為限。(107/12/1、108/3/1、108/6/1)","level":1},{"text":"2.Famciclovir；valaciclovir：(100/7/1、101/5/1)使用本類製劑應以下列條件為限：","level":0},{"text":"(1)帶狀疱疹或單純性疱疹侵犯三叉神經第一分枝 VI 皮節，可能危及眼角膜者。","level":1},{"text":"(2)帶狀疱疹或單純性疱疹侵犯薦椎 S2皮節，將影響排泄功能者。","level":1},{"text":"(3)免疫機能不全、癌症、器官移植等病患之感染帶狀疱疹或單純性疱疹者。","level":1},{"text":"(4)帶狀疱疹或單純性疱疹所引起之角膜炎或角膜潰瘍者。","level":1},{"text":"(5)急性視網膜壞死症 (acute retina necrosis) 。","level":1},{"text":"(6)帶狀疱疹發疹3日內且感染部位在頭頸部、生殖器周圍之病人，可給予5日內之口服或外用藥品。","level":1},{"text":"(7)骨髓移植術後病患得依下列規定用於預防復發性生殖器疱疹：(101/5/1)A.限接受異體骨髓移植病患。B.接受高劑量化療或全身放射治療 (TBI) 前一天至移植術後第30天為止。","level":1},{"text":"3.Acyclovir、famciclovir 及 valaciclovir 除上述特別規定外，使用療程原則以10天為限，口服、注射劑及外用藥膏擇一使用，不得合併使用。（95/6/1、100/7/1、","level":0}],"limited":false,"revisions":["95/6/1","100/7/1","101/5/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-1-2","section":"10.7.1.2","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"antiviral","title":"局部抗疱疹病毒劑（如 Acyclovir 外用製劑；tromantadine 外用製劑； penciclovir 外用製劑）","drugs":[],"funding":"nhi","summary":"單純性疱疹(感染部位在頭頸部、生殖器周圍、嘴唇、口腔、陰部)3日內可使用acyclovir 或 tromantadine 藥膏，每次給予藥量限5公克以內(100/7/1）。","provisions":[{"text":"1.單純性疱疹(感染部位在頭頸部、生殖器周圍、嘴唇、口腔、陰部)3日內可使用acyclovir 或 tromantadine 藥膏，每次給予藥量限5公克以內(100/7/1）。","level":0},{"text":"2.Penciclovir 藥膏用於治療由單純皰疹病毒引起之復發性唇皰疹，每次處方以1支(2公克)為原則。(102/7/1)","level":0},{"text":"3.口服、注射劑及外用藥膏擇一使用，不得合併使用。","level":0}],"limited":false,"revisions":["97/12/1","98/11/1","100/7/1","102/7/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-2","section":"10.7.2","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"hepatitis","title":"Ribavirin 膠囊劑（如 Robatrol、Rebetol）","drugs":[{"generic":"Ribavirin","zh":"","brands":["Robatrol","Rebetol"]}],"funding":"nhi","summary":"限用於下列慢性病毒性 C 型肝炎患者且應與 interferon-alfa 2a 或 interferon-alfa 2b 或 interferon alfacon-1 或 peginterferon alfa-2b 或 peginterferonalfa-2a 合併治療：","provisions":[{"text":"1.限用於下列慢性病毒性 C 型肝炎患者且應與 interferon-alfa 2a 或 interferon-alfa 2b 或 interferon alfacon-1 或 peginterferon alfa-2b 或 peginterferonalfa-2a 合併治療：","level":0},{"text":"(1)限 ALT 值異常者，且 Anti-HCV 與 HCV RNA 均為陽性，或經由肝組織切片，以METAVIR system 證實輕度纖維化大於或等於 F1及肝炎變化，且無肝功能代償不全者。 （98/11/1、114/6/1）","level":1},{"text":"(2)療程依 Viral Kinetics 區分如下:（98/11/1）","level":1},{"text":"Ⅰ.有 RVR (rapid virological response, 快速病毒反應)者，給付治療不超過24週。","level":3},{"text":"Ⅱ.無 RVR，但有 EVR (early virologic response) 者，給付治療48週。","level":3},{"text":"Ⅲ.到第12週未到 EVR 者，應中止治療，治療期間不超過16週。","level":3},{"text":"Ⅳ.第一次治療24週後復發者，可以給予第二次治療，給付不超過48週。","level":3},{"text":"2.醫事服務機構及醫師資格：(109/7/1、111/9/1)","level":0},{"text":"(1)醫院：","level":1},{"text":"Ⅰ.有消化系內科或消化系兒科專科醫師之醫院。","level":3},{"text":"Ⅱ.醫師資格為前開醫院之消化系內科專科醫師、消化系兒科專科醫師、血液病專科醫師、腫瘤內科專科醫師、癌症相關科醫師及符合器官移植手術資格之專任或兼任專科醫師。","level":3},{"text":"Ⅲ.前開非消化系專科醫師，需先照會消化系專科醫師，惟愛滋病毒感染患者併有B 型或 C 肝炎感染者，得由其照護之感染症內科專科醫師開立處方。","level":3},{"text":"(2)基層院所：","level":1},{"text":"Ⅰ.須具有消化系內科或消化系兒科專任專科醫師之基層院所。","level":3},{"text":"Ⅱ.肝炎治療醫療資源不足地區及山地離島地區，具有消化系內科或消化系兒科兼任專科醫師之基層院所，亦得開立處方，惟離島地區(如金門縣、連江縣、澎湖縣、台東縣蘭嶼鄉、台東縣綠島鄉)內科醫師之基層院所，亦得開立處方。◎附表三十四：肝炎治療醫療資源不足地區及山地離島地區一覽表","level":3}],"limited":false,"revisions":["93/2/1","93/7/1","93/8/1","95/11/1","98/11/1","100/4/1","109/7/1","114/6/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-3","section":"10.7.3","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"hepatitis","title":"Lamivudine 100mg（如 Zeffix）；entecavir（如 Baraclude）；telbivudine（如 Sebivo）；tenofovir disoproxil（如 Viread）；tenofovir alafenamide（如 Vemlidy）","drugs":[{"generic":"Lamivudine","zh":"","brands":["Zeffix"]},{"generic":"entecavir","zh":"","brands":["Baraclude"]},{"generic":"telbivudine","zh":"","brands":["Sebivo"]},{"generic":"tenofovir disoproxil","zh":"","brands":["Viread"]},{"generic":"tenofovir alafenamide","zh":"","brands":["Vemlidy"]}],"funding":"nhi","summary":"用於慢性病毒性 B 型肝炎患者之條件如下：","provisions":[{"text":"用於慢性病毒性 B 型肝炎患者之條件如下：","level":0},{"text":"1.HBsAg(+)且已發生肝代償不全者，以 lamivudine 100mg 、entecavir 1.0mg 、telbivudine、tenofovir disoproxil 或 tenofovir alafenamide 治療，其給付療程如下： （98/11/1、100/6/1、102/2/1、104/12/1、106/1/1、106/4/1、108/5/1、","level":0},{"text":"(1)HBeAg 陽性病患治療至 e 抗原轉陰並再給付最多12個月治療。","level":1},{"text":"(2)HBeAg 陰性病患治療至少二年，治療期間需檢驗血清 HBV DNA ，並於檢驗血清 HBVDNA 連續三次，每次間隔6個月，均檢驗不出 HBV DNA 時停藥，每次療程至多給付36個月。註：","level":1},{"text":"Ⅰ.肝代償不全條件為 prothrombin time 延長≧3秒或 bilirubin(total)≧2.0mg/dL，prothrombin time 延長係以該次檢驗 control 值為準。","level":3},{"text":"Ⅱ.Entecavir 每日限使用1粒。","level":3},{"text":"2.慢性B型肝炎病毒帶原者 HBsAg(+)，或 HBsAg(-)但 B 型肝炎核心抗體(anti-HBc)陽性者： （98/11/1、110/3/1、114/6/1）","level":0},{"text":"(1)接受非肝臟之器官移植者，自移植前7天內可開始預防性使用，或接受非肝臟之器官移植後，B 型肝炎發作者，可長期使用。(98/11/1、110/3/1)","level":1},{"text":"(2)接受癌症化學療法中，B 型肝炎發作者，經照會消化系專科醫師同意後，可長期使用。(93/2/1、94/10/1、98/11/1)","level":1},{"text":"(3)接受肝臟移植者，可預防性使用。(95/10/1、98/11/1)","level":1},{"text":"(4)接受癌症化學療法，經照會消化系專科醫師同意後，可於化學療法前1週開始給付使用，直至化學療法結束後6個月，以預防B型肝炎發作。（98/11/1）","level":1},{"text":"(5)肝硬化病患，可長期使用。(99/7/1、110/3/1、114/6/1)註：肝硬化條件為需同時符合下列二項條件: (99/7/1 、110/3/1、114/6/1)I.HBsAg(+)且可檢驗到血清 HBV DNA 。(110/3/1)","level":1},{"text":"Ⅱ.診斷標準（99/7/1、114/6/1）：a.肝組織切片（Metavir F4 或 Ishak F5 以上） （114/6/1）；或b.超音波診斷為肝硬化併食道或胃靜脈曲張，或超音波診斷為肝硬化併脾腫大、超音波診斷為肝硬化且血小板< 120,000/ μL，或肝硬度超音波診斷為肝硬化。若患者因其他臨床適應症接受電腦斷層或核磁共振檢查而被診斷為肝硬化時，可做為診斷依據。(110/3/1)註：以肝硬度超音波證實等同 METAVIR system 纖維化等於 F4之定義：transient elastography (Fibroscan) ≧ 12 Kpa 或 Acoustic RadiationForce Impulse elastography (ARFI) ≧ 1.98。(110/3/1)","level":3},{"text":"(6)在異體造血幹細胞移植時：(104/12/1)","level":1},{"text":"Ⅰ.捐贈者之 HBsAg 為陽性反應，則捐贈者可自其確認為移植捐贈者後開始使用預防性抗病毒藥物治療，原則上治療到血液中偵測不到 HBV DNA ；若捐贈者符合","level":3},{"text":"10.7.3之3至5項治療條件，則依其規範給付。","level":0},{"text":"Ⅱ. 受贈者之 HBsAg 為陽性反應，或捐贈來源之 HBsAg 為陽性反應，則受贈者可在經照會消化系專科醫師同意後，於移植前一週起至移植後免疫抑制藥物停用後6個月內，給付使用抗 B 型肝炎病毒藥物以預防發作。","level":3},{"text":"(7)血清 HBV DNA ≧ 2×10IU/mL 之懷孕者，可於懷孕滿27週後開始給付使用telbivudine、tenofovir disoproxil 或 tenofovir alafenamide ，直至產後4週。 （107/2/1、108/5/1、114/6/1）","level":1},{"text":"(8)確診為肝癌並接受根除性治療且可檢驗到血清 HBV DNA ，可長期使用，直至肝癌復發且未能再次接受根除性治療止。 （108/2/1、110/3/1）註：a.根除性治療包括手術切除、肝臟移植、射頻燒灼(radiofrequency ablation) 、局部酒精注射及微波消融(microwave ablation) 、冷凍治療(cryotherapy)。b.已符合肝硬化給付條件可長期使用者，不在此限。","level":1},{"text":"(9)接受免疫抑制劑治療者：(110/3/1)","level":1},{"text":"Ⅰ.預防使用：HBsAg(+)者，於接受下列免疫抑制藥物治療前一週起，至免疫抑制藥物停用後6個月內，免疫抑制藥物如下列:i.Rituximab。ii.Anthracycline 類衍生物。iii.中高劑量類固醇（指 prednisolone≧ 20mg/day 或相當之劑量，使用時問超過4週。）","level":3},{"text":"Ⅱ.HBsAg(+)者，或 HBsAg(-)但 B 型肝炎核心抗體陽性者，於接受免疫抑制藥物治療後 B 型肝炎發作，開始給付使用抗病毒藥物治療，給付至免疫抑制劑停用後6個月。","level":3},{"text":"3.HBsAg(+)超過6個月(或 IgM anti-HBc 為陰性)及 HBeAg(+)，且符合以下條件之一者，其給付療程為治療至 e 抗原轉陰並再給付最多12個月： （93/8/1、95/11/1、","level":0},{"text":"(1)ALT 值大於(或等於)正常值上限5倍以上(ALT≧5X)。","level":1},{"text":"(2)ALT 值介於正常值上限2至5倍之間(2X≦ALT<5X)，且血清 HBV DNA ≧20,000IU/mL，或經由肝組織切片證實 HBcAg 陽性。 （93/8/1、98/11/1、114/6/1）","level":1},{"text":"(3)經由肝組織切片或肝臟纖維化掃描或 Fibrosis-4 (FIB-4) 證實，等同 METAVIRsystem 纖維化大於或等於 F3者，其 ALT 值半年有兩次以上（間隔大於3個月）大於正常值上限(ALT>X)，且血清 HBV DNA ≧ 20,000 IU/mL 或經由肝組織切片證實HBcAg 陽性之患者。(110/3/1、114/6/1)註：以肝臟纖維化掃描或 Fibrosis-4 (FIB-4) 證實等同 METAVIR system 纖維化大於或等於 F3之定義為：","level":1},{"text":"Ⅰ.肝臟纖維化掃描 transient elastography (Fibroscan) ≧9.5Kpa 或Acoustic Radiation Force Impulse elastography (ARFI) ≧1.81。","level":3},{"text":"Ⅱ.Fibrosis-4 (FIB-4) ≧3.25，計算公式為[Age(years) × AST(U/L)] /[Platelet count(109/L) × √ALT(U/L)]。","level":3},{"text":"4.HBsAg(+)超過6個月(或 IgM anti-HBc 為陰性)及 HBeAg(-)，且符合以下條件之一者，其療程至少二年，治療期間需檢驗血清 HBV DNA ，並於檢驗血清 HBV DNA 連續三次，每次間隔6個月，均檢驗不出 HBV DNA 時停藥，每次療程至多給付36個月：","level":0},{"text":"(1) ALT 值大於或等於正常值上限 2 倍以上(ALT≧ 2X)，且血清 HBV DNA ≧2,000IU/mL，或經由肝組織切片證實 HBcAg 陽性。惟 Fofnir、Hepwin、Sebivo、Ricovir、Hepuri、Virclean、Teno B 、Tenof、Viread、Livepro、Lamidine、Hepar-Pro、Hepato-Ease、Barazer、Becavir 等除上述條件外，應符合 ALT 值半年有兩次以上(每次間隔 3 個月)大於或等於正常值上限 2 倍以上(ALT≧ 2X)。","level":1},{"text":"(2) 肝纖維化程度大於或等於 F2，其 ALT 值半年有兩次以上（間隔大於 3 個月）大於正常值上限(ALT>X)，且血清 HBV DNA ≧ 20,000 IU/mL 或經由肝組織切片證實 HBcAg 陽性。惟 Fofnir、Hepwin、Sebivo、Ricovir、Hepuri、Virclean、Teno B 、Tenof、Viread、Livepro、Lamidine、Hepar-Pro、Hepato-Ease、Barazer、Becavir 等除上述條件外，應符合肝纖維化程度大於或等於 F3。註：以肝臟纖維化掃描或 Fibrosis-4(FIB-4)證實等同 METAVIR system 纖維化大於或等於 F2之定義為：(112/10/1)","level":1},{"text":"Ⅰ.肝臟纖維化掃描 transient elastography (Fibroscan) ≧8Kpa 或 AcousticRadiation Force Impulse elastography (ARFI) ≧1.5。","level":3},{"text":"Ⅱ.Fibrosis-4 (FIB-4) ≧2.1，計算公式為[Age(years) × AST(U/L)] /[Platelet count(109/L) × √ALT(U/L)]。","level":3},{"text":"5.若上述治療中出現 lamivudine 100mg 、entecavir、telbivudine 抗藥性病毒株，可改換對於抗藥株有效之 B 型肝炎抗病毒藥劑治療，治療藥物及療程之規定詳如","level":0},{"text":"10.7.4.之 1至4項。 （98/11/1、99/5/1、99/7/1、102/2/1、104/12/1）","level":0},{"text":"6.符合第3至4項條件者，若使用 entecavir，劑量為每日0.5mg。(104/12/1、110/3/1)","level":0},{"text":"7.醫事服務機構及醫師資格：(109/7/1、111/9/1、114/6/1)","level":0},{"text":"(1)醫院：","level":1},{"text":"Ⅰ.有消化系內科或消化系兒科專科醫師之醫院。","level":3},{"text":"Ⅱ.醫師資格為前開醫院之消化系內科專科醫師、消化系兒科專科醫師、血液病專科醫師、腫瘤內科專科醫師、癌症相關科醫師、符合器官移植手術資格及風濕免疫科專科醫師之專任或兼任專科醫師。(111/9/1)","level":3},{"text":"Ⅲ.前開非消化系專科醫師，需先照會消化系專科醫師，惟愛滋病毒感染患者併有B 型或 C 肝炎感染者，得由其照護之感染症內科專科醫師開立處方；另懷孕滿27 週直至產後 4 週之孕產婦接受第2次以後治療者，得由其婦產科專科醫師開立處方。 （111/9/1、114/6/1）。","level":3},{"text":"(2)基層院所：","level":1},{"text":"Ⅰ.須具有消化系內科或消化系兒科專任專科醫師之基層院所。","level":3},{"text":"Ⅱ.肝炎治療醫療資源不足地區及山地離島地區，具有消化系內科或消化系兒科兼任專科醫師之基層院所，亦得開立處方，惟離島地區(如金門縣、連江縣、澎湖縣、台東縣蘭嶼鄉、台東縣綠島鄉)內科醫師之基層院所，亦得開立處方。","level":3},{"text":"Ⅲ.懷孕滿 27 週直至產後 4 週之孕產婦接受第2次以後治療者，得由其婦產科專科醫師開立處方。 （114/6/1）◎附表三十四：肝炎治療醫療資源不足地區及山地離島地區一覽表","level":3}],"limited":false,"revisions":["92/10/1","93/2/1","93/8/1","94/10/1","95/10/1","95/11/1","97/8/1","98/11/1","99/5/1","99/7/1","100/6/1","102/2/1","104/12/1","106/1/1","106/4/1","107/2/1","108/2/1","108/5/1","109/1/1","109/7/1","110/3/1","111/3/1","111/9/1","112/10/1","113/1/1","113/4/1","114/6/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-4","section":"10.7.4","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"hepatitis","title":"Adefovir dipivoxil（如 Hepsera Tablets 10mg） ；Entecavir（如 Baraclude","drugs":[{"generic":"Adefovir dipivoxil","zh":"","brands":["Hepsera Tablets 10mg"]},{"generic":"Entecavir","zh":"","brands":[]},{"generic":"Baraclude","zh":"","brands":[]}],"funding":"nhi","summary":"0mg)；tenofovir disoproxil ( 如 Viread)；tenofovir alafenamide ( 如Vemlidy)：(95/9/1、95/10/1、97/8/1、98/11/1、99/5/1、99/7/1、102/2/1、用於慢性病毒性 B 型肝炎患者之條件如下：","provisions":[{"text":"1.0mg)；tenofovir disoproxil ( 如 Viread)；tenofovir alafenamide ( 如Vemlidy)：(95/9/1、95/10/1、97/8/1、98/11/1、99/5/1、99/7/1、102/2/1、用於慢性病毒性 B 型肝炎患者之條件如下：","level":0},{"text":"1.經使用 lamivudine 100mg 、entecavir 0.5mg 或1.0mg、telbivudine 治療或預防 B型肝炎發作出現抗藥株(指於治療中一旦 HBV DNA 從治療期間之最低值上升超過一個對數值（1 log IU/mL ） ，以下條件擇一給付： （98/11/1、99/5/1、102/2/1、","level":0},{"text":"(1)得以原治療藥物再加上 adefovir 進行合併救援治療（rescue therapy ）；","level":1},{"text":"(2)改用 entecavir 1.0mg( 僅限於 lamivudine 產生抗藥性之病人)單一藥物治療；","level":1},{"text":"(3)以 Interferon alpha-2a （如 Roferon-A）或 interferon alpha-2b （如 IntronA）或 peginterferon alfa-2a （如 Pegasys）治療1年。 （98/11/1、99/5/1、","level":1},{"text":"(4)改用 tenofovir disoproxil 或 tenofovir alafenamide 單一藥物治療。","level":1},{"text":"(5)原已接受其他口服抗病毒藥物救援治療，治療期間出現抗藥株，或治療未達預期之病毒學反應，得改以 tenofovir disoproxil 或 tenofovir alafenamide 單一藥物救援治療。(104/12/1、106/4/1、108/5/1)","level":1},{"text":"2.若停藥後復發，得以合併療法，或 tenofovir disoproxil 或 tenofoviralafenamide 單一藥物再治療，或以干擾素再治療1年。(99/7/1、104/12/1、","level":0},{"text":"3.慢性 B 型肝炎表面抗原（HBsAg）帶原者：","level":0},{"text":"(1)肝硬化之病患。(99/7/1)","level":1},{"text":"(2)接受非肝臟之器官移植後發作或接受肝臟移植，須持續接受免疫抑制劑時。（95/10/1、97/8/1、99/5/1）上述病患長期使用 lamivudine 100mg 、entecavir","level":1},{"text":"0.5mg、telbivudine，以治療或預防 B 型肝炎發作，若出現抗藥性病毒株者，治療藥物及療程之規定詳如10.7.4.之1項。 （95/10/1、97/8/1、99/5/1、 99/7/1、","level":0},{"text":"4.臨床上若產生多重抗藥病毒株時可給予 tenofovir disoproxil 或 tenofoviralafenamide 單一藥物治療，或合併 entecavir 1.0mg 及 tenofovir disoproxil 治療，或合併 entecavir 1.0mg 及 tenofovir alafenamide 治療。(104/12/1、註：多重抗藥病毒株指病毒對 lamivudine、telbivudine、entecavir 或 adefovir 產生二種(含)藥物以上之抗藥性。(104/12/1)","level":0},{"text":"5.前述以口服抗病毒藥物治療之給付療程依 HBeAg(+)或 HBeAg(-)而定：HBeAg(+)病患治療至 e 抗原轉陰並再給付最多12個月；HBeAg(-)病患治療至少二年，治療期間需檢驗血清 HBV DNA ，並於檢驗血清 HBV DNA 連續三次，每次間隔6個月，均檢驗不出HBV DNA 時停藥，每次療程至多給付36個月。再次復發時得再接受治療，不限治療次數。(106/4/1)","level":0},{"text":"6.醫事服務機構及醫師資格：(109/7/1、111/9/1)","level":0},{"text":"(1)醫院：","level":1},{"text":"Ⅰ.有消化系內科或消化系兒科專科醫師之醫院。","level":3},{"text":"Ⅱ.醫師資格為前開醫院之消化系內科專科醫師、消化系兒科專科醫師、血液病專科醫師、腫瘤內科專科醫師、癌症相關科醫師、符合器官移植手術資格及風濕免疫科專科醫師之專任或兼任專科醫師。(111/9/1)","level":3},{"text":"Ⅲ.前開非消化系專科醫師，需先照會消化系專科醫師，惟愛滋病毒感染患者併有B 型或 C 肝炎感染者，得由其照護之感染症內科專科醫師開立處方。","level":3},{"text":"(2)基層院所：","level":1},{"text":"Ⅰ.須具有消化系內科或消化系兒科專任專科醫師之基層院所。","level":3},{"text":"Ⅱ.肝炎治療醫療資源不足地區及山地離島地區，具有消化系內科或消化系兒科兼任專科醫師之基層院所，亦得開立處方，惟離島地區(如金門縣、連江縣、澎湖縣、台東縣蘭嶼鄉、台東縣綠島鄉)內科醫師之基層院所，亦得開立處方。◎附表三十四：肝炎治療醫療資源不足地區及山地離島地區一覽表","level":3}],"limited":false,"revisions":["104/12/1","106/1/1","106/4/1","108/5/1","109/7/1","111/9/1","95/9/1","95/10/1","97/8/1","98/11/1","99/5/1","99/7/1","102/2/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":true,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-5","section":"10.7.5","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs","category":"hepatitis","title":"Daclatasvir（如 Daklinza）及 asunaprevir（如 Sunvepra） ：（刪除）","drugs":[{"generic":"Daclatasvir","zh":"","brands":["Daklinza"]},{"generic":"asunaprevir","zh":"","brands":["Sunvepra"]}],"funding":"nhi","summary":"本項已刪除。","provisions":[],"limited":false,"revisions":["106/1/24","106/5/15","107/6/1","108/1/1","108/6/1","109/1/1"],"deleted":true,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-10-7-6","section":"10.7.6","sectionConfidence":"high","group":"10.7","groupTitle":"抗病毒劑 Antiviral drugs" 手術治療者。(103/4/1)","level":3},{"text":"(3)免疫血小板缺乏性紫斑症(ITP)且於懷孕或分娩期間，或急性免疫血小板缺乏性紫斑症(ITP) 18歲以下兒童。 （107/4/1、108/6/1、111/2/1)","level":1},{"text":"(4)先天性免疫不全症之預防性使用，但需有醫學中心之診斷証明。","level":1},{"text":"(5)川崎病合乎美國疾病管制中心所訂之診斷標準","level":1},{"text":"Ⅰ.限由區域醫院(含)以上教學醫院實施或具有小兒心臟醫師證書之小兒科醫師，並有小兒心臟超音波儀器之醫院實施。(108/10/1)","level":3},{"text":"Ⅱ.需填寫「全民健康保險使用 Intravenous Immune Globulin (IVIG) 治療川崎病」申請表(詳附表六)併當月份醫療費用申報。","level":3},{"text":"(6)因感染誘發過度免疫機轉反應，而致維生重要器官衰竭，有危及生命之慮者，限由區域醫院（含）以上有加護病房乙等級以上之教學醫院實施。 （93/2/1）","level":1},{"text":"(7)腸病毒感染嚴重患者，且符合衛生福利部疾病管制署修訂之「腸病毒感染嚴重患者靜脈注射免疫球蛋白之適應症」 。(97/5/9、102/7/23、105/8/1)","level":1},{"text":"(8)急性發炎性去髓鞘多發性神經根病變（Guillain Barré 症候群） ：(107/12/1、","level":1},{"text":"Ⅰ.不得與血漿置換術併用。","level":3},{"text":"Ⅱ.使用於未滿18歲的病人i.限無法自行走路的病童，自行走路指不需要他人扶助可以走路，前述只適用於發病前會自行走路的孩童，經小兒神經專科醫師或神經科醫師確定診斷。ii.限由區域醫院（含）以上教學醫院實施。劑量為每公斤體重2公克，分成2天或5天給予。","level":3},{"text":"Ⅲ.使用於18歲以上病人(111/2/1)","level":3},{"text":"i. 限發病兩週內有嚴重病況（呼吸衰竭或瀕臨呼吸衰竭）病人使用。ii. 限經神經科醫師確定診斷，限由區域醫院（含）以上教學醫院實施。劑量為每公斤體重2公克，分成5天給予。","level":2},{"text":"(9)慢性脫髓鞘多發性神經炎（Chronic inflammatory demyelinatingpolyneuropathy, CIDP）：(108/2/1、108/10/1、109/4/1、110/3/1、","level":1},{"text":"Ⅰ.限用於依歐洲神經醫學會聯合會 (European Federation of NeurologicalSocieties; EFNS)之診斷標準確診為慢性脫髓鞘多發性神經炎之2歲以上病患，且對於類固醇治療無效或無法耐受類固醇，臨床上仍產生急性惡化時使用。","level":3},{"text":"Ⅱ.前述類固醇治療無效定義，係指使用口服每日每公斤體重1mg 或每日60mgprednisolone 兩個月仍未有INCAT (Inflammatory Neuropathy Cause andTreatment) Disability scale 1分(含)以上之進步。","level":3},{"text":"Ⅲ.限由區域醫院(含)以上教學醫院神經科專科醫師診斷及使用。","level":3},{"text":"Ⅳ.需經事前審查核准後使用，每次申請半年兩個療程，每年最多四個療程，需檢附病歷資料及治療前後的 INCAT評估結果。","level":3},{"text":"Ⅴ.每月最大劑量每公斤體重2公克。","level":3},{"text":"Ⅵ.如在開始兩個療程後無 INCAT 1分(含)以上之進步，則不再給予高單位免疫球蛋白。","level":3},{"text":"Ⅶ.經高單位免疫球蛋白治療滿1年未復發者(INCAT 分數進步1分或1分以上者)，應停止治療；若停止治療後惡化(adjusted INCAT disability score change≧1)的患者，可重新申請使用。","level":3},{"text":"Ⅷ. 2歲以上至未滿18歲兒童限使用 GAMUNEX-C 及 Kiovig。(110/12/1、111/3/1、","level":3},{"text":"(10)後天性免疫球蛋白低下症(Secondary Immunodeficiency,SID)的維持性治療使用：(113/11/1)","level":1},{"text":"Ⅰ.限用於接受骨髓或幹細胞移植病人在合併後天性免疫球蛋白低下症(SID)的維持性治療使用，預防感染或降低感染的發生率，且血清 IgG 濃度＜4 g/L，及過去6個月曾發生2次(含)以上嚴重感染。","level":3},{"text":"Ⅱ.療程為每4週注射1次，每次劑量為每公斤體重0.2公克。","level":3},{"text":"Ⅲ.經事前審查核准後使用，每次申請以3個月為限(限使用3個療程)，並需檢附免疫球蛋白(IgG 濃度)檢查報告。","level":3},{"text":"Ⅳ.繼續使用者，需每3個月評估一次血清 IgG 濃度(於最後1次注射 IVIg 的4週後或下次注射前檢測)，符合血清IgG 濃度＜5g/L，且過去3個月曾發生嚴重感染，方可提出申請續用。若續用時血清 IgG 濃度＜5g/L 則每次劑量為每公斤體重","level":3},{"text":"0.2-0.4公克。","level":0},{"text":"Ⅴ.上揭為預防感染或降低感染發生率，限使用於正在接受壓抑 B 細胞之積極治療方案病人，每個方案以9個月為上限。","level":3},{"text":"(11)多灶性運動神經病變(Multifocal motor neuropathy, MMN)(限使用 Privigen、Privigen TW Solution for Intravenous Infusion、KIOVIG、GAMUNEX-C)(114/7/1)","level":1},{"text":"Ⅰ.限用於多灶性運動神經病且符合下列條件之病人：i.漸進性不對稱的局部肢體無力，至少影響到兩條運動神經支配區域，且缺乏明顯的感覺異常。ⅱ.影響區域其肌腱反射低下或喪失。ⅲ.影響之運動神經具備等於或超過50%傳導障礙(≥ 50% conduction block)。iv.排除上運動神經元徵象(upper motor neuron sign)及侵犯腦神經/延髓症狀(cranial nerves and bulbar involvement)。v.ONLS (Overall Neuropathy Limitations Scale)≥ 2分。","level":3},{"text":"Ⅱ.限由區域醫院(含)以上教學醫院神經科專科醫師診斷及使用。","level":3},{"text":"Ⅲ.需經事前審查核准後使用，每次申請半年2個療程，每年最多4個療程。","level":3},{"text":"Ⅳ.每療程最大劑量每公斤體重2公克。","level":3},{"text":"Ⅴ.需檢附病歷資料、治療前後的神經傳導及 ONLS 量表評估結果。","level":3},{"text":"Ⅵ.如在開始2個療程後無 ONLS 1分(含)以上之進步，則不再給予高單位免疫球蛋白治療。繼續使用者，需每半年評估一次，若 ONLS 量表改善或穩定無惡化者，得繼續使用下半年兩個療程。","level":3},{"text":"Ⅶ.經免疫球蛋白治療滿1年而未復發(ONLS 進步1分(含)以上)者，應停止治療；若停止治療後惡化(ONLS 增加≥ 1分)的患者，可重新申請使用。","level":3},{"text":"2. 皮下注射劑： （108/2/1）原發性免疫不全症之預防性使用，需有醫學中心之診斷證明。註：川崎病診斷標準：","level":0},{"text":"1.發燒五天或五天以上且合併下列五項臨床症狀中至少四項。","level":0},{"text":"(1)兩眼眼球結膜充血。","level":1},{"text":"(2)嘴唇及口腔的變化：嘴唇紅、乾裂或草莓舌或咽喉泛紅。","level":1},{"text":"(3)肢端病變：手（足）水腫或指（趾）尖脫皮。","level":1},{"text":"(4)多形性皮疹。","level":1},{"text":"(5)頸部淋巴腺腫。","level":1},{"text":"2.排除其他可能引起類似臨床疾病。","level":0},{"text":"3.或只符合三項臨床症狀，但心臟超音波檢查已發現有冠狀動脈病變。","level":0}],"limited":false,"revisions":["111/2/1","113/11/1","114/10/1","110/12/1","111/3/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":true,"infectionScreening":false},"tags":[],"sourceConf n-4抗體陽性iii.腦部磁振造影不符合多發性硬化症診斷標準。","level":3},{"text":"2.須經事前審查核准後使用，治療第三年後如需再接受治療者，每次追加療程都須重新申請經事前審查核准後使用，併應提出整個用藥期間的復發情形。需再接受治療者應符合以下其中任一條件:","level":0},{"text":"(1)前一年有一次以上復發","level":1},{"text":"(2)腦部核磁共振影像上有>=2個以上gadolinium-enhanced lesion 或 T2WI 病灶數量明顯增加","level":1},{"text":"(3)脊椎核磁共振影像上有新的 gadolinium-enhanced lesion 或新的 T2WI 病灶","level":1},{"text":"3.第一次療程以申請第一年五支，第二年三支為限，治療第三年後如需再接受治療者，每年每次追加療程以三支為限。","level":0},{"text":"4.使用兩年後，年度復發率(average annual relapse)無法減少時應停止本藥品之治療。※年度復發率無法減少之定義：採計使用Alemtuzumab 藥物後兩年內復發次數之數據(以最近兩年之復發次數除以2來計算)，較諸更先前一年或兩年之年復發率皆無再減少時。","level":0}],"limited":false,"revisions":["108/7/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-3-7","section":"8.2.3.7","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Siponimod（如 Mayzent）","drugs":[{"generic":"Siponimod","zh":"","brands":["Mayzent"]}],"funding":"nhi","summary":"限用於曾被診斷為復發緩解型多發性硬化症之病人。","provisions":[{"text":"1. 限用於曾被診斷為復發緩解型多發性硬化症之病人。","level":0},{"text":"2. 須符合次發進展型多發性硬化症之診斷，即過去在沒有復發或與復發無關的情況下，出現失能惡化持續至少6個月以上。","level":0},{"text":"3. 初次接受siponimod 時，EDSS 應小於或等於6.5分，且 EDSS 大於等於3分。","level":0},{"text":"4. 初次接受siponimod 之前2年內，需有明顯 EDSS 進展性惡化之證據，亦即符合以下二者其中之一：","level":0},{"text":"(1)申請時 EDSS 未滿6分者，過去2年內 EDSS 惡化1分以上。","level":1},{"text":"(2)申請時 EDSS 大於等於6分者，過去2年內 EDSS 惡化0.5分以上。","level":1},{"text":"5. 須經事前審查核准後使用，每年需重新申請，併應提出整個用藥期間之 EDSS 分數(包括起始用藥 EDSS 分數與每年申請時 EDSS 分數)","level":0},{"text":"6. Siponimod使用2年後，EDSS 出現確認失能惡化持續6個月(6-month confirmeddisability progression)時，亦即 EDSS 未滿6分者，2年內惡化1分以上，EDSS大於等於6分者，2年內惡化0.5分以上，應停止本藥品之治療。","level":0},{"text":"7. 依治療建議劑量，從0.25mg 每天1次起始，達到2mg 每天1次之維持劑量，且不得以8粒0.25mg 取代1粒2mg。","level":0}],"limited":false,"revisions":["110/3/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infe "]},{"generic":"tocilizumab","zh":"","brands":["Actemra"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]}],"funding":"nhi","summary":"Etanercept限使用於4歲以上具有活動性多關節幼年型慢性關節炎患者。adalimumab、tocilizumab 及 tofacitinib 限使用於2歲以上具有活動性多關節幼年型慢性關節炎患者（101/12/1、102/10/1、105/10/1、108/1/1、111/2/1、113/…","provisions":[{"text":"1.Etanercept限使用於4歲以上具有活動性多關節幼年型慢性關節炎患者。adalimumab、tocilizumab 及 tofacitinib 限使用於2歲以上具有活動性多關節幼年型慢性關節炎患者（101/12/1、102/10/1、105/10/1、108/1/1、111/2/1、113/10/1）。secukinumab 限使用6歲以上具有接骨點發炎相關型關節炎患者（114/7/1）。","level":0},{"text":"2.限具有風濕病專科醫師證書之內科專科醫師或具有小兒過敏免疫專科醫師證書之小兒科專科醫師處方。 （114/10/1）","level":0},{"text":"3.年齡大於18歲的病患應由具有風濕病專科醫師證書之內科專科醫師或具有小兒過敏免疫專科醫師證書之小兒科專科醫師重新評估病情，改依成人治療（8.2.4.2）規定申請。 （108/1/1）","level":0},{"text":"4.需事前審查核准後使用。","level":0},{"text":"(1)申報時需檢附 methrotexate或 corticosteroids 或 sulfasalazine（限接骨點發炎相關型關節炎患者，以下簡稱 ERA）藥物使用的劑量、治療時間、副作用、及關節腫脹治療前後的相關照片或關節 X 光檢查報告等資料。","level":1},{"text":"(2)使用 etanercept、adalimumab或 tocilizumab 或 secukinumab（限 ERA）之後，每六個月需再申請一次；需描述使用藥物後的療效、副作用或併發症。","level":1},{"text":"5.病患需符合（1）且（2），（3）或（4）共符合三項條件者方可使用","level":0},{"text":"(1)病人的關節炎必須符合下列任何一種亞型的病變：Ⅰ全身性 ( systemic)Ⅱ多發性關節炎 (polyarticular)(類風濕性因子陽性或陰性者皆可)Ⅲ擴散型嚴重少數關節炎 (extended oligoarticular)Ⅳ接骨點發炎相關型關節炎（enthesitis-related arthritis, ERA）（114/7/1）","level":1},{"text":"(2)標準療法失敗者 (符合下列任一項)Ⅰ病患必須曾經接受 methotrexate 的充分治療。充分治療的定義：10毫克/身體表面積平方米/週的口服或注射 methotrexate 治療，藥物治療時間必須達3個月以上。(若因藥物毒性無法忍受，以致於無法達到上項要求時，劑量可以酌情降低。)Ⅱ若單獨使用類固醇來治療全身性類風濕性關節炎症狀，prednisolone 的劑量必須高於每天每公斤0.25毫克以上並且發生無法接受的副作用。Ⅲ必須曾經接受 sulfasalazine 的充分治療。 （114/7/1）充分治療定義：sulfasalazine 需以 30 毫克/公斤/天之標準治療 3個月或以上。 （ERA 若因藥物毒性無法忍受，以致於無法達到上項要求時，劑量可以酌情降低。）","level":1},{"text":"(3)最近3個月關節炎的活動性必須符合活動性多關節炎標準者。活動性多關節炎標準定義:關節病情必須同時符合下列兩個要項：Ⅰ腫脹的關節總數大於等於5個。Ⅱ關節活動受到限制而且具有疼痛或壓痛的關節總數≧3個。(必須附上關節腫脹之相關照片或關節 X 光檢查報告作為輔証)。","level":1},{"text":"(4)最近3個月關節炎的活動性必須符合接骨點發炎相關型關節炎標準者。接骨點發炎相關型關節炎標準定義關節病情必須符合：具活動性關節炎≥3個（疼痛且關節活動受到限制，或腫脹） ，且≥1個接骨點炎或中軸症狀。 （114/7/1）","level":1},{"text":"6.需排除使用的情形(102/10/1、113/10/1)應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性的感染症的病患。","level":1},{"text":"(3)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)","level":1},{"text":"(4)身上帶有人工關節者，罹患或先前曾罹患過嚴重的敗血症(sepsis)者。","level":1},{"text":"(5)惡性腫瘤或具有癌症前兆 (pre-malignancy) 的病患。","level":1},{"text":"(6)免疫功能不全者 (Immunodeficiency)。","level":1},{"text":"7.需停止治療的情形(102/10/1、113/10/1)如果發生下列現象應停止治療：","level":0},{"text":"(1)不良事件，包括：Ⅰ惡性腫瘤。Ⅱ該藥物引起的嚴重毒性。Ⅲ懷孕 (暫時停藥即可)。Ⅳ嚴重的間發性感染症 (intercurrent infection)(暫時停藥即可)。療效不彰：患者的 core set data 經過6個月治療後未達療效者。療效定義：Ⅰ紅血球沉降速率 (ESR) 或 CRP 及下列三項中至少有二項達到較基礎值改善30%以上效果者。i.活動性關節炎的總數ii.關節活動範圍受到限制的關節總數iii.醫師的整體評估Ⅱ上述各種指標惡化程度達30%以上者不得超過一項◎附表十六：全民健康保險活動性多關節幼年型慢性關節炎使用藥品申請表◎附表十六之二： （刪除）","level":1}],"limited":false,"revisions":["94/3/1","101/12/1","102/1/1","102/10/1","105/10/1","108/1/1","111/2/1","113/10/1","114/7/1","114/10/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-2","section":"8.2.4.2","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Etanercept（如 Enbrel）； adalimumab（如 Humira）；golimumab（如 Simponi）； abatacept（如 Orencia）；tocilizumab（如 Actemra）；tofacitinib（如 Xeljanz）；certolizumab (Cimzia） ；baricitinib（如 Olumiant）； opinercept（如 Tunex）； infliximab（如 Remicade）；peficitinib（如 Smyraf）； upadacitinib（如 Rinvoq）；filgotinib（如 Jyseleca）","drugs":[{"generic":"Etanercept","zh":"","brands":["Enbrel"]},{"generic":"adalimumab","zh":"","brands":["Humira"]},{"generic":"golimumab","zh":"","brands":["Simponi"]},{"generic":"abatacept","zh":"","brands":["Orencia"]},{"generic":"tocilizumab","zh":"","brands":["Actemra"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"certolizumab","zh":"","brands":["Olumiant"]},{"generic":"Cimzia","zh":"","brands":["Tunex"]},{"generic":"baricitinib","zh":"","brands":["Remicade"]},{"generic":"opinercept","zh":"","brands":["Smyraf"]},{"generic":"infliximab","zh":"","brands":["Rinvoq"]},{"generic":"peficitinib","zh":"","brands":["Jyseleca"]},{"generic":"upadacitinib","zh":"","brands":[]},{"generic":"filgotinib","zh":"","brands":[]}],"funding":"nhi","summary":"109/12/1、110/3/1、110/5/1、110/6/1、112/5/1、114/9/1)：成人治療部分","provisions":[{"text":"109/12/1、110/3/1、110/5/1、110/6/1、112/5/1、114/9/1)：成人治療部分","level":0},{"text":"1.限內科專科醫師且具有風濕病專科醫師證書者使用於類風濕關節炎病患。","level":0},{"text":"2.經事前審查核准後使用。","level":0},{"text":"3.申報時須檢附使用 DMARD 藥物六個月以上後之 DAS28積分，各種 DMARD 藥物使用之種類、劑量、治療時間、副作用、關節腫脹之相關照片(須註明日期)及關節 X 光檢查報告等資料。 （99/2/1、108/5/1）","level":0},{"text":"4.使用劑量：","level":0},{"text":"(1)初次使用 tocilizumab 時：I.靜脈注射劑：劑量應從4mg/kg 開始，治療第12週，評估 DAS28積分，未達療效者(療效之定義：DAS28總積分下降程度≧ 1.2，或 DAS28總積分＜ 3.2者)，得調高劑量至8mg/kg，繼續治療12週後，再評估 DAS28總積分，必須下降程度≧","level":1},{"text":"1.2，或 DAS28總積分＜ 3.2，方可續用。(102/10/1、106/4/1)","level":0},{"text":"Ⅱ.皮下注射劑：體重小於100公斤者，劑量應從162mg 每兩週一次開始，治療第12週，評估 DAS28積分，未達療效者，得調高劑量至162mg 每週一次，繼續治療12週後，再評估 DAS28積分，達療效者方可續用。體重大於100公斤者，劑量162mg 每週一次，治療第24週，評估 DAS28積分，達療效者方可續用。","level":3},{"text":"(2) baricitinib、upadacitinib 或 filgotinib 時，劑量用法之調整應參照藥物仿單，且每日限用1錠。使用 peficitinib 時，劑量用法之調整應參照藥物仿單，每日100mg~150mg (且限每日最大劑量150mg)。(107/9/1、110/3/1、110/5/1、","level":1},{"text":"(3)使用 infliximab 時：I.靜脈注射：應參照藥物仿單之用法，與 methotrexate 併用，infliximab 在第","level":1},{"text":"0、2及6週時投予靜脈注射3mg/kg，之後每8週給藥1次。(109/9/1、","level":0},{"text":"Ⅱ.靜脈注射搭配皮下注射：0、2週時投予靜脈注射3mg/kg；之後每隔2週給予皮下注射120 mg。(114/9/1)","level":3},{"text":"5.使用半年後，每三個月需再申報一次；內含 DAS28積分，使用藥物後之療效、副作用或併發症。惟infliximab 初次申請時核予22週用量，續用時，每16週需再申請續用。(93/8/1、93/9/1、110/6/1)","level":0},{"text":"6.病患需同時符合下述(1)(2)(3)項條件，方可使用；若有第(4)項情形，不得使用；若有第(5)項情形，需停止使用。","level":0},{"text":"(1)符合美國風濕病學院(American College of Rheumatology)類風濕關節炎分類標準的診斷條件。(102/10/1)","level":1},{"text":"(2)連續活動性的類風濕關節炎","level":1},{"text":"Ⅰ.28處關節疾病活動度積分 (Disease Activity Score, DAS 28) 必須大於","level":3},{"text":"5.1。","level":0},{"text":"Ⅱ.此項評分需連續二次，其時間相隔至少4週(含)以上，並附當時關節腫脹之相關照片(須註明日期)及關節 X 光檢查報告為輔証。(108/5/1、109/8/1)註1：28處關節部位記分如 (附表十三) 所示，其疾病活動度積分計算方式如下:DAS28 = 0.56 ×√TJC + 0.28 ×√SJC + 0.7 × lnESR+0.014 × GH註2：TJC: 觸痛關節數，SJC: 腫脹關節數，ESR: 紅血球沉降速率 (單位為mm/h)，GH: 在100 mm 圖像模擬量表中所呈現的整體健康狀態 (generalhealth status)","level":3},{"text":"(3)標準疾病修飾抗風濕病藥物 (Disease-Modifying Anti-Rheumatic Drugs,DMARD) 療法失敗：病患曾經接受至少兩種 DMARDs (methotrexate 為基本藥物，另一藥物必須包括肌肉注射之金劑、hydroxychloroquine、sulfasalazine、d-penicillamine、azathioprine、leflunomide、cyclosporine 中之任何一種) 之充分治療，而仍無明顯療效。(93/8/1)","level":1},{"text":"Ⅰ.充分治療的定義：(100/12/1)i.DMARDs 藥物治療時間須符合下列條件之一：(i)必須至少6個月以上，而其中至少2個月必須達到 (附表十四) 所示標準目標劑量 (standard target dose)。(ii)DMARDs 藥物合併使用 prednisolone 15 mg/day 治療，須至少3個月以上，而其中至少2個月 DMARDs 藥物必須達到 (附表十四) 所示標準目標劑量(standard target dose)。(100/12/1)ii.若病患因 DMARDs 藥物毒性無法忍受，以致無法達到上項要求時，DMARDs 劑量仍需達 (附表十四) 所示治療劑量 (therapeutic doses) 連續2個月以上。","level":3},{"text":"Ⅱ.療效的定義：(93/8/1、98/3/1)DAS28總積分下降程度大於等於(≧)1.2，或 DAS28總積分小於3.2者。","level":3},{"text":"(4)需排除使用的情形 (93/9/1、106/11/1)應參照藥物仿單，重要之排除使用狀況包括 (以下未列者參照仿單所載)：","level":1},{"text":"Ⅰ.懷孕或正在授乳的婦女 (certolizumab 除外) (106/11/1)","level":3},{"text":"Ⅱ.活動性感染症之病患","level":3},{"text":"Ⅲ.具高度感染機會的病患，包括：i.慢性腿部潰瘍之病患ii.未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)iii.過去12個月內曾有感染性關節炎者iv.有人工關節感染，若該人工關節未除去前，不可使用v.頑固性或復發性的胸腔感染症vi.具有留置導尿管者","level":3},{"text":"Ⅳ.惡性腫瘤或癌前狀態之病患 （但不包括已經接受過充分治療達10年以上的惡性腫瘤）","level":3},{"text":"Ⅴ.多發性硬化症 (multiple sclerosis)","level":3},{"text":"(5)需停止治療的情形 (93/8/1、93/9/1)如果發生下列現象應停止治療：Ⅰ療效不彰Ⅱ不良事件，包括：i.惡性腫瘤ii.該藥物引起的嚴重毒性iii.懷孕 (暫時停藥即可)iv.嚴重的間發性感染症 (暫時停藥即可)","level":1},{"text":"7.轉用其他成分生物製劑之條件：","level":0},{"text":"(1)使用生物製劑治療後有療效，但因方便性欲改用給藥頻率較少者或無法忍受副作用者，可轉用相同藥理機轉之生物製劑。","level":1},{"text":"(2)使用生物製劑治療後療效不彰，不可轉用相同藥理機轉之其他成分生物製劑。","level":1},{"text":"8.減量及暫緩續用之相關規定：(102/4/1)","level":0},{"text":"(1)減量時機：使用2年且已達疾病緩解(DAS28＜ 2.6)超過6個月。(108/5/1)","level":1},{"text":"(2)減量方式：病患使用生物製劑2年後，申請續用之事前審查時，應依據患者個別狀況提出符合醫理之治療計畫，並敘明開始減量至1年後暫緩續用之減量方式。減量方式可為減少每次使用劑量或延長給藥間隔。","level":1},{"text":"(3)減量期間若符合以下所有條件，得申請回復減量前之使用量，下次再評估減量之時機為1年後：","level":1},{"text":"Ⅰ.與減量前比較，DAS28總積分上升程度＞ 1.2。","level":3},{"text":"Ⅱ.ESR＞ 25mm/h。","level":3},{"text":"Ⅲ.與減量前比較，ESR 上升程度＞ 25%。","level":3},{"text":"(4)因使用一種生物製劑治療後療效不彰，而轉用另一種不同藥理機轉之生物製劑，以轉用後者之起始日重新計算2年後開始減量之時機。但因方便性考量或無法忍受副作用而轉用相同藥理機轉之生物製劑，轉用前後所使用生物製劑之期間均應計入。","level":1},{"text":"(5)暫緩續用時機：開始減量1年後暫緩續用。","level":1},{"text":"(6)至101年12月31日止，已申請使用逾2年者，於下次申報時即須依規定評估是否需減量。","level":1},{"text":"9.暫緩續用後若疾病再復發，重新申請使用必須符合以下條件：(102/1/1)","level":0},{"text":"(1)生物製劑暫緩續用後，必須持續接受至少2種 DMARDs 藥物之治療（methotrexate為基本藥物，另一藥物必須包括肌肉注射之金劑、hydroxychloroquine、sulfasalazine、d-penicillamine、azathioprine、leflunomide、cyclosporine中之任何一種） ，其中methotrexate 至少2個月以上必須達到當初申請生物製劑時所使用之劑量。","level":1},{"text":"(2)DAS28總積分上升程度＞ 1.2。(102/4/1)◎附表十三：全民健康保險類風濕關節炎病患28處關節疾病活動度(DiseaseActivity Score, DAS 28)評估表◎附表十四：全民健康保險疾病修飾抗風濕病藥物(DMARDs)之標準目標劑量暨治療劑量表◎附表十五：全民健康保險類風濕關節炎使用生物製劑申請表(106/11/1)","level":1}],"limited":false,"revisions":["103/12/1","106/4/1","106/11/1","107/9/1","108/3/1","108/5/1","109/8/1","109/9/1","112/5/1","109/12/1","114/9/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-3","section":"8.2.4.3","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）; etanercept（如 Enbrel） ；golimumab（如 Simponi）；secukinumab（如 Cosentyx）；infliximab（如 Remicade 靜脈注射）； certolizumab（如 Cimzia）；ixekizumab（如 Taltz） ；upadacitinib（如 Rinvoq）； tofacitinib（如 Xeljanz）；brodalumab（如 Lumicef）；bimekizumab（如 Bimzelx）","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"etanercept","zh":"","brands":["Enbrel"]},{"generic":"golimumab","zh":"","brands":["Simponi"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]},{"generic":"infliximab","zh":"","brands":["Remicade 靜脈注射"]},{"generic":"certolizumab","zh":"","brands":["Cimzia"]},{"generic":"ixekizumab","zh":"","brands":["Taltz"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"brodalumab","zh":"","brands":["Lumicef"]},{"generic":"bimekizumab","zh":"","brands":["Bimzelx"]}],"funding":"nhi","summary":"115/5/1)：用於僵直性脊椎炎治療部分","provisions":[{"text":"115/5/1)：用於僵直性脊椎炎治療部分","level":0},{"text":"1.限內科專科醫師且具有風濕或免疫專科醫師證書者處方。","level":0},{"text":"2.需經事前審查核准後使用。","level":0},{"text":"3.需符合下列所有條件：","level":0},{"text":"(1)年齡18歲以上","level":1},{"text":"(2)HLA B27陽性","level":1},{"text":"(3)X光(plain X Ray)檢查需有薦腸關節炎：雙側性二級以上，或單側性三級以上、附有報告影印或 X 光影像光碟。","level":1},{"text":"(4)臨床症狀及身體檢查，下列三條件至少需符合二項i.下背痛及晨間僵硬的症狀持續3個月以上，這些症狀無法因休息而緩解，但會隨運動改善。ii.腰椎活動受到限制，有確切體檢發現者。iii.胸部擴展受到限制，有確切體檢發現者。","level":1},{"text":"(5)所有的病患都必須曾經使用過至少2種 (NSAIDs)進行充分的治療，但療效不彰。充分治療的定義為：使用最高建議劑量或最高耐受劑量的 NSAID 抗發炎藥物，在同一家醫院連續治療三個月以上，且每種 NSAID 至少使用四週以上，除非出現毒性而停藥，需以附表二十一之二為根據記錄 NSAID 之毒性送審。","level":1},{"text":"(6)周邊關節炎患者必須曾經同時使用 NSAIDs 和 sulfasalazine 進行充分的治療，sulfasalazine 需以2 g/day 之標準治療4個月或以上，除非有相關毒性發生而停藥，並有適當病歷記載者。","level":1},{"text":"(7) 必須附有(1) 風濕或免疫專科且具有保險人核定復健處方權之醫師所開立之運動衛教證明書和(2)病患自身在家運動狀况聲明書。","level":1},{"text":"(8)活動性疾病持續四週以上。 （需連續二次檢查BASDAI≧6、ESR > 28 mm/1 hr 暨CRP > 1 mg/dL，且二次檢查之間隔需經過至少4週以上之充分治療）","level":1},{"text":"(9)病患需填具藥物使用同意書以示瞭解本藥物之適應症、禁忌及副作用。","level":1},{"text":"4.使用劑量：","level":0},{"text":"(1)Secukinumab 每次使用劑量為150mg，起始於第0，1，2，3和4週，之後每4週給予維持劑量150mg。治療12週後，未達療效(參考底下第5點療效定義)，劑量可增加為300mg。(107/1/1、112/3/1)","level":1},{"text":"(2)infliximab 起始於第0，2和6週時投予5mg/kg，之後每6週給藥。(109/9/1、","level":1},{"text":"(3)Ixekizumab 每4週給予80 mg (111/5/1)","level":1},{"text":"(4)Certolizumab 起始於第0週、第2週與第4週時投予各400mg，之後維持劑量為每2週200 mg或每4週 400mg。於懷孕哺乳期間若已接受其他生物製劑治療者，得改申請certolizumab。若症狀嚴重程度已符合生物製劑申請條件但尚未接受生物製劑治療者，不須受傳統治療無效才得申請之限制，得於懷孕哺乳期申請certolizumab。(110/7/1)","level":1},{"text":"(5) Tofacitinib 口服使用5mg 每日2次或11mg 每日1次。(使用前應排除有血栓風險之病患，不建議與 azathioprine 或與 cyclosporine 合併使用。(112/4/1)","level":1},{"text":"(6) Brodalumab 起始於第0週投予 210 mg，接著於第1週及第2週投予210mg，之後每2週投予210mg。(112/12/1)","level":1},{"text":"(7) Bimekizumab 每次使用劑量為160mg，每4週投予160mg 劑量。(115/5/1)","level":1},{"text":"5.療效評估與繼續使用：","level":0},{"text":"(1)治療12週後評估 BASDAI：與使用前比較,出現50%以上的進步或減少2 分以上，方得繼續使用。","level":1},{"text":"(2)繼續使用者，需每12週評估一次。","level":1},{"text":"6.需排除使用的情形應參照藥物仿單，重要之排除使用狀況包括(以下未列者參照仿單所載)：","level":0},{"text":"(1)懷孕或正在授乳的婦女(certolizumab 除外) (110/7/1)","level":1},{"text":"(2)活動性感染症之病患","level":1},{"text":"(3)具高度感染機會的病患，包括：i.慢性腿部潰瘍之病患ii.未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)iii.過去12個月內曾有感染性關節炎者iv.曾有人工關節感染，若該人工關節未去除前，不可使用v.頑固性或復發性的胸腔感染症vi.具有留置導尿管者","level":1},{"text":"(4)惡性腫瘤或癌前狀態之病患（但不包括已經接受過充分治療達10年以上的惡性腫瘤）","level":1},{"text":"(5)多發性硬化症(multiple sclerosis)","level":1},{"text":"7.需停止治療的情形如果發生下列現象應停止治療：","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者","level":1},{"text":"(2)不良事件，與藥物之使用有關或無關的事件，包括：i.惡性腫瘤ii.該藥物引起的嚴重毒性iii.懷孕(certolizumab 除外，其他暫時停藥即可) (110/7/1)iv.嚴重的間發性感染症(依嚴重性判斷可選擇暫時停藥即可)◎附表二十一之一：全民健康保險僵直性脊椎炎使用生物製劑申請表(107/1/1)◎附表二十一之二：NSAID 藥物副作用","level":1}],"limited":false,"revisions":["109/12/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-4","section":"8.2.4.4","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）； etanercept（如 Enbrel）；golimumab（如 Simponi）；ustekinumab（如 Stelara）；secukinumab（如 Cosentyx）；ixekizumab（如 Taltz）；tofacitinib（如 Xeljanz）；certolizumab（如 Cimzia）； brodalumab（如 Lumicef）；guselkumab（如 Tremfya）；upadacitinib（如 Rinvoq） ； risankizumab（如 Skyrizi）；bimekizumab（如 Bimzelx）","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"etanercept","zh":"","brands":["Enbrel"]},{"generic":"golimumab","zh":"","brands":["Simponi"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]},{"generic":"ixekizumab","zh":"","brands":["Taltz"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"certolizumab","zh":"","brands":["Cimzia"]},{"generic":"brodalumab","zh":"","brands":["Lumicef"]},{"generic":"guselkumab","zh":"","brands":["Tremfya"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"bimekizumab","zh":"","brands":["Bimzelx"]}],"funding":"nhi","summary":"114/2/1、115/5/1、115/8/1)：用於活動性乾癬性關節炎－乾癬性周邊關節炎治療部分","provisions":[{"text":"114/2/1、115/5/1、115/8/1)：用於活動性乾癬性關節炎－乾癬性周邊關節炎治療部分","level":0},{"text":"1.限內科專科醫師且具有風濕或免疫專科醫師證書者，或皮膚科專科醫師處方。（99/1/ 1）","level":0},{"text":"2.需經事前審查核准後使用。","level":0},{"text":"3.需符合下列所有條件：","level":0},{"text":"(1)經內科專科醫師且具有風濕或免疫專科醫師證書者診斷為乾癬性關節炎之患者。","level":1},{"text":"(2)曾經皮膚科醫師診斷為乾癬患者，或經皮膚切片診斷為乾癬患者。","level":1},{"text":"(3)三個或是三個以上的疼痛關節及三個或三個以上的腫脹關節，且至少間隔4週(含) 以上之連續兩次評估均符合上述條件。(需附關節腫脹相關 X-光片或照片輔証)。(109/8/1)","level":1},{"text":"(4)應先使用非類固醇類消炎止痛劑(NSAID)及疾病修飾治療藥物(DMARDs)，且必須曾使用過至少2種疾病修飾治療藥物(DMARDs)進行充分的治療，但療效不彰。(附表二十二之二)i.疾病修飾治療藥物〔DMARDs 包括下列四種: sulfasalazine、methotrexate(MTX)、cyclosporine、leflunomide〕 ，治療至少六個月，且至少有兩個月都達標準目標劑量(除非有明顯副作用或毒性反應)，仍然未達療效者。ii.疾病修飾治療藥物中 sulfasalazine、methotrexate (MTX)、cyclosporine 為第一線藥物，leflunomide 為第二線藥物，第一線疾病修飾類藥物治療無效，應先經leflunomide 治療3個月無效後，方可使用腫瘤壞死因子抑制劑或secukinumab 150mg、ixekizumab 或 tofacitinib 或 upadacitinib 或brodalumab 或 bimekizumab 作為第三線治療。原經事前審查符合 apremilast藥品給付規定且已接受治療者，apremilast 可視同為 DMARDs 第一線藥物。iii.標準治療失敗之定義：經過充分使用以上藥物治療又給予規定劑量，且至少先後使用或併用兩種疾病修飾類藥物(DMARDs)仍無法使病情緩解，即符合下列情況之一：- 治療療程至少有六個月，且至少有兩個月都達標準目標劑量(除非有明顯副作用或毒性反應)仍然未達療效者。- 治療不到六個月，但是病患無法忍受藥物副作用或是藥物毒性而停藥者，但需說明藥物之何種毒性或副作用。- 治療大於兩個月，且因無法忍受藥物副作用或是藥物毒性而停止療程，其中至少有兩個月需達有效治療劑量，且需說明藥物之何種毒性或副作用。","level":1},{"text":"(5)Ustekinumab、guselkumab 及 risankizumab 限用於曾經接受抗腫瘤壞死因子(如etanercept、adalimumab 或 certolizumab 等)、secukinumab、ixekizumab、tofacitinib、upadacitinib 或 brodalumab 或 bimekizumab 治療，但未達療效，或無法耐受的活動性乾癬性關節炎。申請初次治療者，應檢附曾經使用抗腫瘤壞死因子、secukinumab、tofacitinib、ixekizumab、upadacitinib 或brodalumab 或 bimekizumab 之用藥結果，包括種類、劑量、治療前後 PsARC 評估及副作用報告等資料，並宜記錄患者 HBsAg 及 Anti-HCV 資料(若 HBsAg 檢驗為陽性，宜加作 HBV DNA)。(105/10/1、107/1/1、109/3/1、109/6/1、111/3/1、","level":1},{"text":"4.使用劑量：","level":0},{"text":"(1)Secukinumab 每次使用劑量為150mg，起始於第0，1，2，3和4週，之後每4週給予維持劑量150mg。治療12週後，若 secukinumb 150mg 治療未達療效(參考底下第5點療效定義)的病人，劑量可增加為300mg。但對於曾以腫瘤壞死因子阻斷劑(anti-TNFα)未達療效，建議每次劑量為300mg，起始於第0，1，2，3和4週皮下注射，之後每4週給予300mg 劑量。(107/1/1、112/3/1)","level":1},{"text":"(2)Ixekizumab 之起始劑量為第0週160mg，之後每4週給予80mg。(109/3/1、","level":1},{"text":"(3)Certolizumab 起始於第0週、第2週與第4週時投予各400 mg，之後維持劑量為每2週200 mg或每4週400mg。於懷孕哺乳期間若已接受其他生物製劑治療者，得改申請certolizumab。若症狀嚴重程度已符合生物製劑申請條件但尚未接受生物製劑治療者，可不受傳統治療無效才得申請之限制，得於懷孕哺乳期申請certolizumab。(110/7/1)","level":1},{"text":"(4)Brodalumab 起始於第0週投予 210 mg，接著於第1週及第2週投予210mg，之後每2週投予210mg 。(111/3/1)","level":1},{"text":"(5)Guselkumab 之起始劑量為第0週及第4週投予100mg，之後每8週給予維持劑量100mg。(111/9/1)","level":1},{"text":"(6)Risankizumab 之起始劑量為第0週及第4週投予150mg/mL，之後每12週給予維持劑量150mg/mL。(114/2/1)","level":1},{"text":"(7)Bimekizumab 每次使用劑量為160mg，每4週投予160mg 劑量。(115/5/1)","level":1},{"text":"5.療效評估與繼續使用：(105/10/1、111/9/1、114/2/1)","level":0},{"text":"(1)療效定義：治療12週(ustekinumab、guselkumab 及 risankizumab 初次治療則為24週)後，評估乾癬關節炎反應標準(PsARC, Psoriatic Arthritis ResponseCriteria)，其標準為下列四項中至少有二項較原基礎值改善，且其中一項需為疼痛關節或腫脹關節的關節總數，且下述各種指標不得有任一項惡化，方得繼續使用。(附表二十二之三) (111/9/1、114/2/1)i.疼痛關節的關節總數：改善的定義為關節總數減少30%或以上，惡化定義為總數增加30%或以上。ii.腫脹關節的關節總數：改善的定義為關節總數減少30%或以上，惡化定義為總數增加30%或以上。iii.醫師的整體評估(0-5分)：改善定義為減少1分，惡化定義為增加1分。iv.病患的整體評估(0-5分)：改善定義為減少1分，惡化定義為增加1分。","level":1},{"text":"(2)Ustekinumab：i.初次申請以3劑(初次、4週後及16週時投予每劑45mg；體重大於100公斤病患，得初次、4週後及16週時投予每劑90mg)為限，且於24週時，需先行評估，至少有PsARC 療效方可申請續用，續用以45mg q12w(體重大於100公斤，續用以90mg q12w)為限。(105/10/1、109/9/1)ii.若使用劑量為90mg（含）以上，限使用90mg(1mL)規格量。(109/9/1)","level":1},{"text":"(3)Guselkumab：初次申請以4劑(初次、第4週、第12週及第20週時投予每劑100mg)為限，且於第24週時，需先行評估，至少有 PsARC 療效方可申請續用，續用以每隔8週給予維持劑量100mg 為限。(111/9/1)","level":1},{"text":"(4)Risankizumab：初次申請以3劑 (初次、第4週及第16週時投予每劑150mg/mL)為限，且於第24週時，需先行評估，至少有 PsARC 療效方可申請續用，續用以每隔12週給予維持劑量150mg/mL 為限。(114/2/1)","level":1},{"text":"(5)繼續使用者，需每12週評估一次，再次提出申請續用；惟 guselkumab 每16週評估一次、risankizumab 每24週評估一次，再次提出申請續用。(111/9/1、114/2/1)。","level":1},{"text":"6.需排除使用的情形：應參照藥物仿單，重要之排除使用狀況包括﹝以下未列者參照仿單所載﹞：","level":0},{"text":"(1)懷孕或正在授乳婦女(certolizumab 除外) (110/7/1)","level":1},{"text":"(2)活動性感染症之病患","level":1},{"text":"(3)具高度感染機會之病患i.慢性腿部潰瘍之病患ii.未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)iii.過去12個月內曾罹患感染性關節炎者iv.曾有人工關節感染，若該人工關節未去除前，不可使用 v.頑固性或復發性的胸腔感染疾病vi.具有留置導尿管之情形","level":1},{"text":"(4)惡性腫瘤或癌前狀態之病患﹝但不包括已經接受過充分治療達10年以上的惡性腫瘤﹞","level":1},{"text":"(5)多發性硬化症 (multiple sclerosis)","level":1},{"text":"7.需停止治療的情形如果發生下列現象應停止治療：","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者","level":1},{"text":"(2)不良事件：與藥物之使用有關或無關的事件，包括：i.惡性腫瘤ii.該藥物引起的嚴重毒性iii.懷孕(certolizumab 除外，其他暫時停藥即可)(110/7/1)iv.嚴重感染症﹝依嚴重性判斷可選擇暫時停藥﹞◎附表二十二之一：全民健康保險乾癬性周邊關節炎使用生物製劑申請表◎附表二十二之二：乾癬性周邊關節炎使用 DMARDs 標準目標劑量及有效治療劑量的定義◎附表二十二之三：乾癬性關節炎評估表◎附表二十二之六：全民健康保險乾癬性周邊關節炎使用ustekinumab/guselkumab/risankizumab 申請表(109/3/1、111/3/1、","level":1}],"limited":false,"revisions":["109/9/1","110/7/1","111/3/1","111/5/1","111/9/1","112/3/1","112/4/1","112/12/1","107/1/1","109/6/1","115/5/1","115/8/1","114/2/1","109/3/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-5","section":"8.2.4.5","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）;etanercept（如 Enbrel）；golimumab（如 Simponi）；secukinumab（如 Cosentyx）；ixekizumab（如 Taltz）；tofacitinib（如 Xeljanz）；certolizumab（如 Cimzia）；guselkumab（如 Tremfya）；upadacitinib（如 Rinvoq）；brodalumab（如 Lumicef） ；risankizumab（如 Skyrizi）；bimekizumab（如 Bimzelx）","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"etanercept","zh":"","brands":["Enbrel"]},{"generic":"golimumab","zh":"","brands":["Simponi"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]},{"generic":"ixekizumab","zh":"","brands":["Taltz"]},{"generic":"tofacitinib","zh":"","brands":["Xeljanz"]},{"generic":"certolizumab","zh":"","brands":["Cimzia"]},{"generic":"guselkumab","zh":"","brands":["Tremfya"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]},{"generic":"brodalumab","zh":"","brands":["Lumicef"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"bimekizumab","zh":"","brands":["Bimzelx"]}],"funding":"nhi","summary":"115/5/1)：用於活動性乾癬性關節炎－乾癬性脊椎病變治療部分","provisions":[{"text":"115/5/1)：用於活動性乾癬性關節炎－乾癬性脊椎病變治療部分","level":0},{"text":"1.限內科專科醫師且具有風濕或免疫專科醫師證書者，或皮膚科專科醫師處方。（99/1/ 1）","level":0},{"text":"2.需經事前審查核准後使用。","level":0},{"text":"3.需符合下列所有條件方可使用腫瘤壞死因子抑制劑或 secukinumab 150mg 或ixekizumab或 tofacitinib 或 guselkumab 或 upadacitinib 或 brodalumab 或risankizumab 或 bimekizumab 作為第二線治療：(107/1/1、109/3/1、109/6/1、","level":0},{"text":"(1)經內科專科醫師且具有風濕或免疫專科醫師證書者診斷為乾癬性關節炎之患者。","level":1},{"text":"(2)曾經皮膚科醫師診斷為乾癬患者，或經皮膚切片診斷為乾癬患者。","level":1},{"text":"(3)下列三項條件至少需符合二項：i.下背痛及晨間僵硬的症狀持續3個月以上，這些症狀無法因休息而緩解，但會隨運動改善。ii.腰椎前屈活動受限。iii.胸廓擴張受限。","level":1},{"text":"(4)X光(plain X ray)檢查需有薦腸關節炎：單側性二級以上、附有報告影印及 X 光影像光碟。","level":1},{"text":"(5)病患必須曾使用過至少2種非類固醇類消炎止痛劑(NSAIDs)進行充分的治療，但療效不彰。充分治療的定義為：使用最高建議劑量或最高耐受劑量的 NSAID 抗發炎藥物，在同一家醫院連續治療三個月以上，且每種 NSAID 至少使用四週以上，除非出現毒性而停藥，需以附表二十二之五為根據，記錄 NSAID 之毒性送審。","level":1},{"text":"(6)活動性疾病持續四週以上。 （需連續二次檢查BASDAI≧6、ESR > 28 mm/1 hr 及CRP > 1 mg/dL，且二次檢查之間隔需經過至少4週以上充分治療）","level":1},{"text":"4.Secukinumab每次使用劑量為150mg，起始於第0，1，2，3和4週，之後每4週給予維持劑量150mg。治療12週後，若 secukinumb 150mg 治療未達療效的病人(參考底下第8點療效定義)，劑量可增加為300mg。但對於曾以腫瘤壞死因子阻斷劑(anti-TNFα)未達療效，建議每次劑量為300mg，起始於第0，1，2，3和4週皮下注射，之後每4週給予300mg 劑量。(107/1/1、112/3/1)","level":0},{"text":"5.Ixekizumab 之起始劑量為第0週160mg，之後每4週80mg。(109/3/1)","level":0},{"text":"6.Certolizumab起始建議劑量為第0 週、第2週及第4週各投予400mg，之後每2週200mg。於懷孕哺乳期間若已接受其他生物製劑治療者，得改申請 certolizumab。若症狀嚴重程度已符合生物製劑申請條件但尚未接受生物製劑治療者，不需受傳統治療無效才得申請之限制，得於懷孕哺乳期申請 certolizumab。(110/7/1)","level":0},{"text":"7. Guselkumab之起始劑量為第0週及第4週投予100mg，之後每8週給予維持劑量100mg。(111/9/1)","level":0},{"text":"8. Brodalumab 起始於第0週投予 210 mg，接著於第1週及第2週投予210mg，之後每2週投予210mg。(112/12/1)","level":0},{"text":"9.Risankizumab之起始劑量於第0週及第4週投予150mg/mL，之後每12週給予維持劑量150mg/mL。(114/2/1)","level":0},{"text":"10.Bimekizumab每次使用劑量為160mg，每4週投予160mg 劑量。(115/5/1)","level":0},{"text":"11.療效評估與繼續使用：","level":0},{"text":"(1)初次使用者治療12週評估 BASDAI，惟 guselkumab、risankizumab 初次治療24週評估BASDAI：與使用前比較，出現50%以上的進步或減少2分以上，方得繼續使用。(111/9/1、114/2/1)","level":1},{"text":"(2)繼續使用者，需每12週評估一次，再次提出申請續用；惟 guselkumab 每16週評估一次、risankizumab 每24週評估一次，再次提出申請續用。(111/9/1、","level":1},{"text":"12.需排除使用的情形：應參照藥物仿單，重要之排除使用狀況包括﹝以下未列者參照仿單所載﹞：","level":0},{"text":"(1)懷孕或正在授乳婦女(certolizumab 除外) (110/7/1)","level":1},{"text":"(2)活動性感染症之病患","level":1},{"text":"(3)具高度感染機會之病患i.慢性腿部潰瘍之病患ii.未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)iii.過去12個月內曾罹患感染性關節炎者iv.曾有人工關節感染，若該人工關節未去除前，不可使用v.頑固性或復發性的胸腔感染疾病vi.具有留置導尿管之情形","level":1},{"text":"(4)惡性腫瘤或癌前狀態之病患﹝但不包括已經接受過充分治療達10年以上的惡性腫瘤﹞","level":1},{"text":"(5)多發性硬化症 (multiple sclerosis)","level":1},{"text":"13.需停止治療的情形如果發生下列現象應停止治療：","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者","level":1},{"text":"(2)不良事件：與藥物之使用有關或無關的事件，包括：i.惡性腫瘤ii.該藥物引起的嚴重毒性iii.懷孕(certolizumab 除外，其他暫時停藥即可)(110/7/1)iv.嚴重的間發性感染症﹝依嚴重性判斷可選擇暫時停藥﹞◎附表二十二之四：全民健康保險乾癬性脊椎病變使用生物製劑申請表◎附表二十二之五：NSAID 藥物副作用","level":1}],"limited":false,"revisions":["111/9/1","112/4/1","112/12/1","114/2/1","115/5/1","107/1/1","109/3/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-6","section":"8.2.4.6","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Etanercept（如 Enbrel）；adalimumab（如 Humira）；ustekinumab（如 Stelara）；secukinumab（如 Cosentyx）；ixekizumab（如 Taltz）；guselkumab（如 Tremfya）；brodalumab（如 Lumicef）；risankizumab（如 Skyrizi）；certolizumab（如 Cimzia）；spesolimab（如 Spevigo）；bimekizumab（如 Bimzelx）","drugs":[{"generic":"Etanercept","zh":"","brands":["Enbrel"]},{"generic":"adalimumab","zh":"","brands":["Humira"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]},{"generic":"ixekizumab","zh":"","brands":["Taltz"]},{"generic":"guselkumab","zh":"","brands":["Tremfya"]},{"generic":"brodalumab","zh":"","brands":["Lumicef"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"certolizumab","zh":"","brands":["Cimzia"]},{"generic":"spesolimab","zh":"","brands":["Spevigo"]},{"generic":"bimekizumab","zh":"","brands":["Bimzelx"]}],"funding":"nhi","summary":"115/5/1)：用於乾癬治療部分","provisions":[{"text":"115/5/1)：用於乾癬治療部分","level":0}],"limited":false,"revisions":[],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-6-1","section":"8.2.4.6.1","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Etanercept（如 Enbrel）；adalimumab（如 Humira）；ustekinumab（如 Stelara）；secukinumab（如 Cosentyx）；ixekizumab（如 Taltz） ； guselkumab（如 Tremfya） ；brodalumab（如 Lumicef）；risankizumab（如 Skyrizi） ； certolizumab（如 Cimzia） ；bimekizumab（如 Bimzelx） ：用於乾癬","drugs":[{"generic":"Etanercept","zh":"","brands":["Enbrel"]},{"generic":"adalimumab","zh":"","brands":["Humira"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"secukinumab","zh":"","brands":["Cosentyx"]},{"generic":"ixekizumab","zh":"","brands":["Taltz"]},{"generic":"guselkumab","zh":"","brands":["Tremfya"]},{"generic":"brodalumab","zh":"","brands":["Lumicef"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"certolizumab","zh":"","brands":["Cimzia"]},{"generic":"bimekizumab","zh":"","brands":["Bimzelx"]}],"funding":"nhi","summary":"治療部分","provisions":[{"text":"治療部分","level":0},{"text":"1.給付條件：限符合下列(1)或(2)任一情形使用：","level":0},{"text":"(1)用於經照光治療及其他全身性治療無效，或因醫療因素而無法接受其他系統性治療之全身慢性中、重度之乾癬或頑固之掌蹠性乾癬，且影響功能之患者。","level":1},{"text":"Ⅰ.所稱”慢性”，指病灶持續至少6個月，且 Psoriasis area severity index(PASI) ≧10 (不適用 PASI 測定如膿疱性乾癬，則以範圍 ≧10%體表面積)。(附表二十四之二)","level":3},{"text":"Ⅱ.頑固之掌蹠性乾癬：指非膿疱性掌蹠廣泛性角化，嚴重影響行走或日常作習，申請時需附照片以供審查。照片應包括前、後、左、右至少四張，並視需要加附頭部、掌、蹠照片。","level":3},{"text":"Ⅲ.慢性紅皮症乾癬：範圍≧75%體表面積，病史超過1年，以 cyclosporin 足量（5mg/kg/d，除非有明顯不良反應）治療6個月以上，停藥未滿3個月即復發到PASI＞10或體表面積＞30%（需經皮膚科醫師評估） ，可不經照光治療，只需methotrexate 及 acitretin 治療無效後直接申請。 （101/12/1）","level":3},{"text":"Ⅳ.所稱治療無效，指治療後嚴重度仍符合上列第(Ⅰ)及第(Ⅱ)點情況，或 PASI或體表面積改善＜50%。（101/5/1）i.治療必須包括足量之照光治療及包括以下兩種系統性治療之至少兩種，包括methotrexate、acitretin、cyclosporin、apremilast、deucravacitinib。（101/12/1、113/3/1、114/6/1）ii.治療需至少使用3個月，但育齡女性，得不經 acitretin 使用。iii.照光治療應依學理，如光化療法(PUVA)及窄頻 UVB(nb-UVB)必須每週至少2次，寬頻 UVB 併用焦油每週至少3次，並依學理逐漸增加至有效可忍受劑量。申請時必須附病歷影印及詳細照光劑量紀錄。iv.Methotrexate 合理劑量需達每週15mg, cyclosporin 為2.5-5 mg/kg/d,acitretin 為0.3-1 mg/kg/d。但若因為藥物毒性無法耐受，使用劑量可酌情降低。","level":3},{"text":"Ⅴ.所稱無法接受治療：i.Methotrexate：指因肝功能異常或切片第三期 a 異常，經6個月後切片仍無改善，或第三期 b 以上之肝切片異常，病毒性肝炎帶原或腎功能異常而無法使用 methotrexate 治療者。ii.Acitretin：指有明顯肝功能異常、高血脂無法有效控制，或 cyclosporin有效但停藥後迅速復發，已持續使用超用1年，或已產生腎毒性經減量後無法有效控制者。","level":3},{"text":"(2)用於全身型急性膿疱性乾癬(限經衛生主管機關核准許可證登載此適應症之藥品)：經確診為全身型急性膿疱性乾癬，且符合以下所有條件者，即可申請有全身型膿疱性乾癬適應症之生物製劑，每次申請以4週為原則，供當次或下次發作使用，之後申請得依前次病情需要(經生物製劑治療後膿疱仍持續超過4週)可申請延長至最長8週用藥。下次申請使用，需相隔至少12週。 （110/5/1）","level":1},{"text":"Ⅰ.18歲以上且有懷孕可能之患者。","level":3},{"text":"Ⅱ.伴有膿疱之紅腫部位侵犯體表面積>10%且伴隨系統性症狀包括發燒及白血球增多症等。","level":3},{"text":"2.需經事前審查核准後使用：","level":0},{"text":"(1)初次申請時，以6個月為1個療程，肝腎功能不佳者，必須先經照光及使用apremilast 或 deucravacitinib 無效後，始得申請使用，持續使用時每6個月需再申報一次，且應於期滿前1個月提出。 （101/12/1、113/3/1、114/6/1）","level":1},{"text":"(2)紅皮症乾癬病患以6個月為限，於6個月療程結束後，應回復使用 cyclosporin，除非產生腎功能異常(Creatinine 基礎值上升≧30%)，或其他無法有效控制之副作用，減藥後乾癬仍無法有效控制。 （101/12/1）","level":1},{"text":"(3)Etanercept初期3個月可使用50mg biw，之後則為25mg biw，且於12週時，需先行評估，至少有 PASI25療效。","level":1},{"text":"(4)Adalimumab初次投予為80mg，之後則為40mg qow，且於12週時，須先行評估，至少有 PASI25療效。(100/7/1)","level":1},{"text":"(5)Ustekinumab：i.初次及4週後投予45mg，之後則為45mg q12w（對於初次使用45mg 反應不完全*，或體重大於100公斤病患，得初次及4週後投予90mg，之後則為90mgq12w） ，且於16週時，需先行評估，至少有 PASI25療效。(101/5/1、109/9/1)註*：治療後雖然有達成 PASI50療效，但仍有 PASI>1，體表面積>3，或是病灶存在外露明顯部位(臉部、指甲、手部)者。ii.若使用劑量為90mg（含）以上，限使用90mg(1mL)規格量。(109/9/1)","level":1},{"text":"(6)Secukinumab 起始於第0,1,2,3,4週投予300mg，接著於第4週開始於每4週投予300mg (體重≤60kg，投予150 mg 的劑量)，且於12週時，須先行評估，至少有PASI25療效。","level":1},{"text":"(7)Ixekizumab起始於第0週投予160 mg，接著於第2,4,6,8,10,12週投予80mg，之後每4週投予80mg，且於12週時，須先行評估，至少有 PASI25療效。(107/8/1)","level":1},{"text":"(8)Guselkumab起始於第0週投予100 mg，接著於第4週投予100mg，之後每8週投予100mg，且於12週時，須先行評估，至少有 PASI25療效。(108/3/1)","level":1},{"text":"(9)Brodalumab起始於第0週投予210 mg，接著於第1週及第2週投予210mg，之後每2週投予210mg，且於12週時，須先行評估，至少有 PASI25療效。(108/4/1)","level":1},{"text":"(10)Risankizumab 起始於第0週投予150mg，接著於第4週投予150mg，之後每12週投予150mg。且於16週時，須先行評估至少有 PASI 75療效。(109/12/1)","level":1},{"text":"(11)Certolizumab 起始建議劑量為第0 週、第2週及第4週各投予400mg，之後每2週200 mg。於懷孕哺乳期間若已接受其他生物製劑治療者，得改申請certolizumab。若症狀嚴重程度已符合生物製劑申請條件但尚未接受生物製劑治療者，不須受照光治療及其他系統性治療無效才得申請之限制，得於懷孕哺乳期申請 certolizumab。 (110/7/1)","level":1},{"text":"(12)Bimekizumab起始於第0,4,8,12,16週投予 320mg，之後每8週投予 320mg，且於16 週時，須先行評估，至少有 PASI25 療效。(115/5/1)","level":1},{"text":"(13)原先使用 cyclosporin 控制有效且腎功能異常(Creatinine 基礎值上升≧30%)者，於6個月療程結束後，應回復使用 cyclosporin，除非產生腎功能異常，或其他無法有效控制之副作用，減藥後乾癬仍無法有效控制，否則下次申請應於1年後。","level":1},{"text":"(14)初次申請後每6個月須再次申請續用，續用時，與初次治療前之療效達 PASI50方可使用；其中 risankizumab 續用時，與初次治療前之療效達 PASI 75方可使用續用；且 etanercept 再次申請時僅限使用25mg biw 之劑量。停藥超過3個月再申請者，視同新申請案件，否則視為續用案件。 （101/12/1、104/4/1、109/12/1）","level":1},{"text":"3.使用生物製劑時，考慮其於乾癬療效可能較慢，及立即停藥之可能反彈現象，治療前兩個月得合併使用 cyclosporine 及照光治療，但生物製劑療效出現時即應逐漸停用。 (101/5/1、105/9/1、107/8/1)","level":0},{"text":"4.需排除使用的情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懐孕或正在授乳的婦女(certolizumab 除外) (110/7/1)。","level":1},{"text":"(2)罹患活動性的感染症的病患。","level":1},{"text":"(3)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)","level":1},{"text":"(4)身上帶有人工關節者，罹患或先前曾罹患過嚴重的敗血病(sepsis)者。","level":1},{"text":"(5)惡性腫瘤或具有癌症前兆(pre-malignancy)的病患。","level":1},{"text":"(6)免疫功能不全者(immunodeficiency) 。","level":1},{"text":"5.需停止治療情形，如果發生下列現象應停止治療：","level":0},{"text":"(1)不良事件，包括：i.惡性腫瘤。ii.該藥物引起的嚴重性毒性。iii.懷孕（certolizumab 除外，其他暫時停藥即可） 。(110/7/1)。iv.嚴重的間發性感染症（intercurrent infection） （暫時停藥即可） 。","level":1},{"text":"(2)療效不彰：患者經過6個月治療（初次療程）後未達療效者，療效定義指 PASI 或體表面積改善未達50%。","level":1},{"text":"6.暫緩續用之相關規定：(104/4/1、110/5/1）","level":0},{"text":"(1)暫緩續用時機：使用生物製劑治療2年後符合 PASI≦10者，但有連續兩次暫緩用藥後復發病史者（停藥後6個月內PASI>10或50%復發）不在此限。(110/5/1)","level":1},{"text":"(2)因使用一種生物製劑治療後療效不彰(PASI>10)，而轉用另一種不同藥理機轉之生物製劑，以轉用後者之起始日重新計算2年後開始減量之時機。但因無法忍受副作用而轉用相同藥理機轉之生物製劑，轉用前後所使用生物製劑之期間均應計入。","level":1},{"text":"7.暫緩續用後若疾病再復發，可重新申請使用，須符合至少有50%復發(需附上次療程治療前、後，及本次照片，計算方式係以最近一次新療程開始時的 PASI 嚴重度，減去療程結束時的 PASI 嚴重度，有50%復發)。(104/4/1、110/5/1）","level":0},{"text":"8.平行轉換時機：(110/5/1)","level":0},{"text":"(1)使用一種生物製劑治療後，雖 PASI<10且有 PASI 50療效，但治療後仍有 PASI>1、體表面積>3% 或是病灶存在外露明顯部位(如頭皮、臉部、手指甲、手部)且明顯影響生活品質者，得於每半年續用申請時，平行轉用另一種生物製劑(用法用量依照仿單)，但前後所使用生物製劑之期間均應計入2年給付時間合併計算。","level":1},{"text":"(2)申請此項平行轉換者，申請續用時，有效性比較基準點為此2年療程起始時之嚴重度。◎附表二十四之一：全民健康保險乾癬使用生物製劑申請表(105/9/1、107/8/1、◎附表二十四之二：全民健康保險乾癬（慢性紅皮症乾癬部分）使用生物製劑申請表◎附表二十四之三：乾癬面積暨嚴重度指數【Psoriasis Area Severity Index(PASI)】◎附表二十四之四：全民健康保險乾癬(全身型急性膿疱性乾癬部分)使用生物製劑申請表(110/5/1)","level":1}],"limited":false,"revisions":["98/11/1","100/7/1","101/5/1","101/12/1","102/1/1","104/4/1","105/9/1","107/8/1","108/3/1","108/4/1","109/9/1","109/12/1","110/5/1","110/7/1","113/3/1","114/6/1","115/5/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":false,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-6-2","section":"8.2.4.6.2","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Spesolimab（如 Spevigo） ：用於全身型急性發作膿疱性乾癬治","drugs":[{"generic":"Spesolimab","zh":"","brands":["Spevigo"]}],"funding":"nhi","summary":"療部分","provisions":[{"text":"療部分","level":0},{"text":"1.限皮膚科專科醫師及風濕免疫科專科醫師使用。","level":0},{"text":"2.經確診為具有IL36RN 突變之全身型急性膿疱性乾癬，且符合以下所有條件者：","level":0},{"text":"(1)中重度之 GPP(GPPGA 總分≥ 3且 GPPGA 膿疱項目分數≥ 2)。","level":1},{"text":"(2)伴有膿疱之紅腫部位侵犯體表面積>10%。","level":1},{"text":"3.需經事前審查核准後使用，申請時需檢附所有病灶照片及 IL36RN 檢測報告，每次申請參考仿單建議劑量，以一次給予900毫克為原則。","level":0},{"text":"4.若於給予初始劑量的1週後急性發作症狀持續（GPPGA 總分≥2 且 GPPGA 單項膿疱評分≥2） ，可再給予額外一劑900毫克。","level":0},{"text":"5.需檢附IL36RN 突變檢測報告，且需符合全民健康保險藥品給付規定之通則十二。","level":0}],"limited":false,"revisions":["113/7/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-7","section":"8.2.4.7","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）、infliximab（如 Remicade）、vedolizumab（如 Entyvio）、ustekinumab（如 Stelara）、risankizumab（如 Skyrizi）、 upadacitinib（如 Rinvoq） ：用於克隆氏症治療部分","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"infliximab","zh":"","brands":["Remicade"]},{"generic":"vedolizumab","zh":"","brands":["Entyvio"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]}],"funding":"nhi","summary":"Adalimumab（如 Humira）、infliximab（如 Remicade）、vedolizumab（如 Entyvio）、ustekinumab（如 Stelara）、risankizumab（如 Skyrizi）、 upadacitinib（如 Rinvoq） ：用於克隆氏症治療部分","provisions":[],"limited":false,"revisions":["100/7/1","102/1/1","105/10/1","106/5/1","106/10/1","108/10/1","109/9/1","112/8/1","113/7/1","113/9/1","113/11/1","114/8/1","114/9/1"],"deleted":false,"flags":{"priorAuth":false,"cultureRequired":false,"specialist":false,"inpatientOnly":false,"infectionScreening":false},"tags":[],"sourceConfirmed":true,"isHeader":true},{"id":"sec-8-2-4-7-1","section":"8.2.4.7.1","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）、infliximab（如 Remicade）、vedolizumab（如 Entyvio）、ustekinumab（如 Stelara）、risankizumab（如 Skyrizi）、 upadacitinib（如 Rinvoq） ：成人治","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"infliximab","zh":"","brands":["Remicade"]},{"generic":"vedolizumab","zh":"","brands":["Entyvio"]},{"generic":"ustekinumab","zh":"","brands":["Stelara"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]},{"generic":"upadacitinib","zh":"","brands":["Rinvoq"]}],"funding":"nhi","summary":"療部分","provisions":[{"text":"療部分","level":0},{"text":"1.限具有消化系專科證書者處方。","level":0},{"text":"2.須經事前審查核准後使用。","level":0},{"text":"3.須經診斷為成人克隆氏症，領有克隆氏症重大傷病卡，並符合下列條件之一；且申請時應附上影像診斷評估報告。","level":0},{"text":"(1)克隆氏症病情發作，經5-aminosalicylic acid 藥物 (sulfasalazine,mesalamine, balsalazide)、類固醇、及/或免疫抑制劑(azathioprine, 6-mercaptopurine, methotrexate)充分治療超過六個月，仍然無法控制病情(CDAI≧300)或產生嚴重藥物副作用時，且病況不適合手術者。","level":1},{"text":"(2)克隆氏症經5-aminosalicylic acid 藥物如(sulfasalazine, mesalamine,balsalazide)、類固醇、及免疫抑制劑(azathioprine, 6-mercaptopurine,methotrexate)充分治療超過六個月，或外科手術治療，肛門周圍廔管或腹壁廔管仍無法癒合且 CDAI≧100者。","level":1},{"text":"(3)克隆氏症經5-aminosalicylic acid 藥物如(sulfasalazine, mesalamine,balsalazide)、類固醇、及免疫抑制劑(azathioprine, 6-mercaptopurine,methotrexate)充分治療，仍於一年內因克隆氏症之併發症接受二次(含)以上之手術治療且 CDAI≧100者。","level":1},{"text":"4.療效評估與繼續使用：","level":0},{"text":"(1)初次申請：adalimumab 以6週(使用4劑為限)；infliximab 靜脈注射以6週(使用3劑為限) ，或以2週(使用靜脈注射2劑為限)；vedolizumab 以6週(使用靜脈注射3劑為限)，或以2週(使用靜脈注射2劑為限)；ustekinumab 以8週(使用靜脈注射1劑為限)，risankizumab 以8週(使用靜脈注射3劑為限)；upadacitinib 以12週為限(限用於其他生物製劑治療失敗或無法耐受之中至重度克隆氏症病人，另使用前應排除有血栓風險之病患，且不建議與azathioprine 合併使用)完成誘導治療後，達到有效緩解之誘導或部份有效緩解之誘導，方得申請繼續使用。誘導緩解失敗者，得提出申請轉換他類生物製劑，然同一療程不得合併使用。(106/5/1、106/10/1、109/9/1、i 有效緩解之誘導：CDAI≦150或廔管痊癒。ii 部份有效緩解之誘導：CDAI 分數下降≧100或廔管數量減少。","level":1},{"text":"(2)繼續使用者:adalimumab需每24週(使用12劑)；infliximab 靜脈注射需16週(使用2劑)或24週(使用3劑)，或第6週起，每24週(使用皮下注射12劑)；vedolizumab 需16週(使用靜脈注射2劑)或24週(使用靜脈注射3劑)，或第6週起，每24週(使用皮下注射12劑)；ustekinumab 需每24週(使用2劑或3劑)；risankizumab 需每16週(使用皮下注射2劑)或24週(使用皮下注射3劑)；upadacitinib 需每24週評估一次。評估仍維持前一次療程有效或部份有效緩解時之 CDAI 分數者，方得提出申請續用。Ustekinumab 治療達到部分有效緩解者，經消化系專科醫師評估後，得申請繼續使用，以每隔8週給予皮下注射維持劑量90mg。每次申請 adalimumab 以24週(使用12劑)；infliximab 以16週(使用2劑)或24週(使用3劑)；vedolizumab 以16週(使用靜脈注射2劑)或24週(使用靜脈注射3劑)，或每24週(使用皮下注射12劑)；ustekinumab 以24週(使用2劑或3劑)；risankizumab 以每16週(使用皮下注射2劑)或24週(使用皮下注射3劑)為限；upadacitinib 以24週為限。(106/5/1、106/10/1、","level":1},{"text":"(3)總療程:adalimumab 治療54週使用28劑；infliximab 靜脈注射治療46週使用8劑(療效持續至54週)；infliximab 靜脈注射搭配皮下注射共治療52週，使用靜脈注射2劑，皮下注射24劑(療效持續至54週)；vedolizumab 靜脈注射治療46週，使用靜脈注射8劑(療效持續至54週)，或 vedolizumab 靜脈注射搭配皮下注射共治療52週，使用靜脈注射2劑，皮下注射24劑(療效持續至54週)；ustekinumab 治療44週使用5劑或 48週使用7劑；risankizumab 靜脈注射搭配皮下注射共治療44週，使用靜脈注射3劑，皮下注射5劑(療效持續至52週)；upadacitinib 治療60週。總療程結束後，必須至少再間隔超過3個月後，因病情復發或以其他治療難以控制達上述3.之(1)(2)(3)之標準(惟其中經5-aminosalicylic acid 藥物、類固醇、及/或免疫抑制劑充分治療，連續超過3個月)才能再次提出申請使用。 （105/10/1、106/5/1、106/10/1、","level":1},{"text":"(4)連續2次於總療程結束後復發(CDAI≥300) 者，且第2次復發於藥效終止後3個月內發生，則可持續使用，惟需每24週提出續用事前審查。仍維持前一療程有效或部分有效緩解之 CDAI 分數，才可繼續申請事前審查。連續2年(4次評估)達到 CDAI<150，則應考慮停藥。 （113/7/1）","level":1},{"text":"(5) Upadacitinib：最初12 週每日45mg，限用45mg 規格量品項，作為緩解之誘導；之後調整劑量為每日15mg，可持續治療至60週，作為緩解之維持。","level":1},{"text":"5.使用劑量：","level":0},{"text":"(1)Adalimumab：原則上，最初第一劑160mg，兩週後第二劑80mg，第四週之第三劑40mg，作為緩解之誘導；之後每隔兩週給予維持劑量40mg，可持續治療至54週(總共使用28劑)，作為緩解之維持。 （105/10/1、106/5/1）","level":1},{"text":"(2)Infliximab：原則上，第0、2、6週給予靜脈輸注5mg/kg 作為緩解之誘導；之後每隔8週給予維持劑量5mg/kg，可持續治療至第46週 (總共使用8劑，療效持續至54週)，作為緩解之維持。或第0、2週給予靜脈注射5mg/kg 作為緩解之誘導；第6週開始給予皮下注射維持劑量120mg，之後每隔2週給予皮下注射維持劑量120 mg，可持續治療至第52週(總共使用靜脈注射2劑，皮下注射24劑，療效持續至54週)，作為緩解之維持。 （106/5/1、114/9/1）","level":1},{"text":"(3) Vedolizumab：原則上，第0、2、6週給予靜脈輸注300mg 作為緩解之誘導；之後每隔8週給予維持劑量300mg，可持續治療至第46週(總共使用靜脈輸注8劑，療效持續至54週)，作為緩解之維持。或第0、2週給予靜脈輸注300mg 作為緩解之誘導；第6週開始給予皮下注射維持劑量108mg，之後每隔2週給予皮下注射維持劑量108mg，可持續治療至第52週 (總共使用靜脈注射2劑，皮下注射24劑，療效持續至54週)，作為緩解之維持。 （106/10/1、112/8/1）","level":1},{"text":"(4)Ustekinumab：原則上，第0週給予靜脈輸注作為緩解之誘導（體重≤55kg 使用260 mg;大於55kg 至85kg 使用390mg;>85kg 者使用520mg） ；之後每隔12週或每隔8週給予皮下注射維持劑量90mg，可持續治療至第44週或第48週(總共使用5劑或7劑，療效持續至56週)，作為緩解之維持。(109/9/1、113/11/1)","level":1},{"text":"(5)Risankizumab：原則上，第0、4、8週給予靜脈輸注600mg 作為緩解之誘導；之後每隔8週給予皮下注射維持劑量360mg，可持續治療至第44週(總共8劑，使用靜脈注射3劑，皮下注射5劑，療效持續至52週)，作為緩解之維持。註：ustekinumab 若使用維持劑量為90mg（含）以上，限使用90mg(1mL)規格量。","level":1},{"text":"6.須排除使用之情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)懷孕或正在授乳的婦女。","level":1},{"text":"(2)罹患活動性感染症(active infection)之病患。","level":1},{"text":"(3)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。(102/1/1)","level":1},{"text":"(4)惡性腫瘤或具有癌症前兆(pre-malignancy)之病患(但不包括已經接受過充分治療達10年以上的惡性腫瘤)。","level":1},{"text":"(5)具高度感染機會之病患：慢性腿部潰瘍、導尿管置留、身上有引流管、人工關節感染，該人工關節尚未摘除者、頑固性或復發性之胸腔感染症病患。","level":1},{"text":"(6)多發性硬化症(multiple sclerosis)。","level":1},{"text":"7.須停止治療的情形","level":0},{"text":"(1)療效不彰：療效評估未達繼續使用標準者。","level":1},{"text":"(2)其他事項：包括i 惡性腫瘤ii 該藥物引起之嚴重毒性 (白血球過低、嚴重過敏)iii 懷孕(暫時停藥即可)iv 嚴重間發性感染(暫時停藥即可)。◎附表二十六之一：全民健康保險克隆氏症使用生物製劑申請表(106/5/1、◎附表二十六之二：CDAI（Crohn’s disease activity index）","level":1}],"limited":false,"revisions":["105/10/1","106/5/1","106/10/1","108/10/1","109/9/1","112/8/1","113/7/1","113/9/1","113/11/1","114/8/1","114/9/1","113/10/1"],"deleted":false,"flags":{"priorAuth":true,"cultureRequired":true,"specialist":true,"inpatientOnly":false,"infectionScreening":true},"tags":[],"sourceConfirmed":true,"isHeader":false},{"id":"sec-8-2-4-7-2","section":"8.2.4.7.2","sectionConfidence":"high","group":"8.2","groupTitle":"免疫調節劑 Immunomodulators","category":"immunomodulator","title":"Adalimumab（如 Humira）、infliximab（如 Remicade 靜脈注射）、 risankizumab（如 Skyrizi） ：兒童治療部分","drugs":[{"generic":"Adalimumab","zh":"","brands":["Humira"]},{"generic":"infliximab","zh":"","brands":["Remicade 靜脈注射"]},{"generic":"risankizumab","zh":"","brands":["Skyrizi"]}],"funding":"nhi","summary":"限具消化系專科證書之內科、兒科專科醫師處方使用。(108/10/1)","provisions":[{"text":"1.限具消化系專科證書之內科、兒科專科醫師處方使用。(108/10/1)","level":0},{"text":"2.須經事前審查核准後使用。","level":0},{"text":"3.6歲以上(risankizumab 限使用於16歲以上未滿18歲)，經診斷為小兒克隆氏症且領有重大傷病證明，並排除第6項之情形及符合下列條件之一；且申請時應附上影像診斷評估報告；(111/2/1、113/9/1)。","level":0},{"text":"(1)克隆氏症病情發作，經皮質類固醇及免疫抑制劑(azathioprine, 6-mercaptopurine, methotrexate)充分治療超過三個月，仍然無法控制病情(PCDAI>30)或產生過敏或其他嚴重副作用者。","level":1},{"text":"(2)小兒克隆氏症病童腹部或肛門廔管合併生長遲緩者(height velocity Z Score -1to -2.5)。","level":1},{"text":"(3)小兒克隆氏症病情發作且生長遲緩(height velocity Z Score -1 to -2.5)病童，經營養治療與免疫抑制劑治療失敗者。","level":1},{"text":"4.療效評估與繼續使用：","level":0},{"text":"(1)初次申請 adalimumab 以6週(使用4劑為限)；infliximab 以6週(使用3劑為限)；risankizumab 以8週(使用靜脈注射3劑為限)，治療第3劑後，達到臨床反應(PCDAI降低>=15)者，方得申請繼續使用。誘導緩解失敗者，得提出申請轉換他類生物製劑，然同一療程不得合併使用。 （106/5/1、113/9/1）","level":1},{"text":"(2)繼續使用者: adalimumab 需每24週(使用12劑)；infliximab 需每16週(使用2劑)或每24週(使用3劑)；risankizumab 需每16週(使用皮下注射2劑)或每24週(使用皮下注射3劑)評估一次。評估仍維持前一次療程有效或部份有效緩解時之 PCDAI分數者，方得提出申請續用。每次申請 adalimumab 以16週(使用8劑)；infliximab以每16週(使用2劑)或每24週(使用3劑)；risankizumab 以每16週(使用2劑)或每24週(使用3劑)為限。 （106/5/1、108/10/1、113/9/1）","level":1},{"text":"(3)總療程:adalimumab 治療54週使用28劑；infliximab 治療46週使用8劑 (療效持續至54週)；risankizumab 治療44週使用8劑，靜脈注射3劑，皮下注射5劑(療效持續至52週)。必須至少再間隔超過3個月後，因病情復發或以其他治療難以控制達上述3.之(1)(2)(3)之標準才能再次提出申請使用。 （106/5/1、108/10/1、","level":1},{"text":"(4)連續2次於總療程結束後復發者，且第2次復發於藥效終止後3個月內發生，則可持續使用，惟需每24週提出續用事前審查。連續2年(4次評估)達到 PCDAI<10分則應考慮停藥。 （113/7/1）","level":1},{"text":"5.使用劑量：","level":0},{"text":"(1)adalimumab：體重>=40公斤者，最初第一劑160mg，兩週後第二劑 80mg，第四週給予第三劑40mg，之後每隔兩週給予維持劑量40mg；體重<40公斤者，最初第一劑80mg，兩週後第二劑40mg，第四週給予第三劑20mg，之後每隔兩週給予維持劑量20mg。","level":1},{"text":"(2)Infliximab：第0.2.6週給予靜脈輸注5mg/kg 作為緩解之誘導，之後每8週給予5mg/kg。可持續治療至第46週 (總共使用8劑，療效持續至54週)，作為緩解之維持。 （106/5/1）","level":1},{"text":"(3)Risankizumab：第0、4、8週給予靜脈輸注600mg 作為緩解之誘導，之後每8週給予皮下注射360mg，可持續治療至第44週 (總共8劑，使用靜脈注射3劑，皮下注射5劑，療效持續至52週)，作為緩解之維持。 （113/9/1）","level":1},{"text":"6.須排除使用之情形應參照藥物仿單，重要之排除使用狀況包括：","level":0},{"text":"(1)罹患活動性感染症(active infection)之病患。","level":1},{"text":"(2)未經完整治療之結核病的病患（包括潛伏結核感染治療未達四週者，申請時應檢附潛伏結核感染篩檢紀錄及治療紀錄供審查） 。","level":1},{"text":"(3)惡性腫瘤或具有癌症前兆(pre-malignancy)之病患。","level":1},{"text":"(4)具高度感染機會之病患：慢性腿部潰瘍、導尿管置留、身上有引流管、頑固性或復發性之胸腔感染症病患。","level"
